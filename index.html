<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eksperimen Teks Interaktif ala Al-Qur'an Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f7f6;
            max-width: 500px;
            margin: 0 auto;
        }
        .box-pembuat {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        /* Style Hyperlink Terisolasi */
        .hyperlink-teks {
            color: #0056b3;
            text-decoration: underline;
            font-weight: bold;
            font-size: 16px;
            display: inline-block;
            cursor: pointer;
        }
        .box-hasil {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #28a745;
            display: none;
        }
        ul {
            padding-left: 20px;
            margin-top: 10px;
        }
        li {
            margin: 8px 0;
        }
    </style>
</head>
<body>

    <!-- 1. AREA KOTAK PEMBUAT TEKS -->
    <div class="box-pembuat">
        <label>Ketik Teks Buku:</label>
        <input type="text" id="inputTeksBuku" placeholder="Contoh: Bacaan Materi 1 atau Ggg">
        
        <button type="button" onclick="buatHyperlinkLangsung()">🔗 Buat Menjadi Teks Hyperlink</button>
    </div>

    <!-- 2. DROPDOWN UTAMA SEBAGAI PENGENDALI KELOMPOK -->
    <label>Pilih Menu Kategori:</label>
    <select id="menuDropdown" onchange="renderDaftarBuku()">
        <option value="">--pilih--</option>
        <option value="A">Kelompok A</option>
        <option value="B">Kelompok B</option>
    </select>

    <!-- 3. AREA KELOMPOK TUJUAN (Menampung Data Anak Cucu) -->
    <div id="areaCucuCucu" class="box-hasil">
        <h4 style="margin:0;">Data Anak Kelompok <span id="namaKelompokAktif"></span></h4>
        <!-- Daftar teks murni dan link akan digambar di dalam tag UL ini -->
        <ul id="listCucu"></ul>
    </div>

    <script>
        // SYSTEM AL-QUR'AN DIGITAL: Data bawaan dikunci langsung di memori Array internal
        let databaseBukuStatis = [
            { judul: "Materi Bawaan Asli 1", kelompok: "A" },
            { judul: "Materi Bawaan Asli 2", kelompok: "A" },
            { judul: "Materi Kelompok B Lainnya", kelompok: "B" }
        ];

        // FUNGSI UTAMA TOMBOL BIRU
        function buatHyperlinkLangsung() {
            const kolomInput = document.getElementById('inputTeksBuku');
            const dropdown = document.getElementById('menuDropdown');

            const nilaiTeks = kolomInput.value.trim();
            if (nilaiTeks === "") {
                alert("Silakan ketik teks terlebih dahulu di dalam kotak!");
                return;
            }

            kolomInput.blur(); // Otomatis menutup keyboard HP

            // SISIPKAN DATA BARU: Struktur teks diubah menjadi tautan aman terisolasi 
            // Tag pembuka <a> langsung ditutup rapat </a> agar tidak memengaruhi teks lain
            const dataBaru = {
                judul: `<a href="#" class="hyperlink-teks" onclick="aksiKlikLink('${nilaiTeks}')">🔗 ${nilaiTeks}</a>`,
                kelompok: "A" // Mengunci tujuan ke Kelompok A
            };
            
            // Masukkan data baru tersebut ke dalam memori array statis aplikasi
            databaseBukuStatis.push(dataBaru);

            // Alihkan pilihan menu dropdown secara otomatis ke Kelompok A
            if (dropdown) {
                dropdown.value = "A";
                // Jalankan fungsi gambar layar secara manual untuk memproses data baru
                renderDaftarBuku(); 
            }

            // Bersihkan kembali kotak ketik teks atas
            kolomInput.value = "";
        }

        // RENDERING SYSTEM: Fungsi menggambar ulang isi layar berdasarkan menu pilihan kelompok
        function renderDaftarBuku() {
            const dropdown = document.getElementById('menuDropdown');
            const areaBox = document.getElementById('areaCucuCucu');
            const wadahList = document.getElementById('listCucu');
            const labelKelompok = document.getElementById('namaKelompokAktif');

            const kategoriDipilih = dropdown.value;

            // Jika tidak ada kelompok yang dipilih, sembunyikan kotak daftar bawah
            if (kategoriDipilih === "") {
                areaBox.style.display = "none";
                return;
            }

            // Bersihkan layar terlebih dahulu sebelum menggambar data yang disaring
            wadahList.innerHTML = "";
            labelKelompok.innerText = kategoriDipilih;
            areaBox.style.display = "block";

            // Saring database internal dan tampilkan teks yang sesuai kelompoknya
            databaseBukuStatis.forEach(function(buku) {
                if (buku.kelompok === kategoriDipilih) {
                    const barisLi = document.createElement('li');
                    // Mengisi baris list secara aman tanpa kebocoran link ke teks sekitarnya
                    barisLi.innerHTML = buku.judul; 
                    wadahList.appendChild(barisLi);
                }
            });
        }

        // FUNGSI KLIK: Ketika teks interaktif hasil buatan Anda di-klik oleh pembaca
        function aksiKlikLink(namaKata) {
            alert(`Sistem Al-Qur'an Berhasil Merespons! Anda mengklik tautan interaktif: "${namaKata}"`);
        }

        // Jalankan render awal saat halaman pertama kali dibuka
        renderDaftarBuku();
    </script>
</body>
</html>

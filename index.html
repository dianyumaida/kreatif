<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushaf & Buku Digital 3D Fix</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            justify-content: center;
        }
        h1 { margin-bottom: 5px; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
        p { margin-top: 0; color: #95a5a6; font-size: 14px; margin-bottom: 30px; }

        /* Area Panggung Buku (3D Render) */
        .book-stage {
            width: 360px; /* Ukuran disesuaikan agar pas di layar HP & Laptop */
            height: 480px;
            perspective: 2000px;
            position: relative;
            transition: transform 0.6s ease;
        }

        /* Geser panggung ke kanan saat buku terbuka */
        .book-stage.opened {
            transform: translateX(180px);
        }

        /* Kontainer Buku Utama */
        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Komponen Lembaran Kertas Buku */
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Atur urutan tumpukan awal (Lapis Kertas) */
        #page1 { z-index: 3; }
        #page2 { z-index: 2; }
        #page3 { z-index: 1; }

        /* Sisi Depan dan Sisi Belakang Lembaran Kertas */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
        }

        .front { border-radius: 0 8px 8px 0; }

        /* Sisi belakang lembar dibalik 180 derajat */
        .back {
            transform: rotateY(180deg);
            border-radius: 8px 0 0 8px;
        }

        /* Efek Bayangan Lipatan Buku di Tengah */
        .front::after {
            content: ''; position: absolute; left: 0; top: 0; width: 20px; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
        }
        .back::after {
            content: ''; position: absolute; right: 0; top: 0; width: 20px; height: 100%;
            background: linear-gradient(-90deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
        }

        /* Efek Putar Lembaran ke Kiri */
        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Penyesuaian lapisan z-index setelah halaman dibalik agar tidak bentrok */
        #page1.flipped { z-index: 4; }
        #page2.flipped { z-index: 5; }

        /* Panel Tombol Navigasi Bawah */
        .controls-container {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 25px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        button, input {
            padding: 12px 20px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: bold;
        }
        input {
            background-color: #ffffff;
            color: #2c3e50;
            width: 180px;
        }
        button {
            background-color: #2980b9;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #3498db; }
        .btn-nav { background-color: #e67e22; }
        .btn-nav:hover { background-color: #f39c12; }
    </style>
</head>
<body>

    <h1>📖 Aplikasi Mushaf & Buku Digital 3D</h1>
    <p>Gunakan tombol Navigasi di bawah untuk membalik halaman buku</p>

    <!-- Panggung Buku -->
    <div class="book-stage" id="stage">
        <div class="book">
            
            <!-- LEMBAR 1: COVER DEPAN (Gambar A) -> Belakang (Gambar B) -->
            <div class="page" id="page1">
                <div class="front" style="background-image: url('File/Gambar/Buku/A.png');"></div>
                <div class="back" style="background-image: url('File/Gambar/Buku/B.png');"></div>
            </div>

            <!-- LEMBAR 2: HALAMAN TENGAH (Gambar C) -> Belakang (Slot Baru) -->
            <div class="page" id="page2">
                <div class="front" style="background-image: url('File/Gambar/Buku/C.png');"></div>
                <div class="back" id="slot-auto-back" style="background-image: url('https://placehold.co');"></div>
            </div>

            <!-- LEMBAR 3: COVER BELAKANG BUKU -->
            <div class="page" id="page3">
                <div class="front" style="background-color: #34495e; border-radius: 0 8px 8px 0;"></div>
                <div class="back" style="background-color: #2c3e50;"></div>
            </div>

        </div>
    </div>

    <!-- Tombol Utama untuk Membalik Lembaran Buku -->
    <div class="controls-container">
        <button class="btn-nav" onclick="tombolKembali()">⬅️ Buka ke Kanan</button>
        <button class="btn-nav" onclick="tombolMaju()">Buka ke Kiri ➡️</button>
    </div>

    <!-- Fitur Unggah & Auto Increment -->
    <div class="controls-container" style="margin-top: 15px; background: rgba(0,0,0,0.2);">
        <input type="text" id="nama-file-baru" placeholder="Ketik nama file (Contoh: D.png)">
        <button style="background-color: #27ae60;" onclick="prosesAutoIncrement()">➕ Tambah Lembar</button>
    </div>

    <script>
        // Mencatat posisi lembaran yang sedang aktif terbuka
        let lembarAktif = 0; 

        // Fungsi ketika menekan tombol "Buka ke Kiri" (Maju Halaman)
        function tombolMaju() {
            const panggung = document.getElementById('stage');
            
            if (lembarAktif === 0) {
                document.getElementById('page1').classList.add('flipped');
                panggung.classList.add('opened');
                lembarAktif = 1;
            } else if (lembarAktif === 1) {
                document.getElementById('page2').classList.add('flipped');
                lembarAktif = 2;
            }
        }

        // Fungsi ketika menekan tombol "Buka ke Kanan" (Kembali Halaman)
        function tombolKembali() {
            const panggung = document.getElementById('stage');
            
            if (lembarAktif === 2) {
                document.getElementById('page2').classList.remove('flipped');
                lembarAktif = 1;
            } else if (lembarAktif === 1) {
                document.getElementById('page1').classList.remove('flipped');
                panggung.classList.remove('opened');
                lembarAktif = 0;
            }
        }

        // FUNGSI AUTO-INCREMENT (Menghubungkan gambar baru ke lembar lanjutan)
        function prosesAutoIncrement() {
            const input = document.getElementById('nama-file-baru');
            const fileNama = input.value.trim();

            if (!fileNama) {
                alert("Silahkan ketik nama file gambarnya terlebih dahulu!");
                return;
            }

            const pathGambarBaru = `File/Gambar/Buku/${fileNama.includes('.') ? fileNama : fileNama + '.png'}`;
            const targetSlot = document.getElementById('slot-auto-back');
            targetSlot.style.backgroundImage = `url('${pathGambarBaru}')`;
            
            alert(`✅ Sukses! File ${fileNama} terpasang di halaman setelah Gambar C.`);
            input.value = '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku 3D Bolak-Balik Nyata</title>
    <style>
        body {
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        h1 { margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        p { margin-top: 0; color: #bdc3c7; margin-bottom: 30px; }

        /* Panggung Utama Efek 3D */
        .scene {
            width: 400px;
            height: 500px;
            perspective: 1500px;
            margin: 20px auto;
        }

        /* Struktur Buku Fisik */
        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s;
        }

        /* Lembaran Kertas Buku */
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
            cursor: pointer;
        }

        /* Bagian Depan dan Belakang Lembaran Kertas */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            box-shadow: inset 3px 0 20px rgba(0,0,0,0.2), 5px 5px 15px rgba(0,0,0,0.3);
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-color: white;
            border-radius: 0 5px 5px 0;
        }

        /* Sisi belakang lembaran harus diputar 180 derajat agar tidak terbalik */
        .back {
            transform: rotateY(180deg);
            border-radius: 5px 0 0 5px;
        }

        /* Efek Lipatan Gelap Di Tengah Saat Buku Terbuka */
        .front::after {
            content: '';
            position: absolute;
            left: 0; top: 0; width: 15px; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 100%);
        }
        .back::after {
            content: '';
            position: absolute;
            right: 0; top: 0; width: 15px; height: 100%;
            background: linear-gradient(-90deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 100%);
        }

        /* Animasi Transisi Sempurna Saat Lembar Dibuka (Berputar ke Kiri) */
        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Atur t-index otomatis agar tumpukan kertas tidak tembus pandang */
        #p1 { z-index: 3; }
        #p2 { z-index: 2; }
        #p3 { z-index: 1; }

        /* Panel Tombol Navigasi bawah */
        .controls {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        input, button {
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }
        input { width: 180px; }
        button {
            background-color: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h1>📖 Buku Digital 3D Interaktif</h1>
    <p>Klik langsung pada lembar buku untuk membuka dan membalik halamannya</p>

    <!-- Kontainer Panggung Buku -->
    <div class="scene">
        <div class="book" id="my-book">
            
            <!-- LEMBAR 1: COVER DEPAN (Gambar A) & HALAMAN BALIKNYA (Gambar B) -->
            <div class="page" id="p1" onclick="balikHalaman(1)">
                <div class="front" style="background-image: url('File/Gambar/Buku/A.png');"></div>
                <div class="back" style="background-image: url('File/Gambar/Buku/B.png');"></div>
            </div>

            <!-- LEMBAR 2: HALAMAN TENGAH (Gambar C) & HALAMAN KOSONG BARU -->
            <div class="page" id="p2" onclick="balikHalaman(2)">
                <div class="front" style="background-image: url('File/Gambar/Buku/C.png');"></div>
                <div class="back" style="background-image: url('https://placehold.co');"></div>
            </div>

            <!-- LEMBAR 3: TEMPAT UNTUK MENERIMA UPLOAD FILE BARU BERIKUTNYA -->
            <div class="page" id="p3" onclick="balikHalaman(3)">
                <div class="front" id="slot-baru-front" style="background-image: url('https://placehold.co');"></div>
                <div class="back" style="background-color: #34495e;"></div>
            </div>

        </div>
    </div>

    <!-- Sistem Kontrol Tambah Lembar Kertas Baru Otomatis -->
    <div class="controls">
        <input type="text" id="input-nama-file" placeholder="Ketik nama file (Contoh: D.png)">
        <button onclick="tambahLembarOtomatis()">➕ Tambah Lembar Ke Buku</button>
        <button class="btn-danger" onclick="resetBuku()">🔄 Atur Ulang Buku</button>
    </div>

    <script>
        // Logika fungsi klik membalik kertas
        function balikHalaman(pageId) {
            const page = document.getElementById(`p${pageId}`);
            const book = document.getElementById('my-book');

            if (!page.classList.contains('flipped')) {
                // Efek buka halaman ke kiri
                page.classList.add('flipped');
                
                // Geser posisi buku sedikit ke kanan saat terbuka agar simetris di tengah
                if(pageId === 1) {
                    book.style.transform = "translateX(50%)";
                }
            } else {
                // Efek menutup halaman kembali ke kanan
                page.classList.remove('flipped');
                
                if(pageId === 1) {
                    book.style.transform = "translateX(0%)";
                }
            }
        }

        // FUNGSI AUTO-INCREMENT: Menambahkan gambar baru (Misal D.png) langsung ke lembaran buku berikutnya
        function tambahLembarOtomatis() {
            const input = document.getElementById('input-nama-file');
            const namaFile = input.value.trim();

            if (!namaFile) {
                alert("Silahkan isi nama file gambar Anda terlebih dahulu!");
                return;
            }

            // Gabungkan nama file menjadi path lengkap folder Anda
            const pathGambarBaru = `File/Gambar/Buku/${namaFile.includes('.') ? namaFile : namaFile + '.png'}`;
            
            // Masukkan gambar baru tersebut ke dalam slot lembaran buku ke-3
            const slotFront = document.getElementById('slot-baru-front');
            slotFront.style.backgroundImage = `url('${pathGambarBaru}')`;
            
            alert(`✅ Berhasil! File ${namaFile} dipasang sebagai halaman baru di dalam lembar ke-3.`);
            input.value = '';
        }

        // Fungsi Reset Memori Tampilan Buku
        function resetBuku() {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('flipped');
            });
            document.getElementById('my-book').style.transform = "translateX(0%)";
        }
    </script>
</body>
</html>

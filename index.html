<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Digital Full Page & Editor Teks</title>
    <style>
        body {
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        h1 { margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); font-size: 24px; }
        p { margin-top: 0; color: #bdc3c7; font-size: 14px; margin-bottom: 20px; }

        /* Wadah Utama Buku Satu Halaman Penuh */
        .book-container {
            width: 100%;
            max-w: 600px;
            background: white;
            color: #333;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 700px;
            position: relative;
        }

        /* Area Gambar Latar Belakang Lembar Buku */
        .page-bg {
            width: 100%;
            height: 250px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-bottom: 2px solid #ddd;
            position: relative;
            background-color: #f5f5f5;
        }
        .page-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Area Mengetik / Membaca / Mengedit Tulisan Buku */
        .editor-area {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background-color: #fdfcf7; /* Warna kertas koran/buku nyaman di mata */
        }
        .book-textarea {
            width: 100%;
            flex: 1;
            border: none;
            resize: none;
            background: transparent;
            font-size: 16px;
            line-height: 1.6;
            color: #2c3e50;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            /* Motif Garis Buku Tulis */
            background-image: linear-gradient(#e1e6eb 1px, transparent 1px);
            background-size: 100% 28px;
        }

        /* Batas Info Halaman bawah */
        .page-footer {
            text-align: center;
            padding: 10px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Kontrol Navigasi Balik Lembar */
        .nav-controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 600px;
        }
        .btn-nav {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-nav:hover { background: #2980b9; }

        /* Panel Manajemen File Gambar (Auto Increment, Edit, Hapus) */
        .management-panel {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            max-width: 570px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-row {
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
        }
        .btn-action {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .btn-add { background: #27ae60; }
        .btn-add:hover { background: #2cc36b; }
        .btn-del { background: #e74c3c; }
        .btn-del:hover { background: #c0392b; }
    </style>
</head>
<body>

    <h1>📝 Buku Digital Satu Halaman Penuh (Editor)</h1>
    <p>Tampilan full satu lembar utuh. Anda bisa membaca, mengetik isi teks, serta mengelola lembaran baru.</p>

    <!-- Kontainer Lembar Buku Satu Halaman Penuh -->
    <div class="book-container">
        <!-- Bagian Atas: Gambar Lembar -->
        <div class="page-bg" id="book-image">
            <span class="page-badge" id="book-code">KODE: BK-A</span>
        </div>
        
        <!-- Bagian Tengah: Tempat Menulis Teks Catatan Buku -->
        <div class="editor-area">
            <textarea id="book-text" class="book-textarea" placeholder="Ketik isi catatan atau teks buku di sini... (Otomatis Tersimpan)"></textarea>
        </div>

        <!-- Bagian Bawah: Indikator Nomor Halaman -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 3</div>
    </div>

    <!-- Tombol Navigasi Bolak-Balik Lembar Utuh -->
    <div class="nav-controls">
        <button class="btn-nav" onclick="kembaliLembar()">⬅️ Lembar Sebelumnya</button>
        <button class="btn-nav" onclick="majuLembar()">Lembar Berikutnya ➡️</button>
    </div>

    <!-- Panel Kontrol Input: Tambah Gambar Otomatis & Hapus Lembar -->
    <div class="management-panel">
        <div style="font-size: 14px; font-weight: bold; color: #dbecf8;">⚙️ Kelola Struktur Lembar Gambar Buku:</div>
        <div class="input-row">
            <input type="text" id="input-gambar" placeholder="Ketik nama file gambar baru (Contoh: D.png)">
            <button class="btn-action btn-add" onclick="tambahLembarOtomatis()">➕ Auto Tambah Lembar</button>
        </div>
        <div class="input-row">
            <button class="btn-action btn-del" style="width: 100%;" onclick="hapusLembarSekarang()">🗑️ Hapus/Robek Lembar yang Sedang Dibuka Ini</button>
        </div>
    </div>

    <script>
        // Database awal struktur halaman buku yang terhubung ke folder file Anda di GitHub
        let databaseBuku = [
            { kode: "BK-A", gambar: "File/Gambar/Buku/A.png", isiTeks: "Ini adalah teks catatan awal untuk Lembar A. Silakan edit kalimat ini langsung..." },
            { kode: "BK-B", gambar: "File/Gambar/Buku/B.png", isiTeks: "Ini adalah teks untuk halaman B. Anda bisa menghapusnya atau menulis materi baru di sini." },
            { kode: "BK-C", gambar: "File/Gambar/Buku/C.png", isiTeks: "Lembar C siap digunakan untuk membaca maupun menulis data dokumen digital." }
        ];

        // Ambil data terbaru dari memori browser jika pengguna sudah pernah menambah/mengedit teks
        if (localStorage.getItem('myDigitalBookData')) {
            databaseBuku = JSON.parse(localStorage.getItem('myDigitalBookData'));
        }

        // Variabel penunjuk lembar halaman yang sedang dibuka (dimulai dari indeks 0)
        let indeksAktif = 0;

        const elemenGambar = document.getElementById('book-image');
        const elemenKode = document.getElementById('book-code');
        const elemenTeks = document.getElementById('book-text');
        const elemenIndikator = document.getElementById('page-indicator');

        // Fungsi Menampilkan Satu Lembar Buku Secara Penuh (Full Page View)
        function muatHalaman() {
            const dataHalaman = databaseBuku[indeksAktif];

            // Tampilkan Gambar Latar Lembar Penuh
            elemenGambar.style.backgroundImage = `url('${dataHalaman.gambar}')`;
            elemenKode.innerText = `KODE: ${dataHalaman.kode}`;
            
            // Tampilkan Teks tulisan di dalam lembar tersebut
            elemenTeks.value = dataHalaman.isiTeks;
            
            // Update nomor halaman bawah
            elemenIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
            
            // Simpan setiap perubahan struktur ke memori
            localStorage.setItem('myDigitalBookData', JSON.stringify(databaseBuku));
        }

        // Simpan teks secara otomatis saat user sedang mengetik di lembar tersebut
        elemenTeks.addEventListener('input', function() {
            databaseBuku[indeksAktif].isiTeks = elemenTeks.value;
            localStorage.setItem('myDigitalBookData', JSON.stringify(databaseBuku));
        });

        // Navigasi Balik Lembar Maju Mundur (Full Page Slide)
        function majuLembar() {
            if (indeksAktif < databaseBuku.length - 1) {
                indeksAktif++;
                muatHalaman();
            } else {
                alert("Anda sudah berada di lembar halaman terakhir buku!");
            }
        }

        function kembaliLembar() {
            if (indeksAktif > 0) {
                indeksAktif--;
                muatHalaman();
            } else {
                alert("Anda sedang membuka cover / lembar halaman pertama!");
            }
        }

        // FUNGSI AUTO-INCREMENT (Menambah lembar penuh baru berdasarkan input nama gambar)
        function tambahLembarOtomatis() {
            const input = document.getElementById('input-gambar');
            const namaFile = input.value.trim();

            if (!namaFile) {
                alert("Silakan isi nama file gambar Anda terlebih dahulu!");
                return;
            }

            // Ekstrak nama file tanpa ekstensi untuk dijadikan kode otomatis
            const namaMurni = namaFile.replace(/\.[^/.]+$/, "").toUpperCase();

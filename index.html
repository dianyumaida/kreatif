<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Digital Minimalis Dropdown</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Aplikasi */
        .book-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Area Menu Navigasi Paling Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
        }
        
        /* Dropdown Select Utama */
        .dropdown-select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            text-align: center;
        }

        /* Area Gambar (Klik Langsung untuk Balik Lembar) */
        .page-area {
            width: 100%;
            height: 480px; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
            cursor: pointer;
            position: relative;
            transition: opacity 0.2s ease-in-out;
        }
        .page-area:active {
            opacity: 0.8;
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- MENU DROPDOWN UTAMA (Hanya Berisi Tombol Aksi Kelola & Kirim Link WA) -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">⚙️ -- PILIH MENU KELOLA --</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp</option>
                <option value="aksi-tambah">➕ Tambah Lembar Baru (Auto)</option>
                <option value="aksi-hapus">🗑️ Hapus Lembar Ini</option>
            </select>
        </div>

        <!-- AREA GAMBAR: KLIK LANGSUNG UNTUK MEMBALIK HALAMAN -->
        <div class="page-area" id="book-image" onclick="klikGambarMajuLembar()"></div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 3</div>
    </div>

    <script>
        // Database utama file gambar Anda di dalam repositori GitHub
        let databaseBuku = [
            "File/Gambar/Buku/A.png", 
            "File/Gambar/Buku/B.png", 
            "File/Gambar/Buku/C.png"  
        ];

        // Sinkronisasi memori browser Lokal
        if (localStorage.getItem('bukuDropdownMenuBersih')) {
            databaseBuku = JSON.parse(localStorage.getItem('bukuDropdownMenuBersih'));
        }

        let indeksAktif = 0;

        const elGambar = document.getElementById('book-image');
        const elMenu = document.getElementById('menu-navigasi');
        const elIndikator = document.getElementById('page-indicator');

        // Fungsi memuat tampilan gambar lembar buku ke layar
        function muatHalaman(indeks) {
            indeksAktif = indeks;
            elGambar.style.backgroundImage = `url('${databaseBuku[indeksAktif]}')`;
            elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
            
            localStorage.setItem('bukuDropdownMenuBersih', JSON.stringify(databaseBuku));
        }

        // FUNGSI KLIK GAMBAR: Gambar diklik langsung untuk maju ke halaman berikutnya
        function klikGambarMajuLembar() {
            if (indeksAktif < databaseBuku.length - 1) {
                indeksAktif++;
            } else {
                indeksAktif = 0; // Kembali ke cover depan jika sudah lembar terakhir
            }
            muatHalaman(indeksAktif);
        }

        // KONTROL PUSAT DROPDOWN: Mengeksekusi tombol aksi pilihan
        function eksekusiPilihanMenu() {
            const nilaiPilihan = elMenu.value;

            if (nilaiPilihan === 'aksi-wa') {
                // Link otomatis mengarah ke Saluran WhatsApp Anda dan terbuka di tab baru secara instan
                window.open('https://whatsapp.com', '_blank');
                elMenu.value = 'default'; // Kembalikan teks menu ke default judul
            } 
            else if (nilaiPilihan === 'aksi-tambah') {
                // Tombol Auto-Increment Tambah Lembar Baru via Prompt Input
                const inputNama = prompt("Masukkan nama file gambar baru yang sudah diupload ke GitHub:\n(Contoh: D.png)");
                
                if (inputNama && inputNama.trim() !== '') {
                    const fileMurni = inputNama.trim();
                    const pathLengkap = `File/Gambar/Buku/${fileMurni.includes('.') ? fileMurni : fileMurni + '.png'}`;
                    
                    databaseBuku.push(pathLengkap);
                    localStorage.setItem('bukuDropdownMenuBersih', JSON.stringify(databaseBuku));
                    
                    // Otomatis langsung membuka halaman baru yang ditambahkan di paling belakang
                    muatHalaman(databaseBuku.length - 1);
                    alert(`🎉 Sukses membuat lembar baru untuk file ${fileMurni}!`);
                }
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-hapus') {
                // Tombol Hapus Lembar Aktif
                if (databaseBuku.length <= 1) {
                    alert("Gagal menghapus! Minimal harus menyisakan 1 lembar cover depan.");
                    elMenu.value = 'default';
                    return;
                }

                if (confirm(`Apakah Anda yakin ingin menghapus Lembar ke-${indeksAktif + 1} yang sedang dibuka ini?`)) {
                    databaseBuku.splice(indeksAktif, 1);
                    
                    if (indeksAktif >= databaseBuku.length) {
                        indeksAktif = databaseBuku.length - 1;
                    }
                    muatHalaman(indeksAktif);
                }
                elMenu.value = 'default';
            }
        }

        // Jalankan sistem pertama kali saat web dibuka
        window.onload = function() {
            muatHalaman(0); // Tampilkan gambar cover A di awal
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Buku Digital</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0; /* Dibuat 0 agar nempel ke tepi layar HP */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku - FULL PAGE KIRI KANAN */
        .book-container {
            width: 100%;
            max-width: 440px;
            height: 100vh; /* Menggunakan tinggi penuh layar */
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dropdown-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Status Perekaman Suara */
        .record-status {
            font-weight: bold;
            color: #e74c3c;
            position: absolute;
            top: 10px;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 10;
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Area Gambar Utama */
        .content-area {
            width: 100%;
            height: 250px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ecf0f1; 
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        video, audio {
            width: 90%;
            max-height: 90%;
            z-index: 5;
        }

        /* AREA TEKS PENUH - MENGHAPUS BINGKAI DAN MARGIN KIRI KANAN */
        .text-work-space {
            padding: 20px; /* Jarak ketikan bagian dalam agar nyaman dibaca */
            background-color: #ffffff;
            border: none;
            margin: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
            outline: none;
            flex-grow: 1;
        }

        /* GAYA HYPERLINK PENANDA */
        .hyperlink-bookmark {
            color: #0066cc;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
            background-color: rgba(0, 102, 204, 0.1);
            padding: 0 2px;
            border-radius: 3px;
        }

        /* TOMBOL MELAYANG */
        .floating-menu-btn {
            position: absolute;
            display: none;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer;
            z-index: 999;
        }

        .floating-menu-btn:hover {
            background-color: #27ae60;
        }

        /* Panel Radio Button */
        .radio-dropdown-panel {
            padding: 8px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            align-items: center;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            cursor: pointer;
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- TOMBOL POP-UP MELAYANG KHUSUS PENANDA -->
        <button id="floating-btn" class="floating-menu-btn" onclick="buatPenandaDariBlokTeks()">📌 Buat Penanda</button>

        <!-- MENU UTAMA DAN DROPDOWN RIWAYAT DI BAWAHNYA -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">-- MENU UTAMA KELOLA BUKU --</option>
                <option value="aksi-tambah">➕ Tambah Halaman Baru</option>
                <option value="aksi-cari">🔍 Jalankan Pencarian Kata Kunci Catatan</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru</option>
                <option value="aksi-upload-vid">🎥 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekan">🎙️ Mulai / Stop Rekam Suara</option>
                <option value="aksi-hapus">❌ Hapus Lembar Ini</option>
            </select>

            <!-- 2 DAN 3: DROPDOWN DAFTAR RIWAYAT SEKARANG BERADA DI BAWAH PENANDA -->
            <select class="dropdown-select" id="dropdown-riwayat" onchange="lompatKeRiwayatPenanda()" style="background-color: #34495e; border-color: #2c3e50;">
                <option value="default">📂 -- DAFTAR RIWAYAT PENANDA TEKS --</option>
            </select>
        </div>

        <!-- PANEL RADIO BUTTON (Anak Penanda) -->
        <div class="radio-dropdown-panel" id="radio-container">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>

        <!-- Input File Picker Perangkat -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- AREA GAMBAR (Mendukung Double-Click) -->
        <div class="content-area" id="book-content" ondblclick="klikDuaKaliMajuLembar(event)">
            <div class="record-status" id="record-indicator">🔴 Sedang Merekam...</div>
            <div id="media-placeholder" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none;"></div>
        </div>

        <!-- 1: AREA KETIK TEKS MELEBAR FULL PAGE DAN SUDAH DIKOSONGKAN TULISANNYA -->
        <div id="text-input-field" class="text-work-space" contenteditable="true" placeholder="Silakan ketik catatan lembar baru Anda di sini..." onmouseup="periksaSeleksiTeks()" onkeyup="periksaSeleksiTeks()" ondblclick="pemicuKlikAreaTeks(event)"></div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 1</div>
    </div>

<script>
    // PERBAIKAN: Isi teks di halaman utama pertama B.png sekarang sudah kosong bersih
    let databaseBuku = [
        { type: "image", src: "./File/Gambar/Buku/B.png", teks: "" }
    ];

    let riwayatPenanda = [];
    let indeksAktif = 0;
    let mediaRecorder;
    let audioChunks = [];
    let sedangMerekam = false;

    const elContent = document.getElementById('book-content');
    const elPlaceholder = document.getElementById('media-placeholder');
    const elMenu = document.getElementById('menu-navigasi');
    const elRiwayatDropdown = document.getElementById('dropdown-riwayat');
    const elIndikator = document.getElementById('page-indicator');
    const elTextField = document.getElementById('text-input-field');
    const elRecordIndicator = document.getElementById('record-indicator');
    const elRadioContainer = document.getElementById('radio-container');
    const elFloatingBtn = document.getElementById('floating-btn');

    function muatHalaman(indeks) {
        indeksAktif = indeks;
        const data = databaseBuku[indeksAktif];
        elPlaceholder.innerHTML = '';
        elContent.style.backgroundImage = 'none';

        if (data.type === 'text-only') {
            elContent.style.display = 'none'; 
        } else {
            elContent.style.display = 'flex'; 
            if (data.type === 'image' && data.src) {
                elContent.style.backgroundImage = `url('${data.src}')`;
            } else if (data.type === 'video') {
                elPlaceholder.innerHTML = `<video src="${data.src}" controls></video>`;
            } else if (data.type === 'audio') {
                elPlaceholder.innerHTML = `<audio src="${data.src}" controls></audio>`;
            }
        }

        elTextField.innerHTML = data.teks || "";
        elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
        elFloatingBtn.style.display = 'none'; 
        
        renderRadioHalaman();
    }
    function renderRadioHalaman() {
        elRadioContainer.innerHTML = '';
        databaseBuku.forEach((item, index) => {
            const label = document.createElement('label');
            label.className = 'radio-item';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'anak-penanda';
            radio.value = index;
            radio.checked = (index === indeksAktif);
            radio.onchange = function() {
                muatHalaman(parseInt(this.value));
            };
            
            label.appendChild(radio);
            label.appendChild(document.createTextNode(`Halaman ${index + 1}`));
            elRadioContainer.appendChild(label);
        });
    }

    function periksaSeleksiTeks() {
        const seleksi = window.getSelection();
        const teksTerpilih = seleksi.toString().trim();

        if (teksTerpilih.length > 0) {
            const range = seleksi.getRangeAt(0);
            const rect = range.getBoundingClientRect();
            const containerRect = document.querySelector('.book-container').getBoundingClientRect();

            elFloatingBtn.style.top = (rect.top - containerRect.top - 35) + 'px';
            elFloatingBtn.style.left = (rect.left - containerRect.left + (rect.width / 2) - 50) + 'px';
            elFloatingBtn.style.display = 'block';
        } else {
            elFloatingBtn.style.display = 'none';
        }
    }

    function buatPenandaDariBlokTeks() {
        const seleksi = window.getSelection();
        const teksTerpilih = seleksi.toString().trim();

        if (!teksTerpilih) return;

        const range = seleksi.getRangeAt(0);
        const aLink = document.createElement('span');
        aLink.className = 'hyperlink-bookmark';
        aLink.textContent = teksTerpilih;
        
        const penandaId = "link-" + Date.now();
        aLink.setAttribute('data-link-id', penandaId);

        range.deleteContents();
        range.insertNode(aLink);

        databaseBuku[indeksAktif].teks = elTextField.innerHTML;

        const dataRiwayat = {
            idHalaman: indeksAktif,
            linkId: penandaId,
            isiTeks: teksTerpilih
        };
        riwayatPenanda.push(dataRiwayat);

        const opsiBaru = document.createElement('option');
        opsiBaru.value = riwayatPenanda.length - 1;
        opsiBaru.text = `🔗 [Hlm ${indeksAktif + 1}] "${teksTerpilih.substring(0, 20)}..."`;
        elRiwayatDropdown.appendChild(opsiBaru);

        seleksi.removeAllRanges();
        elFloatingBtn.style.display = 'none';
    }

    function lompatKeRiwayatPenanda() {
        const indeksRiwayat = elRiwayatDropdown.value;
        if (indeksRiwayat === 'default') return;

        const target = riwayatPenanda[indeksRiwayat];
        muatHalaman(target.idHalaman);
        
        setTimeout(() => {
            const elemenLink = elTextField.querySelector(`[data-link-id="${target.linkId}"]`);
            if (elemenLink) {
                elemenLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
                elemenLink.style.backgroundColor = "#ffcc00";
                setTimeout(() => elemenLink.style.backgroundColor = "rgba(0, 102, 204, 0.1)", 1500);
            }
        }, 300);

        elRiwayatDropdown.value = 'default';
    }

    elTextField.addEventListener('input', function() {
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
    });

    function pemicuKlikAreaTeks(event) {
        if (window.getSelection().toString().length > 0) return;
        klikDuaKaliMajuLembar(event);
    }

    function klikDuaKaliMajuLembar(event) {
        if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO') return;
        if (indeksAktif < databaseBuku.length - 1) {
            indeksAktif++;
        } else {
            indeksAktif = 0;
        }
        muatHalaman(indeksAktif);
    }

    // PENCARIAN DIUBAH MENJADI MODEL PROMPT POP-UP AGAR TIDAK MEMENUHI NAVIGASI
    function cariTeksBuku() {
        const kataKunci = prompt("Masukkan kata kunci catatan yang ingin dicari:");
        if (!kataKunci || !kataKunci.trim()) return;
        
        const indeksDitemukan = databaseBuku.findIndex(item => item.teks.toLowerCase().includes(kataKunci.toLowerCase().trim()));
        if (indeksDitemukan !== -1) { 
            muatHalaman(indeksDitemukan); 
        } else {
            alert("Kata kunci tidak ditemukan di catatan halaman manapun.");
        }
    }

    function eksekusiPilihanMenu() {
        const nilaiPilihan = elMenu.value;
        if (nilaiPilihan === 'default') return;

        if (nilaiPilihan === 'aksi-tambah') {
            databaseBuku.push({
                type: "text-only", src: "",
                teks: "" /* Otomatis kosong saat membuat halaman baru */
            });
            muatHalaman(databaseBuku.length - 1);
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-cari') {
            cariTeksBuku();
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-wa') {
            const teksKirim = encodeURIComponent(`Catatan Lembar ${indeksAktif + 1}:\n${elTextField.innerText}`);
            window.open('https://whatsapp.com' + teksKirim, '_blank');
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-img') {
            document.getElementById('file-image').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-vid') {
            document.getElementById('file-video').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-mp3') {
            document.getElementById('file-audio').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-rekan') {
            toggleRekamSuara(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-hapus') {
            if (databaseBuku.length <= 1) { alert("Gagal! Sisa 1 halaman."); elMenu.value = 'default'; return; }
            if (confirm("Hapus lembar halaman ini?")) {
                databaseBuku.splice(indeksAktif, 1);
                if (indeksAktif >= databaseBuku.length) { indeksAktif = databaseBuku.length - 1; }
                muatHalaman(indeksAktif);
            }
            elMenu.value = 'default';
        }
    }

    function handleFileSelected(input, type) {
        if (input.files && input.files) {
            const file = input.files;
            const fileURL = URL.createObjectURL(file);
            databaseBuku[indeksAktif] = { type: type, src: fileURL, teks: elTextField.innerHTML };
            muatHalaman(indeksAktif);
        }
    }

    function toggleRekamSuara() {
        sedangMerekam = !sedangMerekam;
        elRecordIndicator.style.display = sedangMerekam ? 'block' : 'none';
    }

    muatHalaman(0);
</script>
</body>
</html>

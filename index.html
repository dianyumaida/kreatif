<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Mushaf & Buku Digital 3D</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            justify-content: center;
        }
        h1 { margin-bottom: 5px; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
        p { margin-top: 0; color: #95a5a6; font-size: 14px; margin-bottom: 30px; }

        /* Area Panggung Buku (3D Render Area) */
        .book-stage {
            width: 380px;
            height: 500px;
            perspective: 2000px;
            position: relative;
            transition: transform 0.6s ease;
        }
        
        /* Geser panggung ke kanan saat buku mulai terbuka */
        .book-stage.opened {
            transform: translateX(190px);
        }

        /* Kontainer Buku Utama */
        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Komponen Lembaran Kertas Buku */
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
        }

        /* Sisi Depan dan Sisi Belakang Lembaran Kertas */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        .front { border-radius: 0 8px 8px 0; }
        
        /* Sisi belakang lembar dibalik 180 derajat */
        .back {
            transform: rotateY(180deg);
            border-radius: 8px 0 0 8px;
        }

        /* Efek Bayangan Lipatan Buku di Tengah */
        .front::after {
            content: ''; position: absolute; left: 0; top: 0; width: 20px; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
        }
        .back::after {
            content: ''; position: absolute; right: 0; top: 0; width: 20px; height: 100%;
            background: linear-gradient(-90deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
        }

        /* Animasi Lembar Berputar ke Kiri */
        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Panel Utama Tombol Kontrol Bawah */
        .controls-panel {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 25px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        
        .row-buttons {
            display: flex;
            gap: 12px;
        }

        button, input {
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            box-sizing: border-box;
        }
        
        input {
            flex: 1;
            background-color: #ffffff;
            color: #2c3e50;
        }

        button {
            flex: 1;
            background-color: #2980b9;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #3498db; }
        
        .btn-nav { background-color: #e67e22; }
        .btn-nav:hover { background-color: #f39c12; }
        
        .btn-add { background-color: #27ae60; }
        .btn-add:hover { background-color: #2cc36b; }
        
        .btn-reset { background-color: #7f8c8d; font-size: 12px; }
        .btn-reset:hover { background-color: #95a5a6; }
    </style>
</head>
<body>

    <h1>📖 Aplikasi Al-Quran & Buku Digital 3D</h1>
    <p>Gunakan panel tombol di bawah untuk membalik halaman dan mengelola lembaran baru</p>

    <!-- Panggung Buku 3D -->
    <div class="book-stage" id="stage">
        <div class="book" id="book-canvas">
            <!-- Lembaran buku dimuat otomatis -->
        </div>
    </div>

    <!-- Panel Kontrol Navigasi & Auto-Increment Input -->
    <div class="controls-panel">
        <div class="row-buttons">
            <button class="btn-nav" onclick="balikKiri()">⬅️ Buka Kiri</button>
            <button class="btn-nav" onclick="balikKanan()">Buka Kanan ➡️</button>
        </div>
        
        <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px; font-size: 13px; text-align: center; color: #bdc3c7;">
            Tambah Lembar Baru (Auto-Increment)
        </div>
        <div class="row-buttons">
            <input type="text" id="nama-file-baru" placeholder="Ketik nama file gambar (Contoh: D.png)">
            <button class="btn-add" onclick="tambahLembarOtomatis()">➕ Tambah</button>
        </div>

        <button class="btn-reset" onclick="bersihkanMemoriBrowser()">🔄 Atur Ulang Jalur Gambar</button>
    </div>

    <script>
        // Gunakan pemanggilan jalur relatif './' untuk memaksa GitHub membaca folder saat ini secara presisi
        const susunanAwalDefault = [
            "./File/Gambar/Buku/A.png", 
            "./File/Gambar/Buku/B.png", 
            "./File/Gambar/Buku/C.png"  
        ];

        let koleksiBuku = [...susunanAwalDefault];

        if (localStorage.getItem('koleksiBuku3DPathFix')) {
            koleksiBuku = JSON.parse(localStorage.getItem('koleksiBuku3DPathFix'));
        }

        let totalLembarKertas = 0;
        let lembarSaatIni = 0;

        function bangunBuku() {
            const canvas = document.getElementById('book-canvas');
            canvas.innerHTML = ''; 

            let htmlKonten = '';
            totalLembarKertas = Math.ceil(koleksiBuku.length / 2);

            for (let i = 0; i < totalLembarKertas; i++) {
                const indexFront = i * 2;
                const indexBack = indexFront + 1;
                const zIndex = totalLembarKertas - i;

                htmlKonten += `<div class="page" id="p${i + 1}" style="z-index: ${zIndex};">`;

                // Sisi Depan Lembar (Front)
                if (indexFront < koleksiBuku.length) {
                    htmlKonten += `<div class="front" style="background-image: url('${koleksiBuku[indexFront]}');"></div>`;
                } else {
                    htmlKonten += `<div class="front" style="background-color: #ffffff; display:flex; justify-content:center; align-items:center; color:#ccc;"><h3>Lembar Kosong</h3></div>`;
                }

                // Sisi Belakang Lembar (Back)
                if (indexBack < koleksiBuku.length) {
                    htmlKonten += `<div class="back" style="background-image: url('${koleksiBuku[indexBack]}');"></div>`;
                } else {
                    htmlKonten += `<div class="back" style="background-color: #ffffff; display:flex; justify-content:center; align-items:center; color:#ccc;"><h3>Lembar Kosong</h3></div>`;
                }

                htmlKonten += `</div>`;
            }

            canvas.innerHTML = htmlKonten;
            perbaruiLapisanZIndex();
        }

        function perbaruiLapisanZIndex() {
            for (let i = 1; i <= totalLembarKertas; i++) {
                const el = document.getElementById(`p${i}`);
                if (el) {
                    if (i <= lembarSaatIni) {
                        el.style.zIndex = totalLembarKertas + i;
                    } else {
                        el.style.zIndex = totalLembarKertas - i + 1;
                    }
                }
            }
        }

        function balikKanan() {
            if (lembarSaatIni < totalLembarKertas) {
                lembarSaatIni++;
                const el = document.getElementById(`p${lembarSaatIni}`);
                if (el) el.classList.add('flipped');
                
                if (lembarSaatIni === 1) {
                    document.getElementById('stage').classList.add('opened');
                }
                perbaruiLapisanZIndex();
            }
        }

        function balikKiri() {
            if (lembarSaatIni > 0) {
                const el = document.getElementById(`p${lembarSaatIni}`);
                if (el) el.classList.remove('flipped');
                lembarSaatIni--;

                if (lembarSaatIni === 0) {
                    document.getElementById('stage').classList.remove('opened');
                }
                perbaruiLapisanZIndex();
            }
        }

        function tambahLembarOtomatis() {
            const input = document.getElementById('nama-file-baru');
            const fileNama = input.value.trim();

            if (!fileNama) {
                alert("Silahkan ketik nama file gambarnya dahulu!");
                return;
            }

            const pathGambarLengkap = `./File/Gambar/Buku/${fileNama.includes('.') ? fileNama : fileNama + '.png'}`;
            koleksiBuku.push(pathGambarLengkap);
            
            localStorage.setItem('koleksiBuku3DPathFix', JSON.stringify(koleksiBuku));
            bangunBuku();
            
            alert(`🎉 Sukses! File ${fileNama} terpasang.`);
            input.value = '';
        }

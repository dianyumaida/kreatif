<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Digital Multi-Navigasi</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku */
        .book-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Menu Navigasi Paling Atas (Seperti Contoh Kalkulator Multi) */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
        }
        .dropdown-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Area Gambar Lembar Buku */
        .page-bg {
            width: 100%;
            height: 280px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
        }

        /* Area Kerja Form (Menggantikan Teks Statis Lama) */
        .work-area {
            padding: 15px;
            background-color: #fdfcf7;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Kolom untuk Mengetik / Mengedit Teks Isi Lembar Ini */
        .editor-label {
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
        }
        .book-textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            resize: none;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #333;
            outline: none;
        }

        /* Baris Tombol Aksi */
        .action-row {
            display: flex;
            gap: 10px;
        }

        /* Gaya Tombol Edit/Simpan Teks */
        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }
        .btn-edit {
            background-color: #3498db;
            color: white;
        }
        .btn-edit:hover { background-color: #2980b9; }

        /* Gaya Tombol Kirim WhatsApp */
        .btn-wa {
            background-color: #25d366;
            color: white;
        }
        .btn-wa:hover { background-color: #20ba5a; }

        /* Footer Halaman */
        .page-footer {
            text-align: center;
            padding: 10px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 13px;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Panel Auto-Increment (Admin) */
        .admin-panel {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            max-width: 395px;
            box-sizing: border-box;
        }
        .admin-row {
            display: flex;
            gap: 8px;
        }
        .admin-row input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: none;
        }
        .btn-add {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- BARIS MENU NAVIGASI UTAMA (Di Bagian Paling Atas Buku) -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="pilihHalamanDariMenu()">
                <!-- Opsi menu akan diisi otomatis oleh JavaScript -->
            </select>
        </div>

        <!-- AREA GAMBAR (COVER/ISI) -->
        <div class="page-bg" id="book-image"></div>
        
        <!-- AREA EDIT TEKS & TOMBOL KIRIM (Terintegrasi Penuh) -->
        <div class="work-area">
            <div class="editor-label" id="label-halaman">📝 Sunting Catatan Untuk Lembar A:</div>
            <textarea id="book-text" class="book-textarea" placeholder="Tulis isi lembaran buku di sini..."></textarea>
            
            <!-- Tombol Aksi Bersama: Simpan Perubahan Teks & Kirim Ke Link Channel WA -->
            <div class="action-row">
                <button class="btn-action btn-edit" onclick="simpanPerubahanTeks()">💾 Simpan Edit Teks</button>
                <a href="https://whatsapp.com" target="_blank" class="btn-action btn-wa" id="wa-link">📲 Kirim Ke WA</a>
            </div>
        </div>

        <!-- INDIKATOR HALAMAN -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 3</div>
    </div>

    <!-- PANEL AUTO INCREMENT (Tambah Halaman Otomatis) -->
    <div class="admin-panel">
        <div style="font-size: 13px; font-weight: bold; margin-bottom: 6px; color: #bdc3c7;">Otomatis Tambah Lembar Pilihan Baru:</div>
        <div class="admin-row">
            <input type="text" id="input-nama-file" placeholder="Ketik nama file gambar (Contoh: D.png)">
            <button class="btn-add" onclick="tambahLembarOtomatis()">➕ Tambah</button>
        </div>
    </div>

    <script>
        // Struktur database lengkap (Gambar + Isi teks bawaan untuk setiap menu)
        let databaseBuku = [
            { kode: "A", gambar: "File/Gambar/Buku/A.png", teks: "Catatan khusus untuk Lembar A (Cover)." },
            { kode: "B", gambar: "File/Gambar/Buku/B.png", teks: "Materi tulisan penting di Lembar B." },
            { kode: "C", gambar: "File/Gambar/Buku/C.png", teks: "Dokumen lanjutan untuk halaman C." }
        ];

        // Sinkronisasi memori browser lokal
        if (localStorage.getItem('bukuMultiNavigasiData')) {
            databaseBuku = JSON.parse(localStorage.getItem('bukuMultiNavigasiData'));
        }

        let indeksAktif = 0;

        const elGambar = document.getElementById('book-image');
        const elMenu = document.getElementById('menu-navigasi');
        const elTeks = document.getElementById('book-text');
        const elLabel = document.getElementById('label-halaman');
        const elIndikator = document.getElementById('page-indicator');
        const elWaLink = document.getElementById('wa-link');

        // Fungsi merakit teks opsi menu dropdown agar up-to-date
        function renderMenuDropdown() {
            elMenu.innerHTML = '<option value="-1">-- Pilih Menu Navigasi --</option>';
            databaseBuku.forEach((item, indeks) => {
                const opsi = document.createElement('option');
                opsi.value = indeks;
                opsi.text = `📁 -- Lembar ${item.kode} -- ▶`;
                elMenu.appendChild(opsi);
            });
            elMenu.value = indeksAktif;
        }

        // Fungsi menampilkan data lembar ke monitor berdasarkan pilihan menu
        function muatHalaman(indeks) {
            indeksAktif = indeks;
            const item = databaseBuku[indeksAktif];

            elGambar.style.backgroundImage = `url('${item.gambar}')`;
            elTeks.value = item.teks;
            elLabel.innerText = `📝 Sunting Catatan Untuk Lembar ${item.kode}:`;
            elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
            elMenu.value = indeksAktif;

            // Integrasi Tombol Kirim WA: Otomatis menyelipkan teks catatan ke dalam pesan teks WhatsApp (Opsional tetapi sangat keren!)
            const teksAmanUrl = encodeURIComponent(`*Catatan Lembar ${item.kode}:*\n${item.teks}`);
            elWaLink.href = `https://whatsapp.com?text=${teksAmanUrl}`;
            
            localStorage.setItem('bukuMultiNavigasiData', JSON.stringify(databaseBuku));
        }

        // Trigger saat dropdown diganti pilihan menunya
        function pilihHalamanDariMenu() {
            const val = parseInt(elMenu.value);
            if (val >= 0) {
                muatHalaman(val);
            }
        }

        // Fungsi Tombol "Simpan Edit Teks"
        function simpanPerubahanTeks() {
            databaseBuku[indeksAktif].teks = elTeks.value;
            localStorage.setItem('bukuMultiNavigasiData', JSON.stringify(databaseBuku));
            muatHalaman(indeksAktif);
            alert(`✅ Berhasil memperbarui teks catatan pada Lembar ${databaseBuku[indeksAktif].kode}!`);
        }

        // Fungsi Auto-Increment: Tambah halaman baru langsung memproduksi opsi menu baru
        function tambahLembarOtomatis() {
            const input = document.getElementById('input-nama-file');
            const fileNama = input.value.trim();

            if (!fileNama) {
                alert("Silahkan ketik nama file gambarnya dahulu!");
                return;
            }

            const namaMurni = fileNama.replace(/\.[^/.]+$/, "").toUpperCase();

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Buku Digital</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku */
        .book-container {
            width: 100%;
            max-width: 440px;
            height: 680px; 
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dropdown-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Kotak Pencarian */
        .search-box {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #ffffff;
            color: #333;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        /* Status Rekaman */
        .record-status {
            font-weight: bold;
            color: #e74c3c;
            position: absolute;
            top: 10px;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 10;
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Area Gambar Utama */
        .content-area {
            width: 100%;
            height: 280px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ecf0f1; 
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        video, audio {
            width: 90%;
            max-height: 90%;
            z-index: 5;
        }

        /* Area Ruang Kerja Teks Catatan */
        .text-work-space {
            padding: 0;
            background-color: #fdfcf7;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            width: 100%;
            flex-grow: 1; 
            position: relative;
        }

        .book-textarea {
            width: 100%;
            height: 100%; 
            padding: 15px;
            border: none;
            margin: 0;
            resize: none;
            font-size: 15px;
            line-height: 1.6;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #333;
            outline: none;
            flex-grow: 1;
        }

        /* Panel Radio Button Khusus di dalam Dropdown Riwayat */
        .radio-dropdown-panel {
            padding: 8px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            align-items: center;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            cursor: pointer;
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- MENU DROPDOWN NAVIGASI UTAMA & DROPDOWN RIWAYAT PENANDA -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">-- KELOLA & MENU UTAMA --</option>
                <option value="aksi-tambah">➕ Tambah Halaman Baru</option>
                <option value="aksi-bookmark">📌 Jadikan Blok Teks Sebagai Penanda Link</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru</option>
                <option value="aksi-upload-vid">🎥 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekan">🎙️ Mulai / Stop Rekam Suara</option>
                <option value="aksi-hapus">❌ Hapus Lembar Ini</option>
            </select>

            <!-- DROPDOWN RIWAYAT PENANDA (Tempat Menyimpan Anak Penanda Link) -->
            <select class="dropdown-select" id="dropdown-riwayat" onchange="lompatKeRiwayatPenanda()" style="background-color: #34495e; border-color: #2c3e50;">
                <option value="default">📂 -- LIHAT RIWAYAT PENANDA --</option>
            </select>

            <!-- Kolom Input Pencarian -->
            <input type="text" id="search-input" class="search-box" placeholder="🔍 Cari kata kunci catatan di buku ini..." oninput="cariTeksBuku()">
        </div>

        <!-- PANEL RADIO BUTTON (Anak Penanda Halaman Aktif) -->
        <div class="radio-dropdown-panel" id="radio-container">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>

        <!-- Input File Picker Perangkat -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- AREA GAMBAR (Mendukung Double-Click) -->
        <div class="content-area" id="book-content" ondblclick="klikDuaKaliMajuLembar(event)">
            <div class="record-status" id="record-indicator">🔴 Sedang Merekam...</div>
            <div id="media-placeholder" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none;"></div>
        </div>

        <!-- AREA KETIK TEKS (Mendukung Double-Click) -->
        <div class="text-work-space" ondblclick="klikDuaKaliMajuLembar(event)">
            <textarea id="text-input-field" class="book-textarea" placeholder="Ketik kalimat atau isi catatan lembar baru di sini..."></textarea>
        </div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 1</div>
    </div>

<script>
    localStorage.clear();

    // Database Buku Utama (Membuka B.png pertama kali)
    let databaseBuku = [
        { type: "image", src: "./File/Gambar/Buku/B.png", teks: "Ini catatan awal lembar B.png. Silakan ketik kalimat baru, lalu blok kalimat tersebut dan pilih menu penanda untuk membuat link riwayat." }
    ];

    // Struktur Data Riwayat Penanda Teks Blok
    let riwayatPenanda = [];

    let indeksAktif = 0;
    let mediaRecorder;
    let audioChunks = [];
    let sedangMerekam = false;

    const elContent = document.getElementById('book-content');
    const elPlaceholder = document.getElementById('media-placeholder');
    const elMenu = document.getElementById('menu-navigasi');
    const elRiwayatDropdown = document.getElementById('dropdown-riwayat');
    const elIndikator = document.getElementById('page-indicator');
    const elTextField = document.getElementById('text-input-field');
    const elRecordIndicator = document.getElementById('record-indicator');
    const elRadioContainer = document.getElementById('radio-container');
    const elSearchInput = document.getElementById('search-input');

    function muatHalaman(indeks) {
        indeksAktif = indeks;
        const data = databaseBuku[indeksAktif];
        elPlaceholder.innerHTML = '';
        elContent.style.backgroundImage = 'none';

        if (data.type === 'text-only') {
            elContent.style.display = 'none'; 
        } else {
            elContent.style.display = 'flex'; 
            if (data.type === 'image' && data.src) {
                elContent.style.backgroundImage = `url('${data.src}')`;
            } else if (data.type === 'video') {
                elPlaceholder.innerHTML = `<video src="${data.src}" controls></video>`;
            } else if (data.type === 'audio') {
                elPlaceholder.innerHTML = `<audio src="${data.src}" controls></audio>`;
            }
        }

        elTextField.value = data.teks || "";
        elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
        
        renderRadioHalaman();
    }
    // FUNGSI MEMBUAT ANAK PENANDA RADIO DI BAWAH NAVIGASI
    function renderRadioHalaman() {
        elRadioContainer.innerHTML = '';
        databaseBuku.forEach((item, index) => {
            const label = document.createElement('label');
            label.className = 'radio-item';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'anak-penanda';
            radio.value = index;
            radio.checked = (index === indeksAktif);
            radio.onchange = function() {
                muatHalaman(parseInt(this.value));
            };
            
            label.appendChild(radio);
            label.appendChild(document.createTextNode(`Halaman ${index + 1}`));
            elRadioContainer.appendChild(label);
        });
    }

    // FUNGSI MEMPROSES BLOK KALIMAT MENJADI LINK DI DROPDOWN RIWAYAT
    function buatPenandaDariBlokTeks() {
        const areaTeks = elTextField;
        const teksTerpilih = areaTeks.value.substring(areaTeks.selectionStart, areaTeks.selectionEnd);

        if (!teksTerpilih.trim()) {
            alert("Gagal! Silakan blokir/sorot beberapa kata atau kalimat di dalam catatan terlebih dahulu.");
            return;
        }

        // Menyimpan data link penanda ke dalam array riwayat
        const dataBaru = {
            idHalaman: indeksAktif,
            potonganTeks: teksTerpilih.trim()
        };
        riwayatPenanda.push(dataBaru);

        // Menambahkan opsi baru ke dalam Dropdown Riwayat
        const opsiBaru = document.createElement('option');
        opsiBaru.value = riwayatPenanda.length - 1;
        opsiBaru.text = `🔗 [Hlm ${indeksAktif + 1}] "${teksTerpilih.trim().substring(0, 20)}..."`;
        elRiwayatDropdown.appendChild(opsiBaru);

        alert(`Sukses! Kalimat berhasil diblog dan ditautkan ke Dropdown Riwayat.`);
    }

    // FUNGSI LOMPAT HALAMAN SAAT OPSI RIWAYAT DIKLIK
    function lompatKeRiwayatPenanda() {
        const indeksRiwayat = elRiwayatDropdown.value;
        if (indeksRiwayat === 'default') return;

        const targetPenanda = riwayatPenanda[indeksRiwayat];
        muatHalaman(targetPenanda.idHalaman);
        
        // Memfokuskan kolom teks dan menyorot teks penanda secara otomatis
        setTimeout(() => {
            elTextField.focus();
            const posisiMulai = elTextField.value.indexOf(targetPenanda.potonganTeks);
            if (posisiMulai !== -1) {
                elTextField.setSelectionRange(posisiMulai, posisiMulai + targetPenanda.potonganTeks.length);
            }
        }, 200);

        elRiwayatDropdown.value = 'default'; // Reset dropdown ke default setelah diklik
    }

    // FUNGSI PENCARIAN TEKS CATATAN
    function cariTeksBuku() {
        const kataKunci = elSearchInput.value.toLowerCase().trim();
        if (!kataKunci) return;

        const indeksDitemukan = databaseBuku.findIndex(item => item.teks.toLowerCase().includes(kataKunci));
        if (indeksDitemukan !== -1) {
            muatHalaman(indeksDitemukan);
        }
    }

    elTextField.addEventListener('input', function() {
        databaseBuku[indeksAktif].teks = elTextField.value;
    });

    // NAVIGASI DOUBLE CLICK UNTUK LEMBAR BERIKUTNYA
    function klikDuaKaliMajuLembar(event) {
        if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO') return;

        if (indeksAktif < databaseBuku.length - 1) {
            indeksAktif++;
        } else {
            indeksAktif = 0;
        }
        muatHalaman(indeksAktif);
    }

    function eksekusiPilihanMenu() {
        const nilaiPilihan = elMenu.value;
        if (nilaiPilihan === 'default') return;

        if (nilaiPilihan === 'aksi-tambah') {
            databaseBuku.push({
                type: "text-only",
                src: "",
                teks: `Ini adalah lembar halaman baru ke-${databaseBuku.length + 1} yang berhasil Anda buat.`
            });
            muatHalaman(databaseBuku.length - 1);
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-bookmark') {
            buatPenandaDariBlokTeks();
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-wa') {
            const teksKirim = encodeURIComponent(`Catatan Lembar ${indeksAktif + 1}:\n${elTextField.value}`);
            window.open('https://whatsapp.com' + teksKirim, '_blank');
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-img') {
            document.getElementById('file-image').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-vid') {
            document.getElementById('file-video').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-mp3') {
            document.getElementById('file-audio').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-rekan') {
            toggleRekamSuara();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-hapus') {
            if (databaseBuku.length <= 1) {
                alert("Gagal! Minimal harus menyisakan 1 halaman.");
                elMenu.value = 'default';
                return;
            }
            if (confirm("Hapus lembar halaman ini?")) {
                databaseBuku.splice(indeksAktif, 1);
                if (indeksAktif >= databaseBuku.length) {
                    indeksAktif = databaseBuku.length - 1;
                }
                muatHalaman(indeksAktif);
            }
            elMenu.value = 'default';
        }
    }

    function handleFileSelected(input, type) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const fileURL = URL.createObjectURL(file);
            
            databaseBuku[indeksAktif] = {
                type: type,
                src: fileURL,
                teks: elTextField.value
            };
            muatHalaman(indeksAktif);
        }
    }

    function toggleRekamSuara() {
        sedangMerekam = !sedangMerekam;
        if (sedangMerekam) {
            elRecordIndicator.style.display = 'block';
        } else {
            elRecordIndicator.style.display = 'none';
        }
    }

    muatHalaman(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Buku Digital Interaktif</title>
    <style>
        /* CSS Utama Aplikasi */
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f7f6;
            max-width: 500px;
            margin: 0 auto;
        }
        .box-pembuat {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .pilih-kategori {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 5px;
        }
        button:active {
            background-color: #0056b3;
        }
        
        /* STYLE TEKS HYPERLINK ANTI-BOCOR */
        /* Menggunakan display: inline-block agar area klik hanya sebatas kata yang diblok saja */
        .hyperlink-teks {
            color: #0056b3;
            text-decoration: underline;
            font-weight: bold;
            display: inline-block; 
            cursor: pointer;
            padding: 0 2px;
        }
        .hyperlink-teks:hover {
            color: #003366;
        }

        .box-hasil {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border-left: 5px solid #28a745;
            margin-top: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        ul {
            padding-left: 20px;
            margin-top: 10px;
        }
        li {
            margin: 10px 0;
            line-height: 1.5;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <!-- AREA ALAT PEMBUAT TEKS HYPERLINK -->
    <div class="box-pembuat">
        <label style="font-weight: bold;">Ketik Teks Buku:</label>
        <input type="text" id="inputTeksBuku" placeholder="Contoh: Bacaan materi satu hari ini">
        <button type="button" onclick="buatHyperlinkLangsung()">🔗 Buat Menjadi Teks Hyperlink</button>
    </div>

    <!-- DROPDOWN PILIHAN KELOMPOK -->
    <label class="pilih-kategori">Pilih Menu Kategori:</label>
    <select id="menuDropdown" onchange="renderDaftarBuku()">
        <option value="">--pilih--</option>
        <option value="A">Kelompok A</option>
        <option value="B">Kelompok B</option>
    </select>

    <!-- KOTAK DATA ANAK CUCU (TEMPAT MENAMPILKAN HASIL) -->
    <div id="areaCucuCucu" class="box-hasil" style="display: none;">
        <h4 style="margin:0; color: #333;">Data Anak Kelompok <span id="namaKelompokAktif"></span></h4>
        <ul id="listCucu"></ul>
    </div>


    <!-- LOGIKA JAVASCRIPT MANDIRI & TERISOLASI -->
    <script>
        // DATABASE INTERNAL (Sistem Array Terkunci ala Al-Qur'an Digital)
        // Data awal default aplikasi Anda
        let databaseBukuStatis = [
            { judul: "Materi Bawaan Asli 1", kelompok: "A" },
            { judul: "Materi Bawaan Asli 2", kelompok: "A" }
        ];

        function buatHyperlinkLangsung() {
    const kolomInput = document.getElementById('inputTeksBuku');
    const dropdown = document.getElementById('menuDropdown');

    if (!kolomInput) return;

    const teksUtuh = kolomInput.value; 
    
    // 1. Deteksi kata yang diblok
    const posisiMulai = kolomInput.selectionStart;
    const posisiSelesai = kolomInput.selectionEnd;
    const teksYangDiblok = teksUtuh.substring(posisiMulai, posisiSelesai).trim();

    if (posisiMulai === posisiSelesai || teksYangDiblok === "") {
        alert("Silakan BLOK/SELEKSI salah satu kata di dalam kotak teks terlebih dahulu!");
        return;
    }

    kolomInput.blur(); // Tutup keyboard HP 

    // 2. Proses isolasi kata yang diblok agar tidak bocor
    const teksSebelumBlok = teksUtuh.substring(0, posisiMulai);
    const teksSetelahBlok = teksUtuh.substring(posisiSelesai);
    const formatHyperlinkTerisolasi = `<a href="#" class="hyperlink-teks" onclick="aksiKlikLink('${teksYangDiblok}')">${teksYangDiblok}</a>`;

    const hasilKalimatFinal = teksSebelumBlok + formatHyperlinkTerisolasi + teksSetelahBlok;

    // 3. Masukkan data ke memori internal
    const dataBaru = {
        judul: hasilKalimatFinal,
        kelompok: "A" 
    };
    databaseBukuStatis.push(dataBaru);

    // 4. Update tampilan kelompok A
    if (dropdown) {
        dropdown.value = "A";
        renderDaftarBuku(); 
    }

    // KUNCI PERUBAHAN: Baris kolomInput.value = ""; DIHAPUS 
    // Teks di dalam kotak ketikan Anda sekarang akan tetap utuh dan TIDAK HILANG lagi!
}


            // Bersihkan kembali kotak input teks atas agar kosong kembali
            kolomInput.value = "";
        }

    if (posisiMulai === posisiSelesai || teksYangDiblok === "") {
        alert("Silakan BLOK/SELEKSI salah satu kata di dalam kotak teks terlebih dahulu!");

    }

    kolomInput.blur(); // Tutup keyboard HP

    // Melepas efek blokir biru di HP agar browser tidak nge-bug/macet
    if (window.getSelection) {
        window.getSelection().removeAllRanges();
    }

    // 2. Proses isolasi kata yang diblok agar tidak bocor (Sintaks Baris 143 Diperbaiki)
    const teksSebelumBlok = teksUtuh.substring(0, posisiMulai);

    // 3. Masukkan data ke memori internal

function buatHyperlinkLangsung() {
    const kolomInput = document.getElementById('inputTeksBuku');
    const dropdown = document.getElementById('menuDropdown');

    if (!kolomInput) return;

    const teksUtuh = kolomInput.value; 
    
    // 1. Deteksi kata yang diblok
    const posisiMulai = kolomInput.selectionStart;
    const posisiSelesai = kolomInput.selectionEnd;
    const teksYangDiblok = teksUtuh.substring(posisiMulai, posisiSelesai).trim();

    if (posisiMulai === posisiSelesai || teksYangDiblok === "") {
        alert("Silakan BLOK/SELEKSI salah satu kata di dalam kotak teks terlebih dahulu!");
        return;
    }

    kolomInput.blur(); // Tutup keyboard HP

    // Melepas fokus blokir agar browser HP tidak nge-bug/macet
    if (window.getSelection) {
        window.getSelection().removeAllRanges();
    }

    // 2. Isolasi kata yang diblok agar tidak bocor (Tanda petik baris 143 diperbaiki total)
    const teksSebelumBlok = teksUtuh.substring(0, posisiMulai);
    const teksSetelahBlok = teksUtuh.substring(posisiSelesai);
    const formatHyperlinkTerisolasi = '<a href="#" class="hyperlink-teks" onclick="aksiKlikLink(\'' + teksYangDiblok + '\')">🔗 ' + teksYangDiblok + '</a>';

    const hasilKalimatFinal = teksSebelumBlok + formatHyperlinkTerisolasi + teksSetelahBlok;

    // 3. Masukkan data ke memori internal
    const dataBaru = {
        judul: hasilKalimatFinal,
        kelompok: "A" 
    };
    databaseBukuStatis.push(dataBaru);

    // 4. Update tampilan kelompok A (Menggunakan huruf besar kecil yang konsisten)
    if (dropdown) {
        dropdown.value = "A";
        renderDaftarBuku(); 
    }
}

// 5. FUNGSI UNTUK MENGGAMBAR DAFTAR BUKU KE LAYAR HP
function renderDaftarBuku() {
    const dropdown = document.getElementById('menuDropdown');
    const areaBox = document.getElementById('areaCucuCucu');
    const wadahList = document.getElementById('listCucu');
    const labelKelompok = document.getElementById('namaKelompokAktif');

    if (!dropdown || !areaBox || !wadahList || !labelKelompok) return;

    const kategoriDipilih = dropdown.value;

    if (kategoriDipilih === "") {
        areaBox.style.display = "none";
        return;
    }

    // Bersihkan tampilan layar lama sebelum menggambar baru
    wadahList.innerHTML = "";
    labelKelompok.innerText = kategoriDipilih;
    areaBox.style.display = "block";

    // Saring dan tampilkan data secara aman
    databaseBukuStatis.forEach(function(buku) {
        if (buku.kelompok === kategoriDipilih) {
            const barisLi = document.createElement('li');
            // Menampilkan properti judul objek dengan aman
            barisLi.innerHTML = buku.judul; 
            wadahList.appendChild(barisLi);
        }
    });
}

// 6. FUNGSI KETIKA TEKS HYPERLINK DIKLIK OLEH PEMBACA BUKU
function aksiKlikLink(kataDipilih) {
    alert("Sistem Berhasil Merespons! Anda mengklik tautan kata interaktif: " + kataDipilih);
}

// Jalankan penampilan awal saat halaman dimuat
renderDaftarBuku();


    </script>
</body>
</html>

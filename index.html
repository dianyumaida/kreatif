<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Buku Digital</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku - FULL PAGE */
        .book-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
        }

        .dropdown-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* PANEL TOMBOL PENGATUR UKURAN MEDIA RAMAH HP */
        .media-tools-bar {
            background-color: #2c3e50;
            padding: 6px;
            display: none; 
            gap: 6px;
            border-bottom: 2px solid #27ae60;
            z-index: 200;
        }

        .media-btn {
            flex: 1;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }

        .media-btn:hover { background-color: #2ecc71; }
        /* Status Perekaman Suara */
        .record-status {
            font-weight: bold;
            color: white;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: #e74c3c;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 250;
            cursor: pointer;
            border: 2px solid white;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { from { transform: scale(1) translateX(-50%); } to { transform: scale(1.05) translateX(-50%); } }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
            z-index: 190;
        }

        /* AREA KETIK TEKS UTAMA - SEMUA MEDIA MENYATU DI SINI AGAR BISA DI-ENTER */
        .text-work-space {
            padding: 20px;
            background-color: #ffffff;
            margin: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
            outline: none;
            flex-grow: 1;
            position: relative;
            z-index: 10;
        }

        /* FORMAT MEDIA INLINE: Wajib ikut turun ke bawah secara otomatis saat di-enter */
        .embedded-media-block {
            display: block; 
            margin: 12px auto;
            max-width: 100%;
            width: 180px; 
            border: 2px solid transparent;
            box-sizing: border-box;
            border-radius: 6px;
            cursor: pointer;
            transition: border 0.1s ease;
        }

        /* Beri indikator jika media sedang dipilih untuk diubah ukurannya */
        .embedded-media-block.selected-target {
            border-color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        .embedded-media-block img, .embedded-media-block video, .embedded-media-block audio {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        /* GAYA HYPERLINK PENANDA CATATAN */
        .hyperlink-bookmark {
            color: #0066cc;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
            background-color: rgba(0, 102, 204, 0.1);
            padding: 0 2px;
            border-radius: 3px;
        }
        .radio-dropdown-panel {
            padding: 8px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            align-items: center;
            z-index: 190;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            cursor: pointer;
        }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- SATU DROPDOWN UTAMA DI ATAS -->
        


<div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">-- MENU UTAMA KELOLA BUKU --</option>
                <option value="aksi-tambah">➕ Tambah Halaman Baru</option>
                   <option value="aksi-cari">🔍  Pencarian </option>
                <option value="aksi-wa">📲 kirim Saluran WhatsApp </option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru (Letak Kursor)</option>
                <option value="aksi-upload-vid">🎥 Upload Video Baru (Letak Kursor)</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekan">🎙️ Mulai Perekaman Suara</option>
                <option value="aksi-hapus">❌ Hapus Lembar Ini</option>
                <details class="dropdown-anak level-2">
            <summary>
                <span>📁 -- DAFTAR  hyperlink PENANDA--"  --</span>
                <span class="panah-anak">▶</span>
            </summary>
             <ul class="list-akhir">
                <li onclick="pilihOpsi Akhir('Sudut: sin', this, event)">
                    <input type="radio" name="pilihan_kalkulator" value="1">
                    <span>1</span>
                </li>
                <li onclick="pilihOpsi Akhir('Sudut: cos', this, event)">
                    <input type="radio" name="pilihan_kalkulator" value="2">
                    <span>2</span>
                </li>
                <li onclick="pilihOpsi Akhir('Sudut: tan', this, event)">
                    <input type="radio" name="pilihan_kalkulator" value="3">
                    <span>3</span>
                </li>
            </ul></details>
    <script>
        const indukMenu = document.getElementById('menuUtama');
        const textHeaderUtama = document.getElementById('textHeaderUtama');

        // Fungsi ketika item radio di level paling akhir diklik
        function pilihOpsi Akhir(namaTerpilih, elemenAktif, event) {
            // Stop propagasi agar folder pembungkusnya tidak ikut menutup/kacau
            event.stopPropagation(); 
            event.preventDefault();

            // Matikan status terpilih dari semua list item yang ada di dokumen
            document.querySelectorAll('.list-akhir li').forEach(li => {
                li.classList.remove('terpilih');
            });
 
            // Tandai item yang baru saja diklik
            elemenAktif.classList.add('terpilih');
 
            // Centang radio button kustom di dalamnya
            const radioAsli = elemenAktif.querySelector('input[type="radio"]');
            if (radioAsli) {
                radioAsli.checked = true;
            }

            // Set teks header paling atas sesuai item yang dipilih
            textHeaderUtama.innerText = namaTerpilih;

            // Tutup total dropdown induk utama
            indukMenu.removeAttribute('open');
        }
                    <!-- Diisi otomatis -->
                </optgroup>
            </select>
        </div> <!-- Diisi otomatis -->
                </optgroup>
            </select>
        </div>

        <!-- BAR TOMBOL KONTROL UKURAN MEDIA YANG DIKLIK -->
        <div class="media-tools-bar" id="media-tools">
            <button class="media-btn" onclick="ubahUkuranKlik(30)">➕ Perbesar</button>
            <button class="media-btn" onclick="ubahUkuranKlik(-30)">➖ Perkecil</button>
            <button class="media-btn" onclick="hapusMediaKlik()" style="background:#e74c3c;">❌ Hapus</button>
        </div>

        <!-- PANEL RADIO BUTTON -->
        <div class="radio-dropdown-panel" id="radio-container">
            <!-- Diisi otomatis -->
        </div>

        <!-- Input File Picker Perangkat -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- KANVAS UTAMA TEMPAT MENGETIK & MENYUSUN MEDIA -->
        <div id="text-input-field" class="text-work-space" contenteditable="true" placeholder="Silakan ketik catatan lembar baru Anda di sini..." onmouseup="periksaSeleksiTeks()" onkeyup="periksaSeleksiTeks()" onclick="deteksiKlikMedia(event)" intent="field" ondblclick="klikDuaKaliMajuLembar(event)">
            <button class="record-status" id="record-indicator" onclick="toggleRekamSuara()">🔴 ⏹️ Klik di Sini untuk Stop Rekam</button>
        </div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 1</div>
    </div>
<script>
    let databaseBuku = [
        { teks: "" }
    ];

    let riwayatPenanda = [];
    let indeksAktif = 0;
    let elemenMediaTerpilih = null; 
    let mediaRecorder;
    let audioChunks = [];
    let sedangMerekam = false;
    let streamSuara = null;

    const elMenu = document.getElementById('menu-navigasi');
    const elGrupRiwayat = document.getElementById('grup-riwayat-penanda');
    const elIndikator = document.getElementById('page-indicator');
    const elTextField = document.getElementById('text-input-field');
    const elRecordIndicator = document.getElementById('record-indicator');
    const elRadioContainer = document.getElementById('radio-container');
    const elMediaTools = document.getElementById('media-tools');

    function muatHalaman(indeks) {
        indeksAktif = indeks;
        const data = databaseBuku[indeksAktif];
        elMediaTools.style.display = 'none';
        elemenMediaTerpilih = null;

        elTextField.innerHTML = data.teks || "";

        // Pastikan widget bawaan sistem dan fungsionalitas pemutar media dikembalikan
        perbaruiElemenVideoHalaman();
        elTextField.appendChild(elRecordIndicator);

        elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
        renderRadioHalaman();
    }

    function deteksiKlikMedia(event) {
        let targetBlock = event.target.closest('.embedded-media-block');
        
        if (targetBlock) {
            event.stopPropagation();
            const semuaM = elTextField.querySelectorAll('.embedded-media-block');
            semuM.forEach(m => m.classList.remove('selected-target'));

            elemenMediaTerpilih = targetBlock;
            elemenMediaTerpilih.classList.add('selected-target');
            elMediaTools.style.display = 'flex'; 
        } else {
            elemenMediaTerpilih = null;
            elMediaTools.style.display = 'none';
            const semuaM = elTextField.querySelectorAll('.embedded-media-block');
            semuM.forEach(m => m.classList.remove('selected-target'));
        }
    }

    function ubahUkuranKlik(nilaiTambah) {
        if (!elemenMediaTerpilih) return;
        let lebarLama = elemenMediaTerpilih.offsetWidth;
        let lebarBaru = lebarLama + nilaiTambah;

        if (lebarBaru < 60) lebarBaru = 60; 
        if (lebarBaru > 380) lebarBaru = 380; 

        elemenMediaTerpilih.style.width = lebarBaru + 'px';
        databaseBuku[indeksAktif].teks = elTextField.innerHTML; 
    }

    function hapusMediaKlik() {
        if (!elemenMediaTerpilih) return;
        elemenMediaTerpilih.remove();
        elemenMediaTerpilih = null;
        elMediaTools.style.display = 'none';
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
    }
    // FIX PENANDA LINK CATATAN
    let kataKunciSeleksi = "";
    function periksaSeleksiTeks() {
        kataKunciSeleksi = window.getSelection().toString().trim();
    }

    function buatPenandaDariBlokTeks() {
        if (!kataKunciSeleksi) {
            alert("Gagal! Silakan sorot/blok kalimat teks di dalam catatan terlebih dahulu sebelum memilih menu ini.");
            return;
        }

        const seleksi = window.getSelection();
        if (seleksi.rangeCount > 0) {
            const range = seleksi.getRangeAt(0);
            const aLink = document.createElement('span');
            aLink.className = 'hyperlink-bookmark';
            aLink.textContent = kataKunciSeleksi;
            
            const penandaId = "link-" + Date.now();
            aLink.setAttribute('data-link-id', penandaId);

            range.deleteContents();
            range.insertNode(aLink);

            databaseBuku[indeksAktif].teks = elTextField.innerHTML;

            const dataRiwayat = { idHalaman: indeksAktif, linkId: penandaId, isiTeks: kataKunciSeleksi };
            riwayatPenanda.push(dataRiwayat);

            const opsiBaru = document.createElement('option');
            opsiBaru.value = "riwayat-" + (riwayatPenanda.length - 1);
            opsiBaru.text = `🔗 [Hlm ${indeksAktif + 1}] "${kataKunciSeleksi.substring(0, 18)}..."`;
            elGrupRiwayat.appendChild(opsiBaru);

            seleksi.removeAllRanges();
            kataKunciSeleksi = "";
            alert("Sukses! Kalimat dijadikan hyperlink penanda.");
        }
    }

    function lompatKeRiwayatPenanda() {
        const nilaiPilihan = elMenu.value;
        if (!nilaiPilihan.startsWith("riwayat-")) return;
        
        const indeksRiwayat = parseInt(nilaiPilihan.replace("riwayat-", ""));
        const target = riwayatPenanda[indeksRiwayat];
        muatHalaman(target.idHalaman);
        
        setTimeout(() => {
            const elemenLink = elTextField.querySelector(`[data-link-id="${target.linkId}"]`);
            if (elemenLink) {
                elemenLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
                elemenLink.style.backgroundColor = "#ffcc00";
                setTimeout(() => elemenLink.style.backgroundColor = "rgba(0, 102, 204, 0.1)", 1500);
            }
        }, 300);
        elMenu.value = 'default';
    }

    function renderRadioHalaman() {
        elRadioContainer.innerHTML = '';
        databaseBuku.forEach((item, index) => {
            const label = document.createElement('label');
            label.className = 'radio-item';
            const radio = document.createElement('input');
            radio.type = 'radio'; radio.name = 'anak-penanda'; radio.value = index;
            radio.checked = (index === indeksAktif);
            radio.onchange = function() { databaseBuku[indeksAktif].teks = elTextField.innerHTML; muatHalaman(parseInt(this.value)); };
            label.appendChild(radio);
            label.appendChild(document.createTextNode(`Halaman ${index + 1}`));
            elRadioContainer.appendChild(label);
        });
    }

    elTextField.addEventListener('input', function() {
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
    });

    function klikDuaKaliMajuLembar(event) {
        if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO' || event.target.tagName === 'IMG' || event.target.closest('.embedded-media-block')) return;
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
        if (indeksAktif < databaseBuku.length - 1) { indeksAktif++; } else { indeksAktif = 0; }
        muatHalaman(indeksAktif);
    }
    function cariTeksBuku() {
        const kataKunci = prompt("Masukkan kata kunci catatan yang ingin dicari:");
        if (!kataKunci || !kataKunci.trim()) return;
        const indeksDitemukan = databaseBuku.findIndex(item => item.teks.toLowerCase().includes(kataKunci.toLowerCase().trim()));
        if (indeksDitemukan !== -1) { muatHalaman(indeksDitemukan); } else { alert("Kata kunci tidak ditemukan."); }
    }

    function eksekusiPilihanMenu() {
        const nilaiPilihan = elMenu.value;
        if (nilaiPilihan === 'default') return;
        if (nilaiPilihan.startsWith("riwayat-")) { lompatKeRiwayatPenanda(); return; }

        if (nilaiPilihan === 'aksi-tambah') {
            databaseBuku[indeksAktif].teks = elTextField.innerHTML;
            databaseBuku.push({ teks: "" });
            muatHalaman(databaseBuku.length - 1);
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-bookmark') {
            buatPenandaDariBlokTeks();
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-cari') {
            cariTeksBuku(); elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-wa') {
            const clone = elTextField.cloneNode(true);
            const extra = clone.querySelectorAll('.embedded-media-block, .record-status');
            extra.forEach(x => x.remove());
            const teksMurni = clone.innerText || clone.textContent;
            
            const teksKirim = encodeURIComponent Atlantic (`Berikut update Catatan Buku Digital Lembar ${indeksAktif + 1}:\n\n"${teksMurni.trim()}"\n\nIkuti saluran KASY di WhatsApp: https://whatsapp.com`);
            const linkWA = document.createElement('a'); linkWA.href = `https://wa.me{teksKirim}`; linkWA.target = '_blank';
            document.body.appendChild(linkWA); linkWA.click(); document.body.removeChild(linkWA);
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-img') {
            document.getElementById('file-image').click(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-vid') {
            document.getElementById('file-video').click(); elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-upload-mp3') {
            document.getElementById('file-audio').click(); elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-rekan') {
            toggleRekamSuara(); elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-hapus') {
            if (databaseBuku.length <= 1) { alert("Gagal!"); elMenu.value = 'default'; return; }
            if (confirm("Hapus lembar halaman ini?")) {
                databaseBuku.splice(indeksAktif, 1);
                if (indeksAktif >= databaseBuku.length) { indeksAktif = databaseBuku.length - 1; }
                muatHalaman(indeksAktif);
            }
            elMenu.value = 'default';
        }
    }

    function handleFileSelected(input, type) {
        if (input.files && input.files.length > 0) {
            const fileObj = input.files[0];

            const selection = window.getSelection();
            let range;
            if (selection.rangeCount > 0) {
                range = selection.getRangeAt(0);
            } else {
                range = document.createRange();
                range.selectNodeContents(elTextField);
                range.collapse(false);
            }

            const mediaBlock = document.createElement('div');
            mediaBlock.className = 'embedded-media-block';
            mediaBlock.contentEditable = 'false';

            const mediaURL = URL.createObjectURL(fileObj);

            if (type === 'image') {
                const img = document.createElement('img');
                img.src = mediaURL;
                mediaBlock.appendChild(img);
                prosesPenyisipanBlokMedia(range, mediaBlock);
            } 
            else if (type === 'video') {
                const video = document.createElement('video');
                video.src = mediaURL;
                video.controls = true;
                video.playsInline = true;
                mediaBlock.appendChild(video);
                prosesPenyisipanBlokMedia(range, mediaBlock);
            }
            else if (type === 'audio') {
                const audio = document.createElement('audio');
                audio.src = mediaURL;
                audio.controls = true;
                mediaBlock.appendChild(audio);
                prosesPenyisipanBlokMedia(range, mediaBlock);
            }
        }
        input.value = ''; 
    }

    function prosesPenyisipanBlokMedia(range, mediaBlock) {
        range.insertNode(mediaBlock);
        const brNode = document.createElement('br');
        range.setStartAfter(mediaBlock);
        range.insertNode(brNode);
        range.setStartAfter(brNode);
        range.collapse(true);
        
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
        elTextField.focus();
    }

    function perbaruiElemenVideoHalaman() {
        const semuaMedia = elTextField.querySelectorAll('video, audio');
        semuaMedia.forEach(med => {
            med.controls = true;
            med.onclick = (e) => { e.stopPropagation(); };
        });
    }

    // FIX MUTLAK PEREKAMAN AUDIO OBJECT BLOB JALAN DI SEMUA HP & LAPTOP
    function toggleRekamSuara() {
        if (!sedangMerekam) {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    streamSuara = stream;
                    mediaRecorder = new MediaRecorder(stream); 
                    audioChunks = [];
                    
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const audioURL = URL.createObjectURL(audioBlob);
                        
                        // Menyisipkan player audio baru tepat di letak kursor ketikan aktif Anda
                        const selection = window.getSelection();
                        let range = selection.rangeCount > 0 ? selection.getRangeAt(0) : document.createRange();
                        
                        const mediaBlock = document.createElement('div');
                        mediaBlock.className = 'embedded-media-block';
                        mediaBlock.contentEditable = 'false';
                        
                        const audio = document.createElement('audio');
                        audio.src = audioURL;
                        audio.controls = true;
                        
                        mediaBlock.appendChild(audio);
                        prosesPenyisipanBlokMedia(range, mediaBlock);
                    };
                    
                    mediaRecorder.start(); 
                    sedangMerekam = true; 
                    elRecordIndicator.style.display = 'block';
                }).catch(err => alert("Gagal merekam! Pastikan menggunakan protokol HTTPS resmi halaman Pages Anda."));
            }
        } else {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop(); 
                if (streamSuara) {
                    streamSuara.getTracks().forEach(track => track.stop());
                }
            }
            sedangMerekam = false; 
            elRecordIndicator.style.display = 'none';
        }
    }

    muatHalaman(0);
</script>
</body>
</html>

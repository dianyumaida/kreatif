<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Digital Interaktif</title>
    <!-- Memuat jQuery dan Turn.js untuk efek bolak-balik buku -->
    <script src="https://jquery.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            background-color: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
        }
        h1 { margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        p { margin-top: 0; color: #bdc3c7; }
        
        /* Area Kontainer Buku */
        #canvas {
            margin: 30px auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }
        #buku-digital {
            width: 800px;
            height: 500px;
        }
        /* Style untuk setiap halaman di dalam buku */
        .page {
            width: 400px;
            height: 500px;
            background-color: white;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
        }
        /* Efek bayangan tengah buku agar terlihat realistis */
        .buku-digital .shadow {
            box-shadow: 0 0 20px rgba(0,0,0,0.2) inset;
        }

        /* Form Navigasi & Tambah Halaman Baru */
        .controls {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            display: flex;
            gap: 15px;
            align-items: center;
        }
        input, button {
            padding: 10px 15px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
        }
        input { width: 200px; }
        button {
            background-color: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
        .info-hal { font-size: 16px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>📖 Buku Digital Kreatif Anda</h1>
    <p>Klik pada pojok halaman atau gunakan tombol di bawah untuk membalik lembaran buku</p>

    <!-- Tempat Buku Ditampilkan -->
    <div id="canvas">
        <div id="buku-digital">
            <!-- Halaman-halaman buku akan dimasukkan otomatis oleh JavaScript di sini -->
        </div>
    </div>

    <!-- Kontrol Navigasi dan Manajemen Halaman -->
    <div class="controls">
        <button onclick="$('#buku-digital').turn('previous')">⬅️ Halaman Sebelumnya</button>
        <span class="info-hal" id="page-number">Halaman 1</span>
        <button onclick="$('#buku-digital').turn('next')">Halaman Berikutnya ➡️</button>
    </div>

    <div class="controls" style="margin-top: 10px;">
        <input type="text" id="nama-gambar" placeholder="Upload lembar baru (Contoh: D.png)">
        <button onclick="tambahLembarBaru()">➕ Tambah Lembar ke Buku</button>
        <button class="btn-danger" onclick="hapusLembarTerakhir()">🗑️ Hapus Lembar Terakhir</button>
    </div>

    <script>
        // Struktur halaman awal sesuai dengan file gambar Anda
        // A.png jadi cover utama, B.png lembar kedua, C.png lembar ketiga
        let daftarHalaman = [
            "File/Gambar/Buku/A.png", // Cover Depan (Halaman 1)
            "File/Gambar/Buku/B.png", // Halaman Isi 1 (Halaman 2)
            "File/Gambar/Buku/C.png"  // Halaman Isi 2 (Halaman 3)
        ];

        // Ambil memori halaman dari LocalStorage browser jika sebelumnya pernah ditambah/diedit
        if(localStorage.getItem('daftarHalamanBuku')) {
            daftarHalaman = JSON.parse(localStorage.getItem('daftarHalamanBuku'));
        }

        // Fungsi utama untuk merakit lembaran gambar menjadi sebuah buku
        function rakitBuku() {
            const buku = $('#buku-digital');
            buku.html(''); // Bersihkan buku lama

            daftarHalaman.forEach((gambarPath, index) => {
                // Buat elemen div untuk setiap lembar halaman baru
                const elemenHalaman = $('<div class="page"></div>');
                
                // Masukkan gambar Anda sebagai latar belakang lembaran buku
                elemenHalaman.css('background-image', `url('${gambarPath}')`);
                
                // Tambahkan penanganan jika gambar belum diupload ke GitHub agar tidak kosong melompong
                elemenHalaman.attr('onerror', "this.style.backgroundImage='url(https://placehold.co)'");
                
                buku.append(elemenHalaman);
            });

            // Jalankan fungsi efek bolak-balik Turn.js
            buku.turn({
                width: 800,
                height: 500,
                elevation: 50,
                gradients: true,
                autoCenter: true,
                when: {
                    turned: function(event, page, view) {
                        $('#page-number').text(`Halaman ${page} dari ${daftarHalaman.length}`);
                    }
                }
            });
            
            // Simpan struktur halaman terbaru ke penyimpanan browser
            localStorage.setItem('daftarHalamanBuku', JSON.stringify(daftarHalaman));
        }

        // 1. FUNGSI AUTO-TAMBAH (Saat Anda mengetik D.png atau memasukkan contoh gambar C)
        function tambahLembarBaru() {
            const input = document.getElementById('nama-gambar');
            const namaFile = input.value.trim();

            if (!namaFile) {
                alert("Silahkan ketik nama file gambarnya dahulu!");
                return;
            }

            // Otomatis mengarahkan ke lokasi folder gambar Anda di GitHub
            const pathLengkap = `File/Gambar/Buku/${namaFile.includes('.') ? namaFile : namaFile + '.png'}`;
            
            daftarHalaman.push(pathLengkap);
            input.value = ''; // Reset input
            
            // Hancurkan objek buku lama dan rakit ulang dengan lembaran baru
            $('#buku-digital').turn('destroy');
            rakitBuku();
            
            // Langsung lompat ke halaman paling belakang yang baru ditambahkan
            setTimeout(() => {
                $('#buku-digital').turn('page', daftarHalaman.length);
            }, 300);
        }

        // 2. FUNGSI HAPUS LEMBARAN BUKU
        function hapusLembarTerakhir() {
            if (daftarHalaman.length <= 1) {
                alert("Buku tidak bisa dikosongkan! Harus menyisakan minimal Cover Depan.");
                return;
            }

            if (confirm("Apakah Anda yakin ingin merobek/menghapus lembar halaman terakhir ini?")) {
                daftarHalaman.pop(); // Hapus halaman paling belakang
                $('#buku-digital').turn('destroy');
                rakitBuku();
            }
        }

        // Jalankan perakitan buku saat pertama kali web dibuka
        $(document).ready(function() {
            rakitBuku();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Buku Digital Multi-Media</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku */
        .book-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
        }
        
        .dropdown-select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            text-align: center;
        }

        /* Area Tampilan Konten Utama (Gambar / Media) */
        .content-area {
            width: 100%;
            height: 300px; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        video, audio {
            width: 90%;
            max-height: 90%;
        }

        /* AREA KETIK TEKS PERMANEN DI BAWAH GAMBAR */
        .text-work-space {
            padding: 15px;
            background-color: #fdfcf7;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }
        
        .book-textarea {
            width: 100%;
            height: 160px;
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            resize: none;
            font-size: 15px;
            line-height: 1.6;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #333;
            outline: none;
        }

        /* Status Rekaman */
        .record-status {
            font-weight: bold;
            color: #e74c3c;
            position: absolute;
            top: 10px;
            display: none;
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- MENU DROPDOWN UTAMA (Pusat Tombol Pengelolaan & Link WA) -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">⚙️ -- MENU KELOLA BUKU --</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru</option>
                <option value="aksi-upload-vid">📹 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekam">🎙️ Mulai / Stop Rekam Suara</option>
                <option value="aksi-reset-total">🔄 Atur Ulang & Segarkan Cover</option>
                <option value="aksi-hapus">🗑️ Hapus Lembar Ini</option>
            </select>
        </div>

        <!-- Input File Tersembunyi -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- AREA GAMBAR: DIKLIK 2X MAJU KE HALAMAN BERIKUTNYA -->
        <div class="content-area" id="book-content" ondblclick="klikDuaKaliMajuLembar()">
            <div class="record-status" id="record-indicator">🔴 Sedang Merekam...</div>
            <div id="media-placeholder" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
        </div>

        <!-- AREA KETIK TEKS: BISA LANGSUNG DIKETIK / DIEDIT KAPAN SAJA -->
        <div class="text-work-space">
            <textarea id="text-input-field" class="book-textarea" placeholder="Ketik kalimat atau isi catatan lembar buku di sini... (Otomatis Tersimpan)"></textarea>
        </div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 3</div>
    </div>

    <script>
        // Struktur data murni repositori Anda
        const susunanDefaultMurni = [
            { type: "image", src: "File/Gambar/Buku/A.png", teks: "Catatan Lembar A" }, 
            { type: "image", src: "File/Gambar/Buku/B.png", teks: "Catatan Lembar B" }, 
            { type: "image", src: "File/Gambar/Buku/C.png", teks: "Catatan Lembar C" }  
        ];

        let databaseBuku = [...susunanDefaultMurni];

        // Ambil data jika ada
        if (localStorage.getItem('bukuFix_FinalSystem')) {
            databaseBuku = JSON.parse(localStorage.getItem('bukuFix_FinalSystem'));
        }

        let indeksAktif = 0;
        let mediaRecorder;
        let audioChunks = [];
        let sedangMerekam = false;

        const elContent = document.getElementById('book-content');
        const elPlaceholder = document.getElementById('media-placeholder');
        const elMenu = document.getElementById('menu-navigasi');
        const elIndikator = document.getElementById('page-indicator');
        const elTextField = document.getElementById('text-input-field');
        const elRecordIndicator = document.getElementById('record-indicator');

        // Fungsi memuat data halaman secara aman
        function muatHalaman(indeks) {
            indeksAktif = indeks;
            const data = databaseBuku[indeksAktif];
            elPlaceholder.innerHTML = '';
            elContent.style.backgroundImage = 'none';

            if (data.type === 'image') {
                elContent.style.backgroundImage = `url('${data.src}')`;
            } else if (data.type === 'video') {
                elPlaceholder.innerHTML = `<video src="${data.src}" controls></video>`;
            } else if (data.type === 'audio') {
                elPlaceholder.innerHTML = `<audio src="${data.src}" controls></audio>`;
            }

            // Memasukkan teks agar langsung bisa diedit/diketik oleh user
            elTextField.value = data.teks || "";
            elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
            
            // Simpan perubahan ke memori
            localStorage.setItem('bukuFix_FinalSystem', JSON.stringify(databaseBuku));
        }

        // Fungsi Menyimpan otomatis isi ketikan saat user sedang mengetik teks
        elTextField.addEventListener('input', function() {
            databaseBuku[indeksAktif].teks = elTextField.value;
            localStorage.setItem('bukuFix_FinalSystem', JSON.stringify(databaseBuku));
        });

        // KLIK 2X PADA GAMBAR UNTUK MAJU KE HALAMAN BERIKUTNYA
        function klikDuaKaliMajuLembar() {
            if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO') return;

            if (indeksAktif < databaseBuku.length - 1) {
                indeksAktif++;
            } else {
                indeksAktif = 0; // Kembali ke cover depan
            }
            muatHalaman(indeksAktif);
        }

        // KONTROL PUSAT DROPDOWN
        function eksekusiPilihanMenu() {
            const nilaiPilihan = elMenu.value;

            if (nilaiPilihan === 'aksi-wa') {
                // Mengirimkan isi teks yang diketik ke saluran WA
                const teksAman = encodeURIComponent(`*Catatan Lembar ${indeksAktif + 1}:*\n${elTextField.value}`);
                window.open(`https://whatsapp.com{teksAman}`, '_blank');
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-upload-img') {
                document.getElementById('file-image').click();
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-upload-vid') {
                document.getElementById('file-video').click();
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-upload-mp3') {
                document.getElementById('file-audio').click();
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-rekam') {
                toggleRekamSuara();
                elMenu.value = 'default';
            }
            else if (nilaiPilihan === 'aksi-reset-total') {
                localStorage.removeItem('bukuFix_FinalSystem');
                databaseBuku = [...susunanDefaultMurni];
                muatHalaman(0);

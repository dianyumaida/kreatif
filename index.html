<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Digital Multi-Media Dropdown Fix</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Aplikasi */
        .book-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Area Menu Navigasi Paling Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
        }
        
        /* Dropdown Select Utama */
        .dropdown-select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            text-align: center;
        }

        /* Area Tampilan Konten Utama (Media & Gambar) */
        .content-area {
            width: 100%;
            height: 480px; 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            user-select: none; /* Cegah teks terblok saat klik 2x */
        }

        /* Elemen Video dan Audio */
        video, audio {
            width: 90%;
            max-height: 90%;
        }

        /* Kotak Editor Teks di dalam Buku */
        .editor-box {
            display: none;
            width: 100%;
            padding: 15px;
            background: #fdfcf7;
            box-sizing: border-box;
            border-top: 1px solid #ddd;
        }
        .editor-box textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 10px;
        }
        .btn-save-text {
            width: 100%;
            padding: 10px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Tampilan Status Perekaman */
        .record-status {
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
            display: none;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }

        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- MENU DROPDOWN UTAMA -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">⚙️ -- PILIH MENU KELOLA --</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp</option>
                <option value="aksi-edit">📝 Edit / Tulis Catatan Lembar Ini</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru</option>
                <option value="aksi-upload-vid">📹 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekam">🎙️ Mulai / Stop Rekam Suara</option>
                <option value="aksi-clear-mem">🔄 Reset Segarkan Gambar Cover</option>
                <option value="aksi-hapus">🗑️ Hapus Lembar Ini</option>
            </select>
        </div>

        <!-- Hidden Input File Picker -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- AREA KONTEN UTAMA: KLIK 2X (DOUBLE CLICK) UNTUK MAJU KE LEMBAR BERIKUTNYA -->
        <div class="content-area" id="book-content" ondblclick="klikDuaKaliMajuLembar()">
            <div class="record-status" id="record-indicator">🔴 Sedang Merekam...</div>
            <div id="media-placeholder" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
        </div>

        <!-- AREA EDITOR TEKS -->
        <div class="editor-box" id="editor-container">
            <textarea id="text-input-field" placeholder="Ketik kalimat isi catatan buku di sini..."></textarea>
            <button class="btn-save-text" onclick="simpanTeksCatatan()">💾 Simpan Perubahan Teks</button>
        </div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 3</div>
    </div>

    <script>
        // Jalur gambar asli milik Anda dari repositori GitHub
        const susunanDefaultMurni = [
            { type: "image", src: "File/Gambar/Buku/A.png", teks: "" }, 
            { type: "image", src: "File/Gambar/Buku/B.png", teks: "" }, 
            { type: "image", src: "File/Gambar/Buku/C.png", teks: "" }  
        ];

        let databaseBuku = [...susunanDefaultMurni];

        if (localStorage.getItem('bukuDropdownMediaDblClick')) {
            databaseBuku = JSON.parse(localStorage.getItem('bukuDropdownMediaDblClick'));
        }

        let indeksAktif = 0;
        let mediaRecorder;
        let audioChunks = [];
        let sedangMerekam = false;

        const elContent = document.getElementById('book-content');
        const elPlaceholder = document.getElementById('media-placeholder');
        const elMenu = document.getElementById('menu-navigasi');
        const elIndikator = document.getElementById('page-indicator');
        const elEditor = document.getElementById('editor-container');
        const elTextField = document.getElementById('text-input-field');
        const elRecordIndicator = document.getElementById('record-indicator');

        // Fungsi memuat konten lembar halaman secara aman
        function muatHalaman(indeks) {
            indeksAktif = indeks;
            const data = databaseBuku[indeksAktif];
            elPlaceholder.innerHTML = '';
            elContent.style.backgroundImage = 'none';
            elEditor.style.display = 'none';

            if (data.type === 'image') {
                elContent.style.backgroundImage = `url('${data.src}')`;
            } else if (data.type === 'video') {
                elPlaceholder.innerHTML = `<video src="${data.src}" controls></video>`;
            } else if (data.type === 'audio') {
                elPlaceholder.innerHTML = `<audio src="${data.src}" controls></audio>`;
            }

            elTextField.value = data.teks || "";
            elIndikator.innerHTML = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length} ${data.teks ? '<br><small style="color:#2c3e50">📄 Ada Catatan Teks</small>' : ''}`;
            
            // Hanya simpan data ringan yang bukan pautan upload blob lokal agar memori tidak penuh
            const dataBersihLokal = databaseBuku.map(item => {
                return item.src.startsWith('blob:') ? { type: "image", src: "File/Gambar/Buku/A.png", teks: item.teks } : item;
            });
            localStorage.setItem('bukuDropdownMediaDblClick', JSON.stringify(dataBersihLokal));
        }

        // FUNGSI KLIK 2X (DOUBLE CLICK): Lembar diklik 2x langsung masuk ke lembar berikutnya
        function klikDuaKaliMajuLembar() {
            // Abaikan double click jika pengguna sedang menyentuh tombol play video/audio internal
            if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO') return;

            if (indeksAktif < databaseBuku.length - 1) {
                indeksAktif++;
            } else {
                indeksAktif = 0; // Berputar kembali ke Cover Depan (A.png)
            }
            muatHalaman(indeksAktif);
        }

        // KONTROL PUSAT DROPDOWN
        function eksekusiPilihanMenu() {
            const nilaiPilihan = elMenu.value;

            if (nilaiPilihan === 'aksi-wa') {
                window.open('https://whatsapp.com', '_blank');
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-edit') {
                elEditor.style.display = 'block';
                elTextField.focus();
            } 
            else if (nilaiPilihan === 'aksi-upload-img') {
                document.getElementById('file-image').click();
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-upload-vid') {

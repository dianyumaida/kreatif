<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Digital Minimalis Dropdown</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Aplikasi */
        .book-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Area Menu Navigasi Paling Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
        }
        
        /* dropdown select utama */
        .dropdown-select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Area Gambar (Bisa Diklik Langsung untuk Balik Lembar) */
        .page-area {
            width: 100%;
            height: 480px; /* Ukuran gambar diperpanjang karena area teks hilang */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
            cursor: pointer;
            position: relative;
            transition: opacity 0.2s ease-in-out;
        }
        .page-area:active {
            opacity: 0.8;
        }

        /* Info Indikator Halaman Paling Bawah (Sesuai Panah 1) */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- MENU DROPDOWN UTAMA (Tempat seluruh tombol aksi dan navigasi berkumpul) -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <!-- Opsi menu akan diisi otomatis lewat JavaScript -->
            </select>
        </div>

        <!-- AREA GAMBAR: TEKS HILANG TOTAL & GAMBAR BISA DIKLIK LANGSUNG (Auto-Flip) -->
        <div class="page-area" id="book-image" onclick="klikGambarMajuLembar()"></div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 3</div>
    </div>

    <script>
        // Database utama file gambar Anda di dalam repositori GitHub
        let databaseBuku = [
            "File/Gambar/Buku/A.png", 
            "File/Gambar/Buku/B.png", 
            "File/Gambar/Buku/C.png"  
        ];

        // Sinkronisasi memori browser Lokal
        if (localStorage.getItem('bukuDropdownAksiData')) {
            databaseBuku = JSON.parse(localStorage.getItem('bukuDropdownAksiData'));
        }

        let indeksAktif = 0;

        const elGambar = document.getElementById('book-image');
        const elMenu = document.getElementById('menu-navigasi');
        const elIndikator = document.getElementById('page-indicator');

        // Fungsi merakit seluruh tombol aksi dan daftar halaman ke dalam satu dropdown menu
        function susunMenuDropdown() {
            elMenu.innerHTML = '';

            // 1. Kelompok Judul Utama Default
            const grupNavigasi = document.createElement('optgroup');
            grupNavigasi.label = "📁 -- BUKA LEMBAR HALAMAN --";

            databaseBuku.forEach((path, indeks) => {
                // Ambil karakter nama file (A, B, C, dst) sebagai identitas menu
                let namaFile = path.split('/').pop().split('.')[0].toUpperCase();
                const opsi = document.createElement('option');
                opsi.value = `buka-${indeks}`;
                opsi.text = `📄 Buka Lembar ${namaFile} ${indeks === indeksAktif ? '◀' : ''}`;
                grupNavigasi.appendChild(opsi);
            });
            elMenu.appendChild(grupNavigasi);

            // 2. Kelompok Tombol Aksi / Fitur Pengelolaan
            const grupAksi = document.createElement('optgroup');
            grupAksi.label = "⚙️ -- ACTION / TOMBOL EDIT --";

            // Tombol Kirim Ke WhatsApp
            const opsiWa = document.createElement('option');
            opsiWa.value = "aksi-wa";
            opsiWa.text = "📲 Kirim ke Saluran WhatsApp";
            grupAksi.appendChild(opsiWa);

            // Tombol Auto-Increment Lembar Baru
            const opsiTambah = document.createElement('option');
            opsiTambah.value = "aksi-tambah";
            opsiTambah.text = "➕ Tambah Lembar Baru (Auto)";
            grupAksi.appendChild(opsiTambah);

            // Tombol Hapus Lembar Aktif
            const opsiHapus = document.createElement('option');
            opsiHapus.value = "aksi-hapus";
            opsiHapus.text = "🗑️ Hapus Lembar yang Dibuka";
            grupAksi.appendChild(opsiHapus);

            elMenu.appendChild(grupAksi);
            
            // Set agar dropdown menampilkan posisi lembar aktif saat ini
            elMenu.value = `buka-${indeksAktif}`;
        }

        // Fungsi memuat tampilan gambar lembar buku ke layar
        function muatHalaman(indeks) {
            indeksAktif = indeks;
            elGambar.style.backgroundImage = `url('${databaseBuku[indeksAktif]}')`;
            elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
            
            localStorage.setItem('bukuDropdownAksiData', JSON.stringify(databaseBuku));
            susunMenuDropdown();
        }

        // FUNGSI KLIK GAMBAR: Gambar bisa diklik langsung untuk maju ke halaman berikutnya
        function klikGambarMajuLembar() {
            if (indeksAktif < databaseBuku.length - 1) {
                indeksAktif++;
                muatHalaman(indeksAktif);
            } else {
                // Jika sudah lembar terakhir, klik gambar akan memutar kembali ke cover depan
                indeksAktif = 0;
                muatHalaman(indeksAktif);
            }
        }

        // Fungsi kontrol pusat untuk mengeksekusi pilihan di dalam menu dropdown
        function eksekusiPilihanMenu() {
            const nilaiPilihan = elMenu.value;

            if (nilaiPilihan.startsWith('buka-')) {
                // Jika memilih baris buka halaman
                const targetIndeks = parseInt(nilaiPilihan.split('-')[1]);
                muatHalaman(targetIndeks);
            } 
            else if (nilaiPilihan === 'aksi-wa') {
                // Jika memilih tombol WhatsApp, langsung buka tab link baru
                window.open('https://whatsapp.com', '_blank');
                elMenu.value = `buka-${indeksAktif}`; // Kembalikan teks menu ke lembar aktif
            } 
            else if (nilaiPilihan === 'aksi-tambah') {
                // Jika memilih tombol Auto-Increment Tambah Lembar Baru
                const inputNama = prompt("Masukkan nama file gambar baru yang sudah diupload ke GitHub:\n(Contoh: D.png atau E.png)");
                
                if (inputNama && inputNama.trim() !== '') {
                    const fileMurni = inputNama.trim();
                    const pathLengkap = `File/Gambar/Buku/${fileMurni.includes('.') ? fileMurni : fileMurni + '.png'}`;
                    
                    databaseBuku.push(pathLengkap);
                    localStorage.setItem('bukuDropdownAksiData', JSON.stringify(databaseBuku));
                    
                    // Lompat langsung membuka halaman baru yang dibuat di paling belakang
                    muatHalaman(databaseBuku.length - 1);
                    alert("🎉 Sukses membuat opsi halaman baru di dalam dropdown!");
                } else {
                    elMenu.value = `buka-${indeksAktif}`;
                }
            } 
            else if (nilaiPilihan === 'aksi-hapus') {
                // Jika memilih tombol Hapus Lembar
                if (databaseBuku.length <= 1) {
                    alert("Gagal menghapus! Minimal harus menyisakan 1 lembar cover depan.");
                    elMenu.value = `buka-${indeksAktif}`;
                    return;
                }

                if (confirm(`Apakah Anda yakin ingin menghapus Lembar ke-${indeksAktif + 1} ini dari daftar?`)) {
                    databaseBuku.splice(indeksAktif, 1);
                    
                    if (indeksAktif >= databaseBuku.length) {
                        indeksAktif = databaseBuku.length - 1;
                    }
                    muatHalaman(indeksAktif);
                } else {
                    elMenu.value = `buka-${indeksAktif}`;
                }
            }
        }

        // Eksekusi muat sistem pertama kali web dibuka
        window.onload = function() {
            muatHalaman(0); // Tampilkan gambar cover A pertama kali
        };
    </script>
</body>
</html>

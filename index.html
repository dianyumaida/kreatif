<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Buku Digital</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku */
        .book-container {
            width: 100%;
            max-width: 440px;
            height: 680px; 
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dropdown-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Kotak Pencarian Baru */
        .search-box {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #ffffff;
            color: #333;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        /* Komponen Sistem Penanda & Anak Penanda Radio */
        .bookmark-panel {
            background-color: #f8f9fa;
            padding: 10px 15px;
            border-bottom: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .bookmark-title {
            font-size: 13px;
            font-weight: bold;
            color: #2c3e50;
        }

        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: #555;
            cursor: pointer;
        }

        /* Status Rekaman */
        .record-status {
            font-weight: bold;
            color: #e74c3c;
            position: absolute;
            top: 10px;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 10;
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Area Gambar Utama */
        .content-area {
            width: 100%;
            height: 280px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #ecf0f1; 
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        video, audio {
            width: 90%;
            max-height: 90%;
            z-index: 5;
        }

        /* Area Tempat Mengetik Catatan Full Lembar */
        .text-work-space {
            padding: 0;
            background-color: #fdfcf7;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            width: 100%;
            flex-grow: 1; 
        }

        .book-textarea {
            width: 100%;
            height: 100%; 
            padding: 15px;
            border: none;
            margin: 0;
            resize: none;
            font-size: 15px;
            line-height: 1.6;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #333;
            outline: none;
            flex-grow: 1;
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- MENU DROPDOWN KELOLA UTAMA & INPUT PENCARIAN -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">-- MENU KELOLA BUKU --</option>
                <option value="aksi-tambah">➕ Tambah Halaman Baru</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru</option>
                <option value="aksi-upload-vid">🎥 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekan">🎙️ Mulai / Stop Rekam Suara</option>
                <option value="aksi-hapus">❌ Hapus Lembar Ini</option>
            </select>
            <!-- Kolom Input Pencarian Baru -->
            <input type="text" id="search-input" class="search-box" placeholder="🔍 Cari teks catatan di buku ini..." oninput="cariTeksBuku()">
        </div>

        <!-- PANEL PENANDA UTAMA DAN ANAK PENANDA (RADIO BUTTON) -->
        <div class="bookmark-panel">
            <div class="bookmark-title">📌 Penanda Sub-Bab Halaman Konten:</div>
            <div class="radio-group" id="penanda-radio-container">
                <!-- Struktur Anak Penanda Radio Diisi Otomatis Oleh Javascript -->
            </div>
        </div>

        <!-- Input File Picker Perangkat -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- AREA GAMBAR (Mendukung Double-Click) -->
        <div class="content-area" id="book-content" ondblclick="klikDuaKaliMajuLembar(event)">
            <div class="record-status" id="record-indicator">🔴 Sedang Merekam...</div>
            <div id="media-placeholder" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none;"></div>
        </div>

        <!-- AREA KETIK TEKS (Mendukung Double-Click) -->
        <div class="text-work-space" ondblclick="klikDuaKaliMajuLembar(event)">
            <textarea id="text-input-field" class="book-textarea" placeholder="Ketik kalimat atau isi catatan lembar baru di sini..."></textarea>
        </div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 1</div>
    </div>

<script>
    localStorage.clear();

    // INISIALISASI AWAL: Hanya memuat B.png sebagai satu-satunya halaman utama pertama Anda
    let databaseBuku = [
        { type: "image", src: "./File/Gambar/Buku/B.png", teks: "Ini catatan awal pada lembar B.png sebagai lembar utama pertama buku digital." }
    ];

    let indeksAktif = 0;
    let mediaRecorder;
    let audioChunks = [];
    let sedangMerekam = false;

    const elContent = document.getElementById('book-content');
    const elPlaceholder = document.getElementById('media-placeholder');
    const elMenu = document.getElementById('menu-navigasi');
    const elIndikator = document.getElementById('page-indicator');
    const elTextField = document.getElementById('text-input-field');
    const elRecordIndicator = document.getElementById('record-indicator');
    const elRadioContainer = document.getElementById('penanda-radio-container');
    const elSearchInput = document.getElementById('search-input');

    // FUNGSI MUAT HALAMAN DENGAN UPDATE ANAK PENANDA RADIO
    function muatHalaman(indeks) {
        indeksAktif = indeks;
        const data = databaseBuku[indeksAktif];
        elPlaceholder.innerHTML = '';
        elContent.style.backgroundImage = 'none';

        if (data.type === 'text-only') {
            elContent.style.display = 'none'; 
        } else {
            elContent.style.display = 'flex'; 
            if (data.type === 'image' && data.src) {
                elContent.style.backgroundImage = `url('${data.src}')`;
            } else if (data.type === 'video') {
                elPlaceholder.innerHTML = `<video src="${data.src}" controls></video>`;
            } else if (data.type === 'audio') {
                elPlaceholder.innerHTML = `<audio src="${data.src}" controls></audio>`;
            }
        }

        elTextField.value = data.teks || "";
        elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
        
        // Perbarui susunan anak penanda radio button secara dinamis sesuai total halaman saat ini
        renderAnakPenandaRadio();
    }
    // FUNGSI RENDER ANAK PENANDA (RADIO BUTTON)
    function renderAnakPenandaRadio() {
        elRadioContainer.innerHTML = '';
        databaseBuku.forEach((item, index) => {
            const labelRadio = document.createElement('label');
            labelRadio.className = 'radio-item';
            
            // Membuat radio button input
            const inputRadio = document.createElement('input');
            inputRadio.type = 'radio';
            inputRadio.name = 'penandaHalaman Buku';
            inputRadio.value = index;
            inputRadio.checked = (index === indeksAktif);
            
            // Klik anak penanda radio untuk langsung lompat ke halaman tersebut
            inputRadio.onchange = function() {
                muatHalaman(parseInt(this.value));
            };

            labelRadio.appendChild(inputRadio);
            labelRadio.appendChild(document.createTextNode(`Sub-${index + 1}`));
            elRadioContainer.appendChild(labelRadio);
        });
    }

    // FUNGSI PENCARIAN TEKS PADA CATATAN BUKU
    function cariTeksBuku() {
        const kataKunci = elSearchInput.value.toLowerCase().trim();
        if (!kataKunci) return;

        // Mencari halaman yang mengandung kata kunci teks catatan tersebut
        const indeksDitemukan = databaseBuku.findIndex(item => item.teks.toLowerCase().includes(kataKunci));
        
        if (indeksDitemukan !== -1) {
            muatHalaman(indeksDitemukan); // Lompat otomatis ke halaman yang cocok
        }
    }

    elTextField.addEventListener('input', function() {
        databaseBuku[indeksAktif].teks = elTextField.value;
    });

    // FITUR NAVIGASI UTAMA: KLIK 2X UNTUK MEMBUKA HALAMAN SELANJUTNYA
    function klikDuaKaliMajuLembar(event) {
        if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO') return;

        if (indeksAktif < databaseBuku.length - 1) {
            indeksAktif++;
        } else {
            indeksAktif = 0; // Berputar kembali ke lembar pertama (B.png)
        }
        muatHalaman(indeksAktif);
    }

    function eksekusiPilihanMenu() {
        const nilaiPilihan = elMenu.value;
        if (nilaiPilihan === 'default') return;

        // FITUR BARU: MENU TAMBAH HALAMAN BARU
        if (nilaiPilihan === 'aksi-tambah') {
            databaseBuku.push({
                type: "text-only",
                src: "",
                teks: `Ini adalah lembar halaman baru ke-${databaseBuku.length + 1} yang berhasil Anda tambahkan.`
            });
            muatHalaman(databaseBuku.length - 1); // Langsung arahkan ke halaman baru yang dibuat
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-wa') {
            const teksKirim = encodeURIComponent(`Catatan Lembar ${indeksAktif + 1}:\n${elTextField.value}`);
            window.open('https://whatsapp.com' + teksKirim, '_blank');
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-img') {
            document.getElementById('file-image').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-vid') {
            document.getElementById('file-video').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-mp3') {
            document.getElementById('file-audio').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-rekan') {
            toggleRekamSuara();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-hapus') {
            if (databaseBuku.length <= 1) {
                alert("Gagal! Minimal harus menyisakan 1 halaman.");
                elMenu.value = 'default';
                return;
            }
            if (confirm("Hapus lembar halaman ini?")) {
                databaseBuku.splice(indeksAktif, 1);
                if (indeksAktif >= databaseBuku.length) {
                    indeksAktif = databaseBuku.length - 1;
                }
                muatHalaman(indeksAktif);
            }
            elMenu.value = 'default';
        }
    }

    function handleFileSelected(input, type) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const fileURL = URL.createObjectURL(file);
            
            databaseBuku[indeksAktif] = {
                type: type,
                src: fileURL,
                teks: elTextField.value
            };
            muatHalaman(indeksAktif);
        }
    }

    function toggleRekamSuara() {
        sedangMerekam = !sedangMerekam;
        if (sedangMerekam) {
            elRecordIndicator.style.display = 'block';
        } else {
            elRecordIndicator.style.display = 'none';
        }
    }

    // MEMUAT HALAMAN UTAMA B.png SAAT WEB PERTAMA KALI DIBUKA
    muatHalaman(0);
</script>
</body>
</html>

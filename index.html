<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Buku Digital</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku - SATU PAGE PENUH TRANSPARAN LAYER */
        .book-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
        }

        .dropdown-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Panel Kontrol Posisi dan Ukuran Gambar Terpilih */
        .image-tools-panel {
            background-color: #34495e;
            padding: 8px;
            display: none; 
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            border-bottom: 1px solid #2c3e50;
            z-index: 200;
            flex-wrap: wrap;
        }

        .tool-btn {
            background-color: #1a252f;
            color: white;
            border: 1px solid #7f8c8d;
            padding: 6px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            flex-grow: 1;
            text-align: center;
        }

        .tool-btn:hover { background-color: #2ecc71; }
        /* Tombol Stop Rekam Merah Interaktif */
        .record-status {
            font-weight: bold;
            color: white;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: #e74c3c;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 250;
            cursor: pointer;
            border: 2px solid white;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { from { transform: scale(1) translateX(-50%); } to { transform: scale(1.05) translateX(-50%); } }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
            z-index: 190;
        }

        /* KANVAS KHUSUS TEMPAT MENYUSUN MULTI-MEDIA SECARA BEBAS */
        .media-canvas-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: auto; 
            z-index: 5;
            overflow: hidden;
        }

        /* STRUKTUR BINGKAI GAMBAR KANVAS BEBAS */
        .img-wrapper {
            position: absolute; 
            border: 2px dashed transparent;
            box-sizing: border-box;
            cursor: move;
            display: inline-block;
        }

        /* Penanda Visual Gambar Aktif Saat Diklik */
        .img-wrapper.active-target {
            border-color: #2ecc71;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.7);
            z-index: 90 !important;
        }

        .img-wrapper img, .img-wrapper video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }

        /* Penampung Pemutar Audio Rekaman */
        .audio-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            display: flex;
            justify-content: center;
            z-index: 150;
        }

        audio {
            width: 100%;
        }
        /* AREA TEKS CATATAN - DIKUNCI LAPISANNYA AGAR PENANDA BEBAS EROR */
        .text-work-space {
            padding: 20px;
            background-color: transparent; 
            margin: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
            outline: none;
            flex-grow: 1;
            position: relative;
            z-index: 10; 
        }

        /* GAYA HYPERLINK PENANDA CATATAN */
        .hyperlink-bookmark {
            color: #0066cc;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
            background-color: rgba(0, 102, 204, 0.1);
            padding: 0 2px;
            border-radius: 3px;
        }

        .radio-dropdown-panel {
            padding: 8px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            align-items: center;
            z-index: 190;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            cursor: pointer;
        }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">-- MENU UTAMA KELOLA BUKU --</option>
                <option value="aksi-tambah">➕ Tambah Halaman Baru</option>
                <option value="aksi-bookmark">📌 Jadikan Teks Diblok Sebagai Penanda</option>
                <option value="aksi-cari">🔍 Jalankan Pencarian Kata Kunci Catatan</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp KASY</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru</option>
                <option value="aksi-upload-vid">🎥 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekan">🎙️ Mulai Perekaman Suara</option>
                <option value="aksi-mode-media">🔄 Aktifkan/Matikan Mode Atur Gambar</option>
                <option value="aksi-hapus">❌ Hapus Lembar Ini</option>
                <optgroup label="📂 DAFTAR RIWAYAT PENANDA TEKS" id="grup-riwayat-penanda">
                    <!-- Diisi otomatis -->
                </optgroup>
            </select>
        </div>

        <div class="image-tools-panel" id="image-tools">
            <button class="tool-btn" onclick="ubahSkalaAktif(25, 25)">➕ Besar</button>
            <button class="tool-btn" onclick="ubahSkalaAktif(-25, -25)">➖ Kecil</button>
            <button class="tool-btn" onclick="geserPosisiAktif('kiri')">⬅️ Kiri</button>
            <button class="tool-btn" onclick="geserPosisiAktif('kanan')">➡️ Kanan</button>
            <button class="tool-btn" onclick="geserPosisiAktif('atas')">⬆️ Atas</button>
            <button class="tool-btn" onclick="geserPosisiAktif('bawah')">⬇️ Bawah</button>
            <button class="tool-btn" onclick="tarikPenuhAktif()">📺 Tarik Penuh</button>
            <button class="tool-btn" onclick="hapusGambarAktif()" style="background:#e74c3c;">❌ Hapus</button>
        </div>

        <div class="radio-dropdown-panel" id="radio-container">
            <!-- Diisi otomatis -->
        </div>

        <input type="file" id="file-image" accept="image/*" multiple onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <div style="position: relative; flex-grow: 1; width: 100%; display: flex; flex-direction: column;">
            <div class="media-canvas-layer" id="media-canvas"></div>
            <div id="text-input-field" class="text-work-space" contenteditable="true" placeholder="Silakan ketik catatan lembar baru Anda di sini..." onmouseup="periksaSeleksiTeks()" onkeyup="periksaSeleksiTeks()" ondblclick="klikDuaKaliMajuLembar(event)"></div>
            <button class="record-status" id="record-indicator" onclick="toggleRekamSuara()">🔴 ⏹️ Klik di Sini untuk Stop Rekam</button>
            <div id="audio-placement" class="audio-container"></div>
        </div>

        <div class="page-footer" id="page-indicator">Lembar 1 dari 1</div>
    </div>
<script>
    let databaseBuku = [
        { mediaList: [], teks: "", audioBase64: "" }
    ];

    let riwayatPenanda = [];
    let indeksAktif = 0;
    let indeksGambarDipilih = null; 
    let mediaRecorder;
    let audioChunks = [];
    let sedangMerekam = false;
    let modeAturGambarActive = false; 

    const elMenu = document.getElementById('menu-navigasi');
    const elGrupRiwayat = document.getElementById('grup-riwayat-penanda');
    const elIndikator = document.getElementById('page-indicator');
    const elTextField = document.getElementById('text-input-field');
    const elRecordIndicator = document.getElementById('record-indicator');
    const elRadioContainer = document.getElementById('radio-container');
    const elImageTools = document.getElementById('image-tools');
    const elMediaCanvas = document.getElementById('media-canvas');
    const elAudioPlacement = document.getElementById('audio-placement');

    function muatHalaman(indeks) {
        indeksAktif = indeks;
        const data = databaseBuku[indeksAktif];
        elImageTools.style.display = 'none';
        indeksGambarDipilih = null;
        elAudioPlacement.innerHTML = '';
        elMediaCanvas.innerHTML = '';

        elTextField.innerHTML = data.teks || "";

        if (data.mediaList && data.mediaList.length > 0) {
            data.mediaList.forEach((mediaItem, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'img-wrapper';
                
                wrapper.style.left = (mediaItem.x || 15) + 'px';
                wrapper.style.top = (mediaItem.y || 40) + 'px';
                wrapper.style.width = (mediaItem.w || 140) + 'px';
                wrapper.style.height = (mediaItem.h || 140) + 'px';
                wrapper.style.zIndex = mediaItem.z || 15;
                
                if (mediaItem.type === 'video') {
                    const video = document.createElement('video');
                    video.src = mediaItem.src;
                    video.controls = true;
                    video.playsInline = true;
                    wrapper.appendChild(video);
                } else {
                    const img = document.createElement('img');
                    img.src = mediaItem.src;
                    wrapper.appendChild(img);
                }
                
                wrapper.onclick = function(e) {
                    if (!modeAturGambarActive) return;
                    e.stopPropagation(); 
                    pilihGambarTarget(idx, wrapper);
                };

                elMediaCanvas.appendChild(wrapper);
            });
        }

        if (data.audioBase64) {
            fetch(data.audioBase64)
            .then(res => res.blob())
            .then(blob => {
                const blobURL = URL.createObjectURL(blob);
                elAudioPlacement.innerHTML = `<audio src="${blobURL}" controls></audio>`;
            });
        }

        elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
        renderRadioHalaman();
    }

    function toggleModeAturGambar() {
        modeAturGambarActive = !modeAturGambarActive;
        if (modeAturGambarActive) {
            elTextField.style.pointerEvents = 'none'; 
            alert("Mode Atur Gambar AKTIF! Silakan klik media gambar/video di layar untuk memperbesar/menggeser.");
        } else {
            elTextField.style.pointerEvents = 'auto'; 
            elImageTools.style.display = 'none';
            indeksGambarDipilih = null;
            const semuaWrapper = elMediaCanvas.querySelectorAll('.img-wrapper');
            semuaWrapper.forEach(w => w.classList.remove('active-target'));
            alert("Mode Ketik Teks AKTIF! Anda bisa mengetik catatan dan memblok kalimat dengan normal kembali.");
        }
    }
    function pilihGambarTarget(idx, elemenWrapper) {
        indeksGambarDipilih = idx;
        const semuaWrapper = elMediaCanvas.querySelectorAll('.img-wrapper');
        semuaWrapper.forEach(w => w.classList.remove('active-target'));
        elemenWrapper.classList.add('active-target');
        elImageTools.style.display = 'flex'; 
    }

    function ubahSkalaAktif(lebarTambah, tinggiTambah) {
        if (indeksGambarDipilih === null) return;
        let mediaItem = databaseBuku[indeksAktif].mediaList[indeksGambarDipilih];
        mediaItem.w = (mediaItem.w || 140) + lebarTambah;
        mediaItem.h = (mediaItem.h || 140) + tinggiTambah;
        
        if (mediaItem.w < 35) mediaItem.w = 35;
        if (mediaItem.h < 35) mediaItem.h = 35;

        muatHalaman(indeksAktif);
        reFokusGambar();
    }

    function geserPosisiAktif(arah) {
        if (indeksGambarDipilih === null) return;
        let mediaItem = databaseBuku[indeksAktif].mediaList[indeksGambarDipilih];
        const jarakGeser = 25; 

        if (arah === 'kiri') mediaItem.x = (mediaItem.x || 0) - jarakGeser;
        if (arah === 'kanan') mediaItem.x = (mediaItem.x || 0) + jarakGeser;
        if (arah === 'atas') mediaItem.y = (mediaItem.y || 0) - jarakGeser;
        if (arah === 'bawah') mediaItem.y = (mediaItem.y || 0) + jarakGeser;

        muatHalaman(indeksAktif);
        reFokusGambar();
    }

    function tarikPenuhAktif() {
        if (indeksGambarDipilih === null) return;
        let mediaItem = databaseBuku[indeksAktif].mediaList[indeksGambarDipilih];
        mediaItem.x = 0;
        mediaItem.y = 0;
        mediaItem.w = elMediaCanvas.clientWidth;
        mediaItem.h = elMediaCanvas.clientHeight;
        
        muatHalaman(indeksAktif);
        reFokusGambar();
    }

    function reFokusGambar() {
        const semuaW = elMediaCanvas.querySelectorAll('.img-wrapper');
        if(semuaW[indeksGambarDipilih]) pilihGambarTarget(indeksGambarDipilih, semuaW[indeksGambarDipilih]);
    }

    function hapusGambarAktif() {
        if (indeksGambarDipilih === null) return;
        databaseBuku[indeksAktif].mediaList.splice(indeksGambarDipilih, 1);
        muatHalaman(indeksAktif);
    }

    let kataKunciSeleksi = "";
    function periksaSeleksiTeks() {
        kataKunciSeleksi = window.getSelection().toString().trim();
    }

    function buatPenandaDariBlokTeks() {
        if (!kataKunciSeleksi) {
            alert("Gagal! Silakan sorot/blok kalimat teks di dalam catatan terlebih dahulu sebelum memilih menu ini.");
            return;
        }

        const seleksi = window.getSelection();
        if (seleksi.rangeCount > 0) {
            const range = seleksi.getRangeAt(0);
            const aLink = document.createElement('span');
            aLink.className = 'hyperlink-bookmark';
            aLink.textContent = kataKunciSeleksi;
            
            const penandaId = "link-" + Date.now();
            aLink.setAttribute('data-link-id', penandaId);

            range.deleteContents();
            range.insertNode(aLink);

            databaseBuku[indeksAktif].teks = elTextField.innerHTML;

            const dataRiwayat = { idHalaman: indeksAktif, linkId: penandaId, isiTeks: kataKunciSeleksi };
            riwayatPenanda.push(dataRiwayat);

            const opsiBaru = document.createElement('option');
            opsiBaru.value = "riwayat-" + (riwayatPenanda.length - 1);
            opsiBaru.text = `🔗 [Hlm ${indeksAktif + 1}] "${kataKunciSeleksi.substring(0, 18)}..."`;
            elGrupRiwayat.appendChild(opsiBaru);

            seleksi.removeAllRanges();
            kataKunciSeleksi = "";
            alert("Sukses! Kalimat dijadikan hyperlink penanda dan bersatu ke dropdown riwayat atas.");
        }
    }
    function lompatKeRiwayatPenanda() {
        const nilaiPilihan = elMenu.value;
        if (!nilaiPilihan.startsWith("riwayat-")) return;
        
        const indeksRiwayat = parseInt(nilaiPilihan.replace("riwayat-", ""));
        const target = riwayatPenanda[indeksRiwayat];
        muatHalaman(target.idHalaman);
        
        setTimeout(() => {
            const elemenLink = elTextField.querySelector(`[data-link-id="${target.linkId}"]`);
            if (elemenLink) {
                elemenLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
                elemenLink.style.backgroundColor = "#ffcc00";
                setTimeout(() => elemenLink.style.backgroundColor = "rgba(0, 102, 204, 0.1)", 1500);
            }
        }, 300);
        elMenu.value = 'default';
    }

    function renderRadioHalaman() {
        elRadioContainer.innerHTML = '';
        databaseBuku.forEach((item, index) => {
            const label = document.createElement('label');
            label.className = 'radio-item';
            const radio = document.createElement('input');
            radio.type = 'radio'; radio.name = 'anak-penanda'; radio.value = index;
            radio.checked = (index === indeksAktif);
            radio.onchange = function() { databaseBuku[indeksAktif].teks = elTextField.innerHTML; muatHalaman(parseInt(this.value)); };
            label.appendChild(radio);
            label.appendChild(document.createTextNode(`Halaman ${index + 1}`));
            elRadioContainer.appendChild(label);
        });
    }

    elTextField.addEventListener('input', function() {
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
    });

    function klikDuaKaliMajuLembar(event) {
        if (modeAturGambarActive) return;
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
        if (indeksAktif < databaseBuku.length - 1) { indeksAktif++; } else { indeksAktif = 0; }
        muatHalaman(indeksAktif);
    }

    function cariTeksBuku() {
        const kataKunci = prompt("Masukkan kata kunci catatan yang ingin dicari:");
        if (!kataKunci || !kataKunci.trim()) return;
        const indeksDitemukan = databaseBuku.findIndex(item => item.teks.toLowerCase().includes(kataKunci.toLowerCase().trim()));
        if (indeksDitemukan !== -1) { muatHalaman(indeksDitemukan); } else { alert("Kata kunci tidak ditemukan."); }
    }

    function eksekusiPilihanMenu() {
        const nilaiPilihan = elMenu.value;
        if (nilaiPilihan === 'default') return;
        if (nilaiPilihan.startsWith("riwayat-")) { lompatKeRiwayatPenanda(); return; }

        if (nilaiPilihan === 'aksi-tambah') {
            databaseBuku[indeksAktif].teks = elTextField.innerHTML;
            databaseBuku.push({ mediaList: [], teks: "", audioBase64: "" });
            muatHalaman(databaseBuku.length - 1);
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-bookmark') {
            buatPenandaDariBlokTeks();
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-cari') {
            cariTeksBuku(); elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-mode-media') {
            toggleModeAturGambar();
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-wa') {
            const clone = elTextField.cloneNode(true);
            const extra = clone.querySelectorAll('.img-wrapper, .record-status, .audio-container');
            extra.forEach(x => x.remove());
            const teksMurni = clone.innerText || clone.textContent;
            
            const teksKirim = encodeURIComponent(`Berikut update Catatan Buku Digital Lembar ${indeksAktif + 1}:\n\n"${teksMurni.trim()}"\n\nIkuti saluran KASY di WhatsApp: https://whatsapp.com`);
            const linkWA = document.createElement('a'); linkWA.href = `https://wa.me{teksKirim}`; linkWA.target = '_blank';
            document.body.appendChild(linkWA); linkWA.click(); document.body.removeChild(linkWA);
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-img') {
            document.getElementById('file-image').click(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-vid') {
            document.getElementById('file-video').click(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-mp3') {
            document.getElementById('file-audio').click(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-rekan') {
            toggleRekamSuara(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-hapus') {
            if (databaseBuku.length <= 1) { alert("Gagal!"); elMenu.value = 'default'; return; }
            if (confirm("Hapus lembar halaman ini?")) {
                databaseBuku.splice(indeksAktif, 1);
                if (indeksAktif >= databaseBuku.length) { indeksAktif = databaseBuku.length - 1; }
                muatHalaman(indeksAktif);
            }
            elMenu.value = 'default';
        }
    }

    function handleFileSelected(input, type) {
        if (input.files && input.files.length > 0) {
            let filesArray = Array.from(input.files);
            let counter = 0;

            if (!databaseBuku[indeksAktif].mediaList) {
                databaseBuku[indeksAktif].mediaList = [];
            }

            filesArray.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const hitung = databaseBuku[indeksAktif].mediaList.length;
                    databaseBuku[indeksAktif].mediaList.push({
                        type: type,
                        src: e.target.result, 
                        x: 20 + (hitung * 25), 
                        y: 50 + (hitung * 25), 
                        w: 150,
                        h: 150,
                        z: 10 + hitung
                    });
                    counter++;
                    if (counter === filesArray.length) {
                        muatHalaman(indeksAktif);
                    }
                };
                reader.readAsDataURL(file);
            });
        }
    }

    function toggleRekamSuara() {
        if (!sedangMerekam) {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream); audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            databaseBuku[indeksAktif].audioBase64 = e.target.result; 
                            muatHalaman(indeksAktif);
                        };
                        reader.readAsDataURL(audioBlob);
                    };
                    mediaRecorder.start(); sedangMerekam = true; elRecordIndicator.style.display = 'block';
                }).catch(err => alert("Gagal merekam! Buka tautan HTTPS Pages resmi Anda."));
            }
        } else {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            sedangMerekam = false; elRecordIndicator.style.display = 'none';
        }
    }

    muatHalaman(0);
</script>
</body>
</html>

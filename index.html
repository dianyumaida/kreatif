<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Book & Mushaf Digital 3D</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            justify-content: center;
        }
        h1 { margin-bottom: 5px; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
        p { margin-top: 0; color: #95a5a6; font-size: 14px; margin-bottom: 30px; }

        /* Area Meja/Panggung Buku (3D Render Area) */
        .book-stage {
            width: 450px; /* Ukuran satu halaman */
            height: 550px;
            perspective: 2000px;
            position: relative;
            transition: transform 0.6s ease;
        }

        /* Geser panggung ke kanan saat buku terbuka agar posisi tepat di tengah layar */
        .book-stage.opened {
            transform: translateX(225px);
        }

        /* Kontainer Buku Utama */
        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }

        /* Komponen Lembaran Kertas Buku */
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
        }

        /* Pengaturan urutan tumpukan kertas (Layering) */
        #page1 { z-index: 5; }
        #page2 { z-index: 4; }
        #page3 { z-index: 3; }

        /* Sisi Depan dan Sisi Belakang Lembaran Kertas */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
        }

        /* Potongan sudut kertas melengkung (Efek Buku Premium) */
        .front {
            border-radius: 0 8px 8px 0;
        }

        /* Sisi belakang lembar dibalik 180 derajat agar tampil normal saat dibuka ke kiri */
        .back {
            transform: rotateY(180deg);
            border-radius: 8px 0 0 8px;
        }

        /* Efek Bayangan Lipatan Buku di Tengah (Sisi Kiri & Kanan) */
        .front::after {
            content: ''; position: absolute; left: 0; top: 0; width: 25px; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
        }
        .back::after {
            content: ''; position: absolute; right: 0; top: 0; width: 25px; height: 100%;
            background: linear-gradient(-90deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
        }

        /* Trigger Kelas CSS Saat Lembaran Dibuka Berputar ke Kiri */
        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Setelah lembar terbuka, turunkan z-indexnya agar lembar di bawahnya bisa diklik */
        .page.flipped {
            z-index: 2 !important;
        }
        #page1.flipped { z-index: 10 !important; }
        #page2.flipped { z-index: 11 !important; }

        /* Panel Navigasi Tombol */
        .controls-container {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        button, input {
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            font-size: 14px;
            font-weight: bold;
        }
        input {
            background-color: #ffffff;
            color: #2c3e50;
            width: 180px;
        }
        button {
            background-color: #2980b9;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #3498db; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h1>📖 Aplikasi Mushaf & Buku Digital 3D</h1>
    <p>Sentuh atau klik langsung pada lembar kertas untuk membalik halaman</p>

    <!-- Panggung Buku -->
    <div class="book-stage" id="stage">
        <div class="book">
            
            <!-- LEMBAR 1: COVER DEPAN (Gambar A) -> Dibalik Menampilkan (Gambar B) -->
            <div class="page" id="page1" onclick="bukaLembar(1)">
                <div class="front" style="background-image: url('File/Gambar/Buku/A.png');"></div>
                <div class="back" style="background-image: url('File/Gambar/Buku/B.png');"></div>
            </div>

            <!-- LEMBAR 2: HALAMAN TENGAH (Gambar C) -> Dibalik Menampilkan Slot Kosong -->
            <div class="page" id="page2" onclick="bukaLembar(2)">
                <div class="front" style="background-image: url('File/Gambar/Buku/C.png');"></div>
                <div class="back" id="slot-auto-back" style="background-image: url('https://placehold.co');"></div>
            </div>

            <!-- LEMBAR 3: COVER BELAKANG BUKU -->
            <div class="page" id="page3">
                <div class="front" style="background-color: #34495e; border-radius: 0 8px 8px 0;"></div>
                <div class="back" style="background-color: #2c3e50;"></div>
            </div>

        </div>
    </div>

    <!-- Fitur Unggah Manajemen Lembar Baru -->
    <div class="controls-container">
        <input type="text" id="nama-file-baru" placeholder="Ketik nama file (Contoh: D.png)">
        <button onclick="prosesAutoIncrement()">➕ Tambah Lembar Baru</button>
        <button class="btn-danger" onclick="tutupSemuaHalaman()">🔄 Tutup Buku</button>
    </div>

    <script>
        // Fungsi Logika Membuka Kertas Buku
        function bukaLembar(nomorHalaman) {
            const lembar = document.getElementById(`page${nomorHalaman}`);
            const panggung = document.getElementById('stage');

            if (!lembar.classList.contains('flipped')) {
                // Jalankan animasi membalik lembaran ke kiri
                lembar.classList.add('flipped');
                
                // Jika lembar pertama (cover) dibuka, geser posisi buku agar simetris tengah
                if (nomorHalaman === 1) {
                    panggung.classList.add('opened');
                }
            } else {
                // Jalankan animasi menutup lembaran kembali ke kanan
                lembar.classList.remove('flipped');
                
                if (nomorHalaman === 1) {
                    panggung.classList.remove('opened');
                }
            }
        }

        // FUNGSI AUTO-INCREMENT: Memasukkan data file baru (Misal D.png) ke lembar selanjutnya
        function prosesAutoIncrement() {
            const input = document.getElementById('nama-file-baru');
            const fileNama = input.value.trim();

            if (!fileNama) {
                alert("Silahkan ketik nama file gambarnya terlebih dahulu!");
                return;
            }

            // Hubungkan otomatis ke folder target Anda di GitHub
            const pathGambarBaru = `File/Gambar/Buku/${fileNama.includes('.') ? fileNama : fileNama + '.png'}`;
            
            // Masukkan gambar baru tersebut ke sisi balik Lembar ke-2 (Halaman setelah C)
            const targetSlot = document.getElementById('slot-auto-back');
            targetSlot.style.backgroundImage = `url('${pathGambarBaru}')`;
            
            alert(`✅ Sukses! File ${fileNama} berhasil didaftarkan sebagai halaman lanjutan setelah Gambar C.`);
            input.value = '';
        }

        // Fungsi Reset untuk Menutup Buku Kembali Semula
        function tutupSemuaHalaman() {
            document.getElementById('page1').classList.remove('flipped');
            document.getElementById('page2').classList.remove('flipped');
            document.getElementById('stage').classList.remove('opened');
        }
    </script>
</body>
</html>

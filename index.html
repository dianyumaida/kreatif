<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Digital 3D Interaktif & Auto-Add</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            justify-content: center;
        }
        h1 { margin-bottom: 5px; font-size: 24px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
        p { margin-top: 0; color: #95a5a6; font-size: 14px; margin-bottom: 30px; }

        /* Area Panggung Buku (3D Render Area) */
        .book-stage {
            width: 400px;
            height: 520px;
            perspective: 2000px;
            position: relative;
            transition: transform 0.6s ease;
        }
        .book-stage.opened {
            transform: translateX(200px);
        }

        /* Kontainer Buku Utama */
        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* Komponen Lembaran Kertas Buku */
        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Sisi Depan dan Sisi Belakang Lembaran Kertas */
        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            background-color: #ffffff;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.4);
            color: #333;
            box-sizing: border-box;
        }

        .front { border-radius: 0 8px 8px 0; }
        .back {
            transform: rotateY(180deg);
            border-radius: 8px 0 0 8px;
        }

        /* Efek Bayangan Lipatan Buku di Tengah */
        .front::after {
            content: ''; position: absolute; left: 0; top: 0; width: 25px; height: 100%;
            background: linear-gradient(90deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 100%);
        }
        .back::after {
            content: ''; position: absolute; right: 0; top: 0; width: 25px; height: 100%;
            background: linear-gradient(-90deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 100%);
        }

        /* Trigger Animasi Membalik Kertas */
        .page.flipped {
            transform: rotateY(-180deg);
        }

        /* Tampilan Area Konten Form Di Dalam Lembar Baru */
        .form-lembar-baru {
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: center;
            background-color: #fdfcf7; /* Tekstur kertas tulis */
        }
        .form-lembar-baru h3 {
            margin: 0 0 15px 0;
            color: #2c3e50;
            text-align: center;
            font-size: 18px;
        }
        .form-lembar-baru input, .form-lembar-baru textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .form-lembar-baru textarea {
            height: 120px;
            resize: none;
        }
        .form-lembar-baru button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .form-lembar-baru button:hover { background-color: #2cc36b; }

        /* Kontrol navigasi bawah */
        .nav-buttons {
            margin-top: 40px;
            display: flex;
            gap: 20px;
        }
        .btn-control {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-control:hover { background-color: #3498db; }
        .btn-danger { background-color: #e74c3c; }
        .btn-danger:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <h1>📖 Mushaf & Buku Digital Kreatif (Auto-Increment)</h1>
    <p>Klik tombol navigasi untuk membalik. Lembar paling akhir akan otomatis menjadi form upload halaman baru.</p>

    <!-- Panggung Buku 3D -->
    <div class="book-stage" id="stage">
        <div class="book" id="book-canvas">
            <!-- Isi buku akan dimuat secara dinamis oleh JavaScript di bawah -->
        </div>
    </div>

    <!-- Tombol Navigasi Utama -->
    <div class="nav-buttons">
        <button class="btn-control" onclick="balikKiri()">⬅️ Balik Kiri</button>
        <button class="btn-control btn-danger" onclick="resetBuku()">🔄 Tutup Buku</button>
        <button class="btn-control" onclick="balikKanan()">Balik Kanan ➡️</button>
    </div>

    <script>
        // Data struktur lembaran awal buku Anda di GitHub
        let koleksiBuku = [
            { type: "image", src: "File/Gambar/Buku/A.png" }, // Cover Depan (Halaman 1)
            { type: "image", src: "File/Gambar/Buku/B.png" }, // Halaman Isi (Halaman 2)
            { type: "image", src: "File/Gambar/Buku/C.png" }  // Halaman Isi (Halaman 3)
        ];

        // Muat data dari penyimpanan browser lokal jika sudah pernah dimodifikasi sebelumnya
        if (localStorage.getItem('koleksiBukuDigital')) {
            koleksiBuku = JSON.parse(localStorage.getItem('koleksiBukuDigital'));
        }

        let totalLembarKertas = 0;
        let lembarSaatIni = 0;

        // Fungsi menyusun lembaran kertas buku secara dinamis
        function bangunStrukturBuku() {
            const canvas = document.getElementById('book-canvas');
            canvas.innerHTML = ''; // Bersihkan isi kanvas lama

            let susunanHTML = '';
            totalLembarKertas = Math.ceil((koleksiBuku.length + 1) / 2); // Ditambah 1 lembar khusus untuk form input otomatis

            for (let i = 0; i < totalLembarKertas; i++) {
                const indexFront = i * 2;
                const indexBack = indexFront + 1;
                const zIndex = totalLembarKertas - i;

                susunanHTML += `<div class="page" id="p${i + 1}" style="z-index: ${zIndex};">`;

                // --- SISI DEPAN LEMBARAN (FRONT) ---
                if (indexFront < koleksiBuku.length) {
                    if (koleksiBuku[indexFront].type === "image") {
                        susunanHTML += `<div class="front" style="background-image: url('${koleksiBuku[indexFront].src}');"></div>`;
                    } else {
                        susunanHTML += `<div class="front" style="background-color: #fdfcf7; padding: 25px;"><h3 style="color:#2c3e50; margin:0 0 10px 0;">${koleksiBuku[indexFront].judul}</h3><p style="color:#333; line-height:1.5;">${koleksiBuku[indexFront].teks}</p></div>`;
                    }
                } else {
                    // Jika data habis, otomatis sisi depan lembar terakhir menjadi Form Lembar Baru
                    susunanHTML += `
                        <div class="front">
                            <div class="form-lembar-baru">
                                <h3>➕ Buat Lembar Baru</h3>
                                <input type="text" id="input-judul" placeholder="Judul Halaman (Opsional)">
                                <textarea id="input-teks" placeholder="Tulis isi cerita / catatan di sini..."></textarea>
                                <input type="text" id="input-gambar" placeholder="Atau ketik nama file gambar (Contoh: D.png)">
                                <button onclick="simpanLembarBaruKeBuku()">Simpan ke Buku</button>
                            </div>
                        </div>`;
                }

                // --- SISI BELAKANG LEMBARAN (BACK) ---
                if (indexBack < koleksiBuku.length) {
                    if (koleksiBuku[indexBack].type === "image") {
                        susunanHTML += `<div class="back" style="background-image: url('${koleksiBuku[indexBack].src}');"></div>`;
                    } else {
                        susunanHTML += `<div class="back" style="background-color: #fdfcf7; padding: 25px;"><h3 style="color:#2c3e50; margin:0 0 10px 0;">${koleksiBuku[indexBack].judul}</h3><p style="color:#333; line-height:1.5;">${koleksiBuku[indexBack].teks}</p></div>`;
                    }
                } else {
                    // Sisi belakang paling terakhir (Cover Belakang)
                    if (indexFront >= koleksiBuku.length) {
                        susunanHTML += `<div class="back" style="background-color: #2c3e50;"></div>`;
                    } else {
                        susunanHTML += `
                        <div class="back">
                            <div class="form-lembar-baru">
                                <h3>➕ Buat Lembar Baru</h3>
                                <input type="text" id="input-judul" placeholder="Judul Halaman (Opsional)">
                                <textarea id="input-teks" placeholder="Tulis isi cerita / catatan di sini..."></textarea>
                                <input type="text" id="input-gambar" placeholder="Atau ketik nama file gambar (Contoh: D.png)">
                                <button onclick="simpanLembarBaruKeBuku()">Simpan ke Buku</button>

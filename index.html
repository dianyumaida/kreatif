<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Buku Digital</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku - FULL PAGE */
        .book-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 200;
        }

        /* STRUKTUR CSS CUSTOM DROPDOWN SEPERTI CONTOH GAMBAR */
        .custom-dropdown-container {
            position: relative;
            width: 100%;
            box-sizing: border-box;
        }

        .dropdown-trigger {
            background-color: #f5f5f5;
            color: #333;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }

        .dropdown-panel-content {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #ccc;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            max-height: 380px;
            overflow-y: auto;
            z-index: 300;
        }

        .dropdown-panel-content.buka {
            display: block;
        }

        /* Item Aksi Kelola Buku */
        .action-menu-item {
            padding: 10px 15px;
            font-size: 13px;
            font-weight: 6px;
            color: #2c3e50;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        .action-menu-item:hover {
            background-color: #ecf0f1;
        }

        /* Pembatas / Header Folder Kategori */
        .folder-category-header {
            background-color: #eeeeee;
            padding: 10px 15px;
            font-size: 13px;
            font-weight: bold;
            color: #555;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid #ddd;
        }

        /* Item Target Wadah Aktif (sin, cos, tan) */
        .sub-target-item {
            padding: 10px 15px 10px 35px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f9f9f9;
        }
        .sub-target-item:hover {
            background-color: #f7f9fa;
        }
        /* Visual Lingkaran Radio Kustom di Sebelah Kanan */
        .custom-radio-circle {
            width: 14px;
            height: 14px;
            border: 2px solid #7f8c8d;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }

        .sub-target-item.aktif-wadah .custom-radio-circle {
            border-color: #2980b9;
        }

        .sub-target-item.aktif-wadah .custom-radio-circle::after {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #2980b9;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Elemen Sub-Link Hyperlink Hasil Blok Penanda */
        .nested-bookmark-link {
            padding: 8px 15px 8px 50px;
            font-size: 11px;
            color: #7f8c8d;
            background-color: #fafbfc;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid #f1f2f6;
        }
        .nested-bookmark-link:hover {
            background-color: #f1f2f6;
            color: #2980b9;
        }

        /* PANEL TOMBOL PENGATUR UKURAN MEDIA BAWAH HP */
        .media-tools-bar {
            background-color: #2c3e50;
            padding: 6px;
            display: none;
            gap: 6px;
            border-bottom: 2px solid #27ae60;
            z-index: 200;
        }

        .media-btn {
            flex: 1;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 8px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
        }
        .media-btn:hover { background-color: #2ecc71; }
        
        /* Status Perekaman Suara melayang dengan tombol stop */
        .record-status {
            font-weight: bold;
            color: white;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: #e74c3c;
            padding: 10px 20px;
            border-radius: 20px;
            z-index: 250;
            cursor: pointer;
            border: 2px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { 
            from { transform: scale(1) translateX(-50%); } 
            to { transform: scale(1.05) translateX(-50%); } 
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
            z-index: 190;
        }

        /* AREA KETIK TEKS UTAMA */
        .text-work-space {
            padding: 20px;
            background-color: #ffffff;
            margin: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
            outline: none;
            flex-grow: 1;
            position: relative;
            z-index: 10;
        }

        .embedded-media-block {
            display: block;
            margin: 12px auto;
            max-width: 100%;
            width: 180px;
            border: 2px solid transparent;
            box-sizing: border-box;
            border-radius: 6px;
            cursor: pointer;
            transition: border 0.1s ease;
        }

        .embedded-media-block.selected-target {
            border-color: #2ecc71;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
        }

        .embedded-media-block img, 
        .embedded-media-block video, 
        .embedded-media-block audio {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        .hyperlink-bookmark {
            color: #0066cc;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
            background-color: rgba(0, 102, 204, 0.1);
            padding: 0 2px;
            border-radius: 3px;
        }

        .audio-dropdown-panel {
            padding: 8px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            align-items: center;
            z-index: 190;
        }

        .audio-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            cursor: pointer;
        }

        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="book-container">
        <div class="nav-header">
            <h3 id="textHeaderUtama" style="color: white; margin: 0 0 5px 0; font-size: 14px; text-align: center;">Target: Sudut: sin</h3>
            
            <!-- IMPLEMENTASI CUSTOM COMPONENT DROPDOWN TUNGGAL -->
            <div class="custom-dropdown-container">
                <div class="dropdown-trigger" id="custom-trigger" onclick="toggleDropdownPanel(event)">
                    <span id="trigger-label">-- Pilih Menu --</span>
                    <span>▼</span>
                </div>
                
                <div class="dropdown-panel-content" id="custom-panel">
                    <!-- Kelompok Aksi Buku Utama -->
                    <div class="action-menu-item" onclick="pilihMenuAksi('aksi-tambah')">➕ Tambah Halaman Baru</div>
                    <div class="action-menu-item" onclick="pilihMenuAksi('aksi-cari')">🔍 Pencarian</div>
                    <div class="action-menu-item" onclick="pilihMenuAksi('aksi-wa')">📲 Kirim Saluran WhatsApp</div>
                    <div class="action-menu-item" onclick="pilihMenuAksi('aksi-upload-img')">📸 Upload Gambar Baru (Letak Kursor)</div>
                    <div class="action-menu-item" onclick="pilihMenuAksi('aksi-upload-vid')">📹 Upload Video Baru (Letak Kursor)</div>
                    <div class="action-menu-item" onclick="pilihMenuAksi('aksi-upload-mp3')">🎵 Upload Lagu MP3</div>
                    <div class="action-menu-item" onclick="pilihMenuAksi('aksi-rekam')">🎙️ Mulai Perekaman Suara</div>
                    <div class="action-menu-item" onclick="pilihMenuAksi('aksi-penanda')">🔗 Buat Hyperlink Penanda</div>
                    <div class="action-menu-item" onclick="pilihMenuAksi('aksi-hapus')">❌ Hapus Lembar Ini</div>
                    
                    <!-- KELOMPOK DAFTAR HYPERLINK SEPERTI GAMBAR CONTOH ANDA -->
                    <div class="folder-category-header">📂 -- sudut --</div>
                    
                    <!-- Wadah Target Sin -->
                    <div class="sub-target-item aktif-wadah" id="item-wadah-sin" onclick="pilihWadahAktif('wadah-sin', event)">
                        <span>sin</span>
                        <span class="custom-radio-circle"></span>
                    </div>
                    <div id="sub-links-sin-box"></div> <!-- Tempat render link sin dinamis -->

                    <!-- Wadah Target Cos -->
                    <div class="sub-target-item" id="item-wadah-cos" onclick="pilihWadahAktif('wadah-cos', event)">
                        <span>cos</span>
                        <span class="custom-radio-circle"></span>
                    </div>
                    <div id="sub-links-cos-box"></div> <!-- Tempat render link cos dinamis -->

                    <!-- Wadah Target Tan -->
                    <div class="sub-target-item" id="item-wadah-tan" onclick="pilihWadahAktif('wadah-tan', event)">
                        <span>tan</span>
                        <span class="custom-radio-circle"></span>
                    </div>
                    <div id="sub-links-tan-box"></div> <!-- Tempat render link tan dinamis -->
                </div>
            </div>
        </div>
        
        <!-- BAR TOMBOL KONTROL UKURAN MEDIA YANG DIKLIK -->
        <div class="media-tools-bar" id="media-tools">
            <button class="media-btn" onclick="ubahUkuranKlik(30)">➕ Perbesar</button>
            <button class="media-btn" onclick="ubahUkuranKlik(-30)">➖ Perkecil</button>
            <button class="media-btn" onclick="hapusMediaKlik()" style="background:#e74c3c;">❌ Hapus</button>
        </div>

        <!-- PANEL RADIO BUTTON HALAMAN -->
        <div class="audio-dropdown-panel" id="radio-container"></div>

        <!-- Input File Picker Perangkat -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- KANVAS UTAMA TEMPAT MENGETIK & MENYUSUN MEDIA -->
        <div id="text-input-field" class="text-work-space" contenteditable="true" onclick="deteksiKlikMedia(event)" onkeyup="periksaSeleksiTeks()" onmouseup="periksaSeleksiTeks()">
            <button class="record-status" id="record-indicator" onclick="toggleRekamSuara(event)">🔴 Merekam... Klik di Sini Untuk Stop</button>
        </div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 1</div>
    </div>

<script>
    let databaseBuku = [{ teks: "" }];
    let indeksAktif = 0;
    let elemenMediaTerpilih = null;
    let mediaRecorder;
    let audioChunks = [];
    let sedangMerekam = false;
    let streamSuara = null;

    // Manajemen penyimpanan terstruktur link dinamis kustom dropdown
    let dataPenandaKategori = {
        "wadah-sin": { nama: "Sudut: sin", boxId: "sub-links-sin-box", listLink: [] },
        "wadah-cos": { nama: "Sudut: cos", boxId: "sub-links-cos-box", listLink: [] },
        "wadah-tan": { nama: "Sudut: tan", boxId: "sub-links-tan-box", listLink: [] }
    };
    let wadahTerpilihSaatIni = "wadah-sin";
    const elTriggerLabel = document.getElementById('trigger-label');
    const elCustomPanel = document.getElementById('custom-panel');
    const elIndikator = document.getElementById('page-indicator');
    const elTextField = document.getElementById('text-input-field');
    const elRecordIndicator = document.getElementById('record-indicator');
    const elRadioContainer = document.getElementById('radio-container');
    const elMediaTools = document.getElementById('media-tools');
    const textHeaderUtama = document.getElementById('textHeaderUtama');

    // Membuka/menutup panel kustom dropdown
    function toggleDropdownPanel(event) {
        if (event) event.stopPropagation();
        elCustomPanel.classList.toggle('buka');
    }

    // Klik di luar panel otomatis menutup kustom dropdown
    document.addEventListener('click', function() {
        elCustomPanel.classList.remove('buka');
    });

    // Mengubah pilihan target kelola wadah aktif (sin, cos, tan) sesuai klik gambar
    function pilihWadahAktif(idWadah, event) {
        if (event) event.stopPropagation();
        
        wadahTerpilihSaatIni = idWadah;
        textHeaderUtama.innerText = "Target: " + dataPenandaKategori[idWadah].nama;
        elTriggerLabel.innerText = dataPenandaKategori[idWadah].nama;

        // Atur ulang visualisasi status kelas aktif agar dot bundar biru berpindah
        document.querySelectorAll('.sub-target-item').forEach(el => el.classList.remove('aktif-wadah'));
        document.getElementById(`item-${idWadah}`).classList.add('aktif-wadah');

        elCustomPanel.classList.remove('buka'); // Tutup dropdown
    }

    // Fungsi memperbarui list sub-link hasil penandaan teks agar masuk rapi di bawah folder penanda
    function renderSubLinksKustomDropdown() {
        Object.keys(dataPenandaKategori).forEach(key => {
            const dataKat = dataPenandaKategori[key];
            const boxKonten = document.getElementById(dataKat.boxId);
            if (!boxKonten) return;

            boxKonten.innerHTML = ""; // Bersihkan list lama

            dataKat.listLink.forEach((link, index) => {
                const divLink = document.createElement('div');
                divLink.className = "nested-bookmark-link";
                divLink.innerText = `└─ 🔗 [Hlm ${link.idHalaman + 1}] "${link.isiTeks.substring(0, 12)}..."`;
                
                divLink.onclick = function(event) {
                    event.stopPropagation();
                    lompatKeTargetHyperlink(link.idHalaman, link.linkId);
                    elCustomPanel.classList.remove('buka');
                };
                boxKonten.appendChild(divLink);
            });
        });
    }

    function muatHalaman(indeks) {
        indeksAktif = indeks;
        const data = databaseBuku[indeksAktif];
        elMediaTools.style.display = 'none';
        elemenMediaTerpilih = null;
        elTextField.innerHTML = data.teks || "";
        perbaruiElemenVideoHalaman();
        elTextField.appendChild(elRecordIndicator);
        elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
        renderRadioHalaman();
    }
    function deteksiKlikMedia(event) {
        let targetBlock = event.target.closest('.embedded-media-block');
        if (targetBlock) {
            event.stopPropagation();
            const semuaM = elTextField.querySelectorAll('.embedded-media-block');
            semuaM.forEach(m => m.classList.remove('selected-target'));
            elemenMediaTerpilih = targetBlock;
            elemenMediaTerpilih.classList.add('selected-target');
            elMediaTools.style.display = 'flex';
        } else {
            elemenMediaTerpilih = null;
            elMediaTools.style.display = 'none';
            const semuaM = elTextField.querySelectorAll('.embedded-media-block');
            semuaM.forEach(m => m.classList.remove('selected-target'));
        }
    }

    function ubahUkuranKlik(nilaiTambah) {
        if (!elemenMediaTerpilih) return;
        let lebarLama = elemenMediaTerpilih.offsetWidth;
        let lebarBaru = lebarLama + nilaiTambah;
        if (lebarBaru < 60) lebarBaru = 60;
        if (lebarBaru > 380) lebarBaru = 380;
        elemenMediaTerpilih.style.width = lebarBaru + 'px';
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
    }

    function hapusMediaKlik() {
        if (!elemenMediaTerpilih) return;
        elemenMediaTerpilih.remove();
        elemenMediaTerpilih = null;
        elMediaTools.style.display = 'none';
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
    }

    let kataKunciSeleksi = "";
    function periksaSeleksiTeks() {
        kataKunciSeleksi = window.getSelection().toString().trim();
    }

    function buatPenandaDariBlokTeks() {
        if (!kataKunciSeleksi) {
            alert("Gagal! Silakan sorot/blok kalimat teks di dalam catatan terlebih dahulu.");
            return;
        }
        const seleksi = window.getSelection();
        if (seleksi.rangeCount > 0) {
            const range = seleksi.getRangeAt(0);
            const aLink = document.createElement('span');
            aLink.className = 'hyperlink-bookmark';
            aLink.textContent = kataKunciSeleksi;
            const penandaId = "link-" + Date.now();
            aLink.setAttribute('data-link-id', penandaId);
            range.deleteContents();
            range.insertNode(aLink);
            databaseBuku[indeksAktif].teks = elTextField.innerHTML;

            // Masukkan data sub-link ke folder kategori yang sedang aktif lingkaran radionya
            dataPenandaKategori[wadahTerpilihSaatIni].listLink.push({
                idHalaman: indeksAktif,
                linkId: penandaId,
                isiTeks: kataKunciSeleksi
            });

            // Perbarui susunan daftar link kustom dropdown
            renderSubLinksKustomDropdown();

            seleksi.removeAllRanges();
            kataKunciSeleksi = "";
            alert(`Sukses! Teks dimasukkan di bawah kategori: ${dataPenandaKategori[wadahTerpilihSaatIni].nama}`);
        }
    }

    function lompatKeTargetHyperlink(idHalaman, linkId) {
        muatHalaman(idHalaman);
        setTimeout(() => {
            const elemenLink = elTextField.querySelector(`[data-link-id="${linkId}"]`);
            if (elemenLink) {
                elemenLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
                elemenLink.style.backgroundColor = "#ffcc00";
                setTimeout(() => elemenLink.style.backgroundColor = "rgba(0, 102, 204, 0.1)", 1500);
            }
        }, 350);
    }
    function renderRadioHalaman() {
        elRadioContainer.innerHTML = "";
        databaseBuku.forEach((item, index) => {
            const label = document.createElement('label');
            label.className = 'audio-item';
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'anak-penanda';
            radio.value = index;
            radio.checked = (index === indeksAktif);
            radio.onchange = function() {
                databaseBuku[indeksAktif].teks = elTextField.innerHTML;
                muatHalaman(parseInt(radio.value));
            };
            label.appendChild(radio);
            label.appendChild(document.createTextNode(`Halaman ${index + 1}`));
            elRadioContainer.appendChild(label);
        });
    }

    elTextField.addEventListener('input', function() {
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
    });

    function cariTeksBuku() {
        const kataKunci = prompt("Masukkan kata kunci catatan yang ingin dicari:");
        if (!kataKunci || !kataKunci.trim()) return;
        const indeksDitemukan = databaseBuku.findIndex(item => item.teks.toLowerCase().includes(kataKunci.toLowerCase()));
        if (indeksDitemukan !== -1) { muatHalaman(indeksDitemukan); } else { alert("Kata kunci tidak ditemukan."); }
    }

    // Handler penentu aksi eksekusi menu kustom dropdown utama
    function pilihMenuAksi(nilaiAksi) {
        elCustomPanel.classList.remove('buka'); // Tutup panel setelah dipilih

        if (nilaiAksi === 'aksi-tambah') {
            databaseBuku.push({ teks: "" });
            muatHalaman(databaseBuku.length - 1);
        }
        else if (nilaiAksi === 'aksi-cari') {
            cariTeksBuku();
        }
        else if (nilaiAksi === 'aksi-wa') {
            const clone = elTextField.cloneNode(true);
            const extra = clone.querySelectorAll('.embedded-media-block, .record-status');
            extra.forEach(x => x.remove());
            const teksMurni = clone.innerText || clone.textContent;
            const teksKirim = encodeURIComponent(`Berikut Catatan Buku Digital Lembar ${indeksAktif + 1}:\n\n` + teksMurni);
            const linkWA = document.createElement('a'); linkWA.href = `https://wa.me{teksKirim}`; linkWA.target = '_blank';
            document.body.appendChild(linkWA); linkWA.click(); document.body.removeChild(linkWA);
        }
        else if (nilaiAksi === 'aksi-upload-img') { document.getElementById('file-image').click(); }
        else if (nilaiAksi === 'aksi-upload-vid') { document.getElementById('file-video').click(); }
        else if (nilaiAksi === 'aksi-upload-mp3') { document.getElementById('file-audio').click(); }
        else if (nilaiAksi === 'aksi-rekam') { toggleRekamSuara(); }
        else if (nilaiAksi === 'aksi-penanda') { buatPenandaDariBlokTeks(); }
        else if (nilaiAksi === 'aksi-hapus') {
            if (databaseBuku.length <= 1) { alert("Gagal! Minimal harus ada 1 halaman."); return; }
            if (confirm("Hapus lembar halaman ini?")) {
                databaseBuku.splice(indeksAktif, 1);
                if (indeksAktif >= databaseBuku.length) { indeksAktif = databaseBuku.length - 1; }
                muatHalaman(indeksAktif);
            }
        }
    }

    function handleFileSelected(input, type) {
        if (input.files && input.files.length > 0) {
            const fileObj = input.files[0]; // Membaca berkas pertama dari array picker agar sukses tampil masuk page
            let selection = window.getSelection();
            let range = (selection.rangeCount > 0 && elTextField.contains(selection.getRangeAt(0).commonAncestorContainer)) ? selection.getRangeAt(0) : document.createRange();
            if (selection.rangeCount === 0 || !elTextField.contains(selection.getRangeAt(0).commonAncestorContainer)) {
                range.selectNodeContents(elTextField);
                range.collapse(false);
            }

            const mediaBlock = document.createElement('div');
            mediaBlock.className = 'embedded-media-block';
            mediaBlock.contentEditable = 'false';
            const mediaURL = URL.createObjectURL(fileObj);

            if (type === 'image') {
                const img = document.createElement('img'); img.src = mediaURL;
                mediaBlock.appendChild(img);
            } else if (type === 'video') {
                const video = document.createElement('video'); video.src = mediaURL; video.controls = true; video.playsInline = true;
                mediaBlock.appendChild(video);
            } else if (type === 'audio') {
                const audio = document.createElement('audio'); audio.src = mediaURL; audio.controls = true;
                mediaBlock.appendChild(audio);
            }
            prosesPenyisipanBlokMedia(range, mediaBlock);
        }
        input.value = '';
    }

    function prosesPenyisipanBlokMedia(range, mediaBlock) {
        range.insertNode(mediaBlock);
        const brNode = document.createElement('br');
        range.setStartAfter(mediaBlock);
        range.insertNode(brNode);
        range.setStartAfter(brNode);
        range.collapse(true);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
        elTextField.focus();
    }

    function perbaruiElemenVideoHalaman() {
        const semuaMedia = elTextField.querySelectorAll('video, audio');
        semuaMedia.forEach(med => {
            med.controls = true;
            med.onclick = (e) => e.stopPropagation();
        });
    }

    function toggleRekamSuara(event) {
        if(event) event.stopPropagation();

        if (!sedangMerekam) {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                    streamSuara = stream;
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioURL = URL.createObjectURL(audioBlob);
                        let selection = window.getSelection();
                        let range = (selection.rangeCount > 0 && elTextField.contains(selection.getRangeAt(0).commonAncestorContainer)) ? selection.getRangeAt(0) : document.createRange();
                        if (selection.rangeCount === 0 || !elTextField.contains(selection.getRangeAt(0).commonAncestorContainer)) {
                            range.selectNodeContents(elTextField);
                            range.collapse(false);
                        }
                        
                        const mediaBlock = document.createElement('div');
                        mediaBlock.className = 'embedded-media-block';
                        mediaBlock.contentEditable = 'false';
                        const audio = document.createElement('audio');
                        audio.src = audioURL; audio.controls = true;
                        mediaBlock.appendChild(audio);
                        prosesPenyisipanBlokMedia(range, mediaBlock);
                    };

                    mediaRecorder.start();
                    sedangMerekam = true;
                    elRecordIndicator.style.display = 'block';
                }).catch(err => alert('Gagal merekam! Periksa izin mikrofon perangkat Anda.'));
            }
        } else {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            if (streamSuara) {
                streamSuara.getTracks().forEach(track => track.stop());
            }
            sedangMerekam = false;
            elRecordIndicator.style.display = 'none';
        }
    }

    // Eksekusi render inisialisasi awal
    renderSubLinksKustomDropdown();
    muatHalaman(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buku Digital Interaktif</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
        }
        .area-buku {
            border-left: 4px solid #007bff;
            padding-left: 15px;
            margin-bottom: 25px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 0 8px 8px 0;
        }
        /* Style agar kalimat di buku terlihat bisa diklik dan interaktif */
.teks-bacaan {
    background-color: #fff3cd; /* Warna stabilo kuning muda */
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background 0.2s;
}
.teks-bacaan:hover {
    background-color: #ffeba4;
    color: #0056b3;
    text-decoration: underline;
}

        /* Style untuk teks dalam buku yang berfungsi sebagai hyperlink */
        .hyperlink-teks {
            color: #007bff;
            font-weight: bold;
            text-decoration: underline;
            cursor: pointer;
            transition: color 0.2s;
        }
        .hyperlink-teks:hover {
            color: #0056b3;
            background-color: #e6f0ff;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .box-cucu {
            background: #eef9f1;
            border: 1px solid #c3e6cb;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none; /* Sembunyi di awal, muncul jika ada data */
        }
        .box-cucu ul {
            margin: 5px 0 0 20px;
            padding: 0;
        }
        .btn-wa {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .btn-wa:hover {
            background-color: #1bd741;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Bagian Halaman Buku -->
    <!-- Bagian Input dan Pembuat Teks Buku -->
<div class="area-buku" style="border-left: 4px solid #28a745;">
    <h3>Alat Pembuat Teks & Hyperlink</h3>
    <p style="font-size: 14px; color: #666; margin-top: -10px;">
        Ketik teks Anda di kotak bawah. <b>Blok/seleksi kata</b> yang diinginkan dengan kursor, lalu klik tombol "Jadikan Hyperlink".
    </p>

    <!-- Kotak tempat mengetik teks bebas (bisa diedit langsung seperti MS Word) -->
    <div id="kotakKetik" contenteditable="true" style="border: 1px solid #ced4da; padding: 12px; background: #fff; min-height: 100px; border-radius: 6px; outline: none; font-size: 16px;">
        Silakan hapus teks contoh ini dan ketik kalimat Anda sendiri. Blok kata tertentu untuk dicoba.
    </div>

    <!-- Tombol untuk mengubah teks yang diblok menjadi link -->
    <!-- Gunakan onmousedown dan ontouchstart untuk mencegah teks kehilangan blok di HP -->
<button onclick="buatHyperlinkOtomatis()" style="margin-top: 10px; background-color: #007bff; color: white; border: none; padding: 8px 15px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 14px;">
    🔗 Jadikan Hyperlink
</button>


</div>



    <!-- Bagian Komponen Dropdown -->
    <label for="menuDropdown"><b>Pilih Menu Kategori:</b></label>
    <select id="menuDropdown">
        <option value="">--pilih--</option>
        <!-- Opsi di bawah ini akan diisi otomatis oleh JavaScript dari file JSON -->
    </select>

    <!-- Tempat Menampilkan Data Cucu -->
    <div id="areaCucu" class="box-cucu">
        <strong>Data Cucu Terkait:</strong>
        <ul id="listCucu"></ul>
    </div>

    <!-- Tombol Kirim Siaran WhatsApp -->
    <button class="btn-wa" onclick="kirimSiaranWA()">Kirim ke Siaran WA</button>
</div>

<!-- Menghubungkan ke logika JavaScript -->
<script src="app.js"></script>
</body>
</html>

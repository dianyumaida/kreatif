<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Buku Digital</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku - FULL PAGE KIRI KANAN */
        .book-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
        }

        .dropdown-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* PANEL PENGATUR UKURAN MEDIA */
        .size-control-panel {
            background-color: #34495e;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            border-bottom: 1px solid #2c3e50;
            z-index: 20;
        }

        .size-slider {
            flex-grow: 1;
            cursor: pointer;
            accent-color: #2ecc71;
        }

        /* Status Perekaman Suara */
        .record-status {
            font-weight: bold;
            color: #e74c3c;
            position: absolute;
            top: 10px;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 30;
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
            z-index: 20;
        }

        /* Area Bingkai Penampung Media */
        .content-area {
            width: 100%;
            max-height: 220px;
            background-color: #ecf0f1; 
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            overflow: hidden;
            z-index: 5;
        }

        /* Elemen Gambar Utama */
        .display-image {
            width: 100%;
            height: 220px;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            transition: width 0.1s ease, height 0.1s ease;
        }

        /* Elemen Video & Audio */
        video, audio {
            width: 100%;
            max-height: 100%;
            z-index: 6;
            transition: width 0.1s ease, height 0.1s ease;
        }

        /* AREA TEKS PENUH */
        .text-work-space {
            padding: 20px;
            background-color: #ffffff;
            border: none;
            margin: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
            outline: none;
            flex-grow: 1;
            position: relative;
            z-index: 10;
        }

        /* GAYA HYPERLINK PENANDA */
        .hyperlink-bookmark {
            color: #0066cc;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
            background-color: rgba(0, 102, 204, 0.1);
            padding: 0 2px;
            border-radius: 3px;
        }

        /* Panel Radio Button */
        .radio-dropdown-panel {
            padding: 8px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            align-items: center;
            z-index: 20;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            cursor: pointer;
        }
        
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- SATU DROPDOWN UTAMA DI ATAS -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">-- MENU UTAMA KELOLA BUKU --</option>
                <option value="aksi-tambah">➕ Tambah Halaman Baru</option>
                <option value="aksi-bookmark">📌 Jadikan Teks Diblok Sebagai Penanda</option>
                <option value="aksi-cari">🔍 Jalankan Pencarian Kata Kunci Catatan</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp KASY</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru</option>
                <option value="aksi-upload-vid">🎥 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekan">🎙️ Mulai / Stop Rekam Suara</option>
                <option value="aksi-hapus">❌ Hapus Lembar Ini</option>
                <!-- KELOMPOK BARU: Riwayat penanda disatukan di bawah dropdown ini -->
                <optgroup label="📂 DAFTAR RIWAYAT PENANDA TEKS" id="grup-riwayat-penanda">
                    <!-- Opsi link baru otomatis masuk ke sini -->
                </optgroup>
            </select>
        </div>

        <!-- PANEL SLIDER UNTUK MENGATUR BESAR KECIL GAMBAR/VIDEO -->
        <div class="size-control-panel" id="size-panel">
            <span>🔎 Ukuran Media:</span>
            <input type="range" id="media-size-slider" class="size-slider" min="20" max="100" value="100" oninput="aturUkuranMedia(this.value)">
            <span id="size-percentage">100%</span>
        </div>

        <!-- PANEL RADIO BUTTON -->
        <div class="radio-dropdown-panel" id="radio-container">
            <!-- Diisi otomatis oleh JavaScript -->
        </div>

        <!-- Input File Picker Perangkat resmi dengan parameter perbaikan -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- AREA GAMBAR (Mendukung Double-Click) -->
        <div class="content-area" id="book-content" ondblclick="klikDuaKaliMajuLembar(event)">
            <div class="record-status" id="record-indicator">🔴 Sedang Merekam...</div>
            <div id="media-placeholder" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none;"></div>
            <div id="image-target" class="display-image" style="display: none;"></div>
        </div>

        <!-- AREA KETIK TEKS MELEBAR FULL PAGE -->
        <div id="text-input-field" class="text-work-space" contenteditable="true" placeholder="Silakan ketik catatan lembar baru Anda di sini..." ondblclick="klikDuaKaliMajuLembar(event)"></div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 1</div>
    </div>

<script>
    let databaseBuku = [
        { type: "image", src: "./File/Gambar/Buku/B.png", teks: "", skala: 100 }
    ];

    let riwayatPenanda = [];
    let indeksAktif = 0;
    let mediaRecorder;
    let audioChunks = [];
    let sedangMerekam = false;

    const elContent = document.getElementById('book-content');
    const elPlaceholder = document.getElementById('media-placeholder');
    const elImageTarget = document.getElementById('image-target');
    const elMenu = document.getElementById('menu-navigasi');
    const elGrupRiwayat = document.getElementById('grup-riwayat-penanda');
    const elIndikator = document.getElementById('page-indicator');
    const elTextField = document.getElementById('text-input-field');
    const elRecordIndicator = document.getElementById('record-indicator');
    const elRadioContainer = document.getElementById('radio-container');
    const elSizeSlider = document.getElementById('media-size-slider');
    const elSizePercentage = document.getElementById('size-percentage');
    const elSizePanel = document.getElementById('size-panel');

    function muatHalaman(indeks) {
        indeksAktif = indeks;
        const data = databaseBuku[indeksAktif];
        elPlaceholder.innerHTML = '';
        elImageTarget.style.backgroundImage = 'none';
        elImageTarget.style.display = 'none';

        if (data.type === 'text-only') {
            elContent.style.display = 'none'; 
            elSizePanel.style.display = 'none';
        } else {
            elContent.style.display = 'flex'; 
            elSizePanel.style.display = 'flex';

            const skalaSkrg = data.skala || 100;
            elSizeSlider.value = skalaSkrg;
            elSizePercentage.innerText = skalaSkrg + "%";
            
            if (data.type === 'image' && data.src) {
                elImageTarget.style.display = 'block';
                elImageTarget.style.backgroundImage = `url('${data.src}')`;
                elImageTarget.style.width = skalaSkrg + "%";
                elImageTarget.style.height = skalaSkrg + "%";
            } else if (data.type === 'video') {
                elPlaceholder.innerHTML = `<video id="video-target" src="${data.src}" controls style="width: ${skalaSkrg}%"></video>`;
            } else if (data.type === 'audio') {
                elPlaceholder.innerHTML = `<audio src="${data.src}" controls></audio>`;
                elSizePanel.style.display = 'none';
            }
        }

        elTextField.innerHTML = data.teks || "";
        elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
        
        renderRadioHalaman();
    }
    function aturUkuranMedia(persen) {
        elSizePercentage.innerText = persen + "%";
        databaseBuku[indeksAktif].skala = parseInt(persen);

        const data = databaseBuku[indeksAktif];
        if (data.type === 'image') {
            elImageTarget.style.width = persen + "%";
            elImageTarget.style.height = persen + "%";
        } else if (data.type === 'video') {
            const elVid = document.getElementById('video-target');
            if (elVid) { elVid.style.width = persen + "%"; }
        }
    }

    function renderRadioHalaman() {
        elRadioContainer.innerHTML = '';
        databaseBuku.forEach((item, index) => {
            const label = document.createElement('label');
            label.className = 'radio-item';
            
            const radio = document.createElement('input');
            radio.type = 'radio';
            radio.name = 'anak-penanda';
            radio.value = index;
            radio.checked = (index === indeksAktif);
            radio.onchange = function() {
                muatHalaman(parseInt(this.value));
            };
            
            label.appendChild(radio);
            label.appendChild(document.createTextNode(`Halaman ${index + 1}`));
            elRadioContainer.appendChild(label);
        });
    }

    // FUNGSI MEMBUAT HYPERLINK KUNCI DAN MASUKKAN DAFTAR KE SATU DROPDOWN UTAMA
    function buatPenandaDariBlokTeks() {
        const seleksi = window.getSelection();
        const teksTerpilih = seleksi.toString().trim();

        if (!teksTerpilih) {
            alert("Gagal! Silakan sorot/blok kalimat teks di dalam catatan terlebih dahulu sebelum memilih menu ini.");
            return;
        }

        const range = seleksi.getRangeAt(0);
        const aLink = document.createElement('span');
        aLink.className = 'hyperlink-bookmark';
        aLink.textContent = teksTerpilih;
        
        const penandaId = "link-" + Date.now();
        aLink.setAttribute('data-link-id', penandaId);

        range.deleteContents();
        range.insertNode(aLink);

        databaseBuku[indeksAktif].teks = elTextField.innerHTML;

        const dataRiwayat = {
            idHalaman: indeksAktif,
            linkId: penandaId,
            isiTeks: teksTerpilih
        };
        riwayatPenanda.push(dataRiwayat);

        // Masukkan daftar baru secara dinamis ke optgroup di dalam dropdown utama
        const opsiBaru = document.createElement('option');
        opsiBaru.value = "riwayat-" + (riwayatPenanda.length - 1);
        opsiBaru.text = `🔗 [Hlm ${indeksAktif + 1}] "${teksTerpilih.substring(0, 18)}..."`;
        elGrupRiwayat.appendChild(opsiBaru);

        seleksi.removeAllRanges();
        alert("Sukses! Kalimat dijadikan hyperlink dan masuk ke daftar riwayat dropdown atas.");
    }

    elTextField.addEventListener('input', function() {
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
    });

    function klikDuaKaliMajuLembar(event) {
        if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO') return;
        if (indeksAktif < databaseBuku.length - 1) {
            indeksAktif++;
        } else {
            indeksAktif = 0;
        }
        muatHalaman(indeksAktif);
    }

    function cariTeksBuku() {
        const kataKunci = prompt("Masukkan kata kunci catatan yang ingin dicari:");
        if (!kataKunci || !kataKunci.trim()) return;
        
        const indeksDitemukan = databaseBuku.findIndex(item => item.teks.toLowerCase().includes(kataKunci.toLowerCase().trim()));
        if (indeksDitemukan !== -1) { 
            muatHalaman(indeksDitemukan); 
        } else {
            alert("Kata kunci tidak ditemukan di catatan halaman manapun.");
        }
    }

    function eksekusiPilihanMenu() {
        const nilaiPilihan = elMenu.value;
        if (nilaiPilihan === 'default') return;

        // JIKA YANG DIKLIK ADALAH OPSI DARI RIWAYAT PENANDA
        if (nilaiPilihan.startsWith("riwayat-")) {
            const indeksRiwayat = parseInt(nilaiPilihan.replace("riwayat-", ""));
            const target = riwayatPenanda[indeksRiwayat];
            muatHalaman(target.idHalaman);
            
            setTimeout(() => {
                const elemenLink = elTextField.querySelector(`[data-link-id="${target.linkId}"]`);
                if (elemenLink) {
                    elemenLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    elemenLink.style.backgroundColor = "#ffcc00";
                    setTimeout(() => elemenLink.style.backgroundColor = "rgba(0, 102, 204, 0.1)", 1500);
                }
            }, 300);

            elMenu.value = 'default';
            return;
        }

        if (nilaiPilihan === 'aksi-tambah') {
            databaseBuku.push({ type: "text-only", src: "", teks: "", skala: 100 });
            muatHalaman(databaseBuku.length - 1);
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-bookmark') {
            buatPenandaDariBlokTeks();
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-cari') {
            cariTeksBuku();
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-wa') {
            const teksMurni = elTextField.innerText || elTextField.textContent;
            const teksKirim = encodeURIComponent(`Berikut update Catatan Buku Digital Lembar ${indeksAktif + 1}:\n\n"${teksMurni}"\n\nIkuti saluran KASY di WhatsApp: https://whatsapp.com`);
            
            const linkWA = document.createElement('a');
            linkWA.href = `https://wa.me{teksKirim}`;
            linkWA.target = '_blank';
            document.body.appendChild(linkWA);
            linkWA.click();
            document.body.removeChild(linkWA);
            
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-img') {
            document.getElementById('file-image').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-vid') {
            document.getElementById('file-video').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-mp3') {
            document.getElementById('file-audio').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-rekan') {
            toggleRekamSuara(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-hapus') {
            if (databaseBuku.length <= 1) { alert("Gagal! Sisa 1 halaman."); elMenu.value = 'default'; return; }
            if (confirm("Hapus lembar halaman ini?")) {
                databaseBuku.splice(indeksAktif, 1);
                if (indeksAktif >= databaseBuku.length) { indeksAktif = databaseBuku.length - 1; }
                muatHalaman(indeksAktif);
            }
            elMenu.value = 'default';
        }
    }

    // MEMPERBAIKI CARA BACA FILE UNTUK BROWSER SMARTPHONE MODERN
    function handleFileSelected(input, type) {
        if (input.files && input.files[0]) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                databaseBuku[indeksAktif] = { 
                    type: type, 
                    src: e.target.result, 
                    teks: elTextField.innerHTML, 
                    skala: 100 
                };
                muatHalaman(indeksAktif);
            };
            reader.readAsDataURL(file);
        }
    }

    function toggleRekamSuara() {
        if (!sedangMerekam) {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const audioURL = URL.createObjectURL(audioBlob);
                        databaseBuku[indeksAktif] = { type: 'audio', src: audioURL, teks: elTextField.innerHTML };
                        muatHalaman(indeksAktif);
                    };
                    mediaRecorder.start();
                    sedangMerekam = true;
                    elRecordIndicator.style.display = 'block';
                })
                .catch(err => alert("Gagal merekam! Gunakan tautan HTTPS resmi."));
            } else {
                alert("Browser belum mendukung perekam suara.");
            }
        } else {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            sedangMerekam = false;
            elRecordIndicator.style.display = 'none';
        }
    }

    muatHalaman(0);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Al-Quran & Buku Digital Modern</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku */
        .book-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
        }
        
        .dropdown-select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            text-align: center;
        }

        /* Area Gambar Utama (Bisa Diklik Sekali Langsung untuk Maju) */
        .content-area {
            width: 100%;
            height: 320px; 
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        video, audio {
            width: 90%;
            max-height: 90%;
        }

        /* AREA TEMPAT MENGETIK CATATAN (Selalu Terbuka & Aktif) */
        .text-work-space {
            padding: 15px;
            background-color: #fdfcf7;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }
        
        .book-textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            resize: none;
            font-size: 15px;
            line-height: 1.6;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #333;
            outline: none;
        }

        /* Status Rekaman */
        .record-status {
            font-weight: bold;
            color: #e74c3c;
            position: absolute;
            top: 10px;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Sembunyikan Input Bawaan */
        input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- MENU DROPDOWN KELOLA UTAMA -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">⚙️ -- MENU KELOLA BUKU --</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru</option>
                <option value="aksi-upload-vid">📹 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekam">🎙️ Mulai / Stop Rekam Suara</option>
                <option value="aksi-reset-total">🔄 Bersihkan & Atur Ulang Memori</option>
                <option value="aksi-hapus">🗑️ Hapus Lembar Ini</option>
            </select>
        </div>

        <!-- Input File Picker Perangkat -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- AREA GAMBAR: SEKARANG CUKUP DIKLIK 1X SAJA UNTUK MAJU KE HALAMAN BERIKUTNYA -->
        <div class="content-area" id="book-content" onclick="klikMajuLembar()">
            <div class="record-status" id="record-indicator">🔴 Sedang Merekam...</div>
            <div id="media-placeholder" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
        </div>

        <!-- AREA KETIK TEKS: PASTI BISA DIKETIK LANGSUNG KAPAN SAJA -->
        <div class="text-work-space">
            <textarea id="text-input-field" class="book-textarea" placeholder="Ketik kalimat atau isi catatan lembar buku di sini... (Otomatis Tersimpan)"></textarea>
        </div>

        <!-- INDIKATOR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 3</div>
    </div>

    <script>
        // Jalur gambar asli repositori kreatif Anda di GitHub
        const susunanAwalMurni = [
            { type: "image", src: "File/Gambar/Buku/A.png", teks: "Ketik catatan untuk Lembar A di sini..." }, 
            { type: "image", src: "File/Gambar/Buku/B.png", teks: "Ketik catatan untuk Lembar B di sini..." }, 
            { type: "image", src: "File/Gambar/Buku/C.png", teks: "Ketik catatan untuk Lembar C di sini..." }  
        ];

        let databaseBuku = [...susunanAwalMurni];

        // Membaca memori penyimpanan lokal browser
        if (localStorage.getItem('bukuSistem_FinalClean')) {
            databaseBuku = JSON.parse(localStorage.getItem('bukuSistem_FinalClean'));
        }

        let indeksAktif = 0;
        let mediaRecorder;
        let audioChunks = [];
        let sedangMerekam = false;

        const elContent = document.getElementById('book-content');
        const elPlaceholder = document.getElementById('media-placeholder');
        const elMenu = document.getElementById('menu-navigasi');
        const elIndikator = document.getElementById('page-indicator');
        const elTextField = document.getElementById('text-input-field');
        const elRecordIndicator = document.getElementById('record-indicator');

        // Fungsi utama menampilkan lembaran halaman
        function muatHalaman(indeks) {
            indeksAktif = indeks;
            const data = databaseBuku[indeksAktif];
            elPlaceholder.innerHTML = '';
            elContent.style.backgroundImage = 'none';

            if (data.type === 'image') {
                elContent.style.backgroundImage = `url('${data.src}')`;
            } else if (data.type === 'video') {
                elPlaceholder.innerHTML = `<video src="${data.src}" controls></video>`;
            } else if (data.type === 'audio') {
                elPlaceholder.innerHTML = `<audio src="${data.src}" controls></audio>`;
            }

            // Memasukkan teks catatan ke dalam kotak agar bisa langsung diketik
            elTextField.value = data.teks || "";
            elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
            
            localStorage.setItem('bukuSistem_FinalClean', JSON.stringify(databaseBuku));
        }

        // Fungsi Menyimpan otomatis isi tulisan saat user sedang mengetik teks
        elTextField.addEventListener('input', function() {
            databaseBuku[indeksAktif].teks = elTextField.value;
            localStorage.setItem('bukuSistem_FinalClean', JSON.stringify(databaseBuku));
        });

        // FUNGSI KLIK 1X: Cukup klik sekali di atas gambar, buku langsung maju halaman berikutnya
        function klikMajuLembar() {
            // Jangan membalik halaman jika user sedang menekan tombol play video/audio
            if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO') return;

            if (indeksAktif < databaseBuku.length - 1) {
                indeksAktif++;
            } else {
                indeksAktif = 0; // Kembali ke cover awal jika sudah di akhir
            }
            muatHalaman(indeksAktif);
        }

        // KONTROL UTAMA MENU DROPDOWN
        function eksekusiPilihanMenu() {
            const nilaiPilihan = elMenu.value;

            if (nilaiPilihan === 'aksi-wa') {
                const teksKirim WA = encodeURIComponent(`*Catatan Lembar ${indeksAktif + 1}:*\n${elTextField.value}`);
                window.open(`https://whatsapp.com{teksKirim WA}`, '_blank');
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-upload-img') {
                document.getElementById('file-image').click();
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-upload-vid') {
                document.getElementById('file-video').click();
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-upload-mp3') {
                document.getElementById('file-audio').click();
                elMenu.value = 'default';
            } 
            else if (nilaiPilihan === 'aksi-rekam') {
                toggleRekamSuara();
                elMenu.value = 'default';
            }
            else if (nilaiPilihan === 'aksi-reset-total') {

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Buku Digital</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku - FULL PAGE KIRI KANAN */
        .book-container {
            width: 100%;
            max-width: 440px;
            height: 100vh;
            background: white;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
        }

        .dropdown-select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }

        /* Panel Kontrol Posisi Gambar Aktif */
        .image-tools-panel {
            background-color: #34495e;
            padding: 8px;
            display: none; 
            align-items: center;
            justify-content: space-between;
            gap: 5px;
            border-bottom: 1px solid #2c3e50;
            z-index: 20;
        }

        .tool-btn {
            background-color: #1a252f;
            color: white;
            border: 1px solid #7f8c8d;
            padding: 4px 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .tool-btn:hover { background-color: #2ecc71; }

        /* Status Perekaman Suara */
        .record-status {
            font-weight: bold;
            color: white;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            background: #e74c3c;
            padding: 8px 16px;
            border-radius: 20px;
            z-index: 30;
            cursor: pointer;
            border: 2px solid white;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse { from { transform: scale(1) translateX(-50%); } to { transform: scale(1.05) translateX(-50%); } }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
            z-index: 20;
        }

        /* AREA MULTI-GAMBAR: Menampung banyak gambar sekaligus */
        .content-area {
            width: 100%;
            height: 260px;
            background-color: #ecf0f1; 
            position: relative;
            box-sizing: border-box;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-wrap: wrap; 
            gap: 10px;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 5;
        }

        /* KOTAK GAMBAR DINAMIS YANG BISA DIATUR */
        .img-wrapper {
            position: relative;
            display: inline-block;
            border: 2px dashed transparent;
            box-sizing: border-box;
            max-width: 100%;
        }

        /* Bingkai penanda gambar aktif */
        .img-wrapper.active-target {
            border-color: #2ecc71;
            background-color: rgba(46, 204, 113, 0.1);
        }

        .img-wrapper img {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: auto;
        }

        video, audio {
            width: 100%;
            max-height: 100%;
            z-index: 6;
        }
        /* AREA TEKS CATATAN PENUH */
        .text-work-space {
            padding: 20px;
            background-color: #ffffff;
            border: none;
            margin: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            color: #333;
            font-size: 16px;
            line-height: 1.6;
            overflow-y: auto;
            outline: none;
            flex-grow: 1;
            position: relative;
            z-index: 10;
        }

        /* GAYA HYPERLINK PENANDA */
        .hyperlink-bookmark {
            color: #0066cc;
            text-decoration: underline;
            font-weight: bold;
            cursor: pointer;
            background-color: rgba(0, 102, 204, 0.1);
            padding: 0 2px;
            border-radius: 3px;
        }

        .radio-dropdown-panel {
            padding: 8px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            align-items: center;
            z-index: 20;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            cursor: pointer;
        }
        
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- SATU DROPDOWN UTAMA DI ATAS -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">-- MENU UTAMA KELOLA BUKU --</option>
                <option value="aksi-tambah">➕ Tambah Halaman Baru</option>
                <option value="aksi-bookmark">📌 Jadikan Teks Diblok Sebagai Penanda</option>
                <option value="aksi-cari">🔍 Jalankan Pencarian Kata Kunci Catatan</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp KASY</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru (Bisa Banyak)</option>
                <option value="aksi-upload-vid">🎥 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekan">🎙️ Mulai Perekaman Suara</option>
                <option value="aksi-hapus">❌ Hapus Lembar Ini</option>
                <optgroup label="📂 DAFTAR RIWAYAT PENANDA TEKS" id="grup-riwayat-penanda">
                    <!-- Diisi otomatis -->
                </optgroup>
            </select>
        </div>

        <!-- PANEL TOMBOL ATUR BESAR KECIL & POSISI MEDIA -->
        <div class="image-tools-panel" id="image-tools">
            <button class="tool-btn" onclick="ubahUkuranAktif(20)">➕ Perbesar</button>
            <button class="tool-btn" onclick="ubahUkuranAktif(-20)">➖ Perkecil</button>
            <button class="tool-btn" onclick="ubahPosisiAktif('flex-start', 'flex-start')">↖️ Kiri Atas</button>
            <button class="tool-btn" onclick="ubahPosisiAktif('center', 'center')">🔲 Tengah</button>
            <button class="tool-btn" onclick="ubahPosisiAktif('flex-end', 'flex-end')">↘️ Kanan Bawah</button>
            <button class="tool-btn" onclick="hapusGambarAktif()" style="background:#e74c3c;">❌ Hapus</button>
        </div>

        <!-- PANEL RADIO BUTTON -->
        <div class="radio-dropdown-panel" id="radio-container">
            <!-- Diisi otomatis -->
        </div>

        <!-- Input File Picker Perangkat -->
        <input type="file" id="file-image" accept="image/*" multiple onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- AREA MULTI-MEDIA GAMBAR & VIDEO -->
        <div class="content-area" id="book-content" ondblclick="klikDuaKaliMajuLembar(event)" onclick="hilangkanFokusGambar(event)">
            <button class="record-status" id="record-indicator" onclick="toggleRekamSuara()">🔴 ⏹️ Klik di Sini untuk Stop Rekam</button>
            <div id="media-placeholder" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none; position: absolute;"></div>
        </div>

        <!-- AREA KETIK TEKS MELEBAR FULL PAGE -->
        <div id="text-input-field" class="text-work-space" contenteditable="true" placeholder="Silakan ketik catatan lembar baru Anda di sini..." ondblclick="klikDuaKaliMajuLembar(event)"></div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 1</div>
    </div>
<script>
    let databaseBuku = [
        { type: "image", mediaList: [{ src: "./File/Gambar/Buku/B.png", lebar: 120 }], teks: "" }
    ];

    let riwayatPenanda = [];
    let indeksAktif = 0;
    let indeksGambarDipilih = null; 
    let mediaRecorder;
    let audioChunks = [];
    let sedangMerekam = false;

    const elContent = document.getElementById('book-content');
    const elPlaceholder = document.getElementById('media-placeholder');
    const elMenu = document.getElementById('menu-navigasi');
    const elGrupRiwayat = document.getElementById('grup-riwayat-penanda');
    const elIndikator = document.getElementById('page-indicator');
    const elTextField = document.getElementById('text-input-field');
    const elRecordIndicator = document.getElementById('record-indicator');
    const elRadioContainer = document.getElementById('radio-container');
    const elImageTools = document.getElementById('image-tools');

    function muatHalaman(indeks) {
        indeksAktif = indeks;
        const data = databaseBuku[indeksAktif];
        elPlaceholder.innerHTML = '';
        elImageTools.style.display = 'none';
        indeksGambarDipilih = null;

        const wrappersLama = elContent.querySelectorAll('.img-wrapper, video, audio');
        wrappersLama.forEach(w => w.remove());

        if (data.type === 'text-only') {
            elContent.style.display = 'none'; 
        } else {
            elContent.style.display = 'flex'; 
            elContent.style.alignItems = data.alignItems || 'flex-start';
            elContent.style.justifyContent = data.justifyContent || 'flex-start';

            if (data.mediaList && data.mediaList.length > 0) {
                data.mediaList.forEach((mediaItem, idx) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'img-wrapper';
                    wrapper.style.width = (mediaItem.lebar || 120) + 'px';
                    
                    const img = document.createElement('img');
                    img.src = mediaItem.src;
                    
                    wrapper.onclick = function(e) {
                        e.stopPropagation(); 
                        pilihGambarTarget(idx, wrapper);
                    };

                    wrapper.appendChild(img);
                    elContent.appendChild(wrapper);
                });
            } else if (data.type === 'video') {
                elPlaceholder.innerHTML = `<video src="${data.src}" controls></video>`;
            } else if (data.type === 'audio') {
                elPlaceholder.innerHTML = `<audio src="${data.src}" controls></audio>`;
            }
        }

        elTextField.innerHTML = data.teks || "";
        elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
        renderRadioHalaman();
    }

    function pilihGambarTarget(idx, elemenWrapper) {
        indeksGambarDipilih = idx;
        const semuaWrapper = elContent.querySelectorAll('.img-wrapper');
        semuaWrapper.forEach(w => w.classList.remove('active-target'));
        elemenWrapper.classList.add('active-target');
        elImageTools.style.display = 'flex'; 
    }

    function hilangkanFokusGambar(event) {
        if(event.target.id === 'book-content') {
            indeksGambarDipilih = null;
            elImageTools.style.display = 'none';
            const semuaWrapper = elContent.querySelectorAll('.img-wrapper');
            semuaWrapper.forEach(w => w.classList.remove('active-target'));
        }
    }

    function ubahUkuranAktif(nilaiTambah) {
        if (indeksGambarDipilih === null) return;
        let mediaItem = databaseBuku[indeksAktif].mediaList[indeksGambarDipilih];
        let lebarLama = mediaItem.lebar || 120;
        let lebarBaru = lebarLama + nilaiTambah;
        
        if (lebarBaru < 40) lebarBaru = 40; 
        if (lebarBaru > 400) lebarBaru = 400; 

        mediaItem.lebar = lebarBaru;
        muatHalaman(indeksAktif);
        
        setTimeout(() => {
            const semuaW = elContent.querySelectorAll('.img-wrapper');
            if(semuW[indeksGambarDipilih]) pilihGambarTarget(indeksGambarDipilih, semuaW[indeksGambarDipilih]);
        }, 50);
    }

    function ubahPosisiAktif(alignVal, justifyVal) {
        databaseBuku[indeksAktif].alignItems = alignVal;
        databaseBuku[indeksAktif].justifyContent = justifyVal;
        muatHalaman(indeksAktif);
    }
    function hapusGambarAktif() {
        if (indeksGambarDipilih === null) return;
        databaseBuku[indeksAktif].mediaList.splice(indeksGambarDipilih, 1);
        muatHalaman(indeksAktif);
    }

    function buatPenandaDariBlokTeks() {
        const seleksi = window.getSelection();
        const teksTerpilih = seleksi.toString().trim();

        if (!teksTerpilih) {
            alert("Gagal! Silakan sorot/blok kalimat teks catatan Anda terlebih dahulu.");
            return;
        }

        const range = seleksi.getRangeAt(0);
        const aLink = document.createElement('span');
        aLink.className = 'hyperlink-bookmark';
        aLink.textContent = teksTerpilih;
        
        const penandaId = "link-" + Date.now();
        aLink.setAttribute('data-link-id', penandaId);

        range.deleteContents();
        range.insertNode(aLink);

        databaseBuku[indeksAktif].teks = elTextField.innerHTML;

        const dataRiwayat = { idHalaman: indeksAktif, linkId: penandaId, isiTeks: teksTerpilih };
        riwayatPenanda.push(dataRiwayat);

        const opsiBaru = document.createElement('option');
        opsiBaru.value = "riwayat-" + (riwayatPenanda.length - 1);
        opsiBaru.text = `🔗 [Hlm ${indeksAktif + 1}] "${teksTerpilih.substring(0, 18)}..."`;
        elGrupRiwayat.appendChild(opsiBaru);

        seleksi.removeAllRanges();
        alert("Sukses! Kalimat dijadikan hyperlink penanda.");
    }

    function lompatKeRiwayatPenanda() {
        const nilaiPilihan = elMenu.value;
        if (!nilaiPilihan.startsWith("riwayat-")) return;
        
        const indeksRiwayat = parseInt(nilaiPilihan.replace("riwayat-", ""));
        const target = riwayatPenanda[indeksRiwayat];
        muatHalaman(target.idHalaman);
        
        setTimeout(() => {
            const elemenLink = elTextField.querySelector(`[data-link-id="${target.linkId}"]`);
            if (elemenLink) {
                elemenLink.scrollIntoView({ behavior: 'smooth', block: 'center' });
                elemenLink.style.backgroundColor = "#ffcc00";
                setTimeout(() => elemenLink.style.backgroundColor = "rgba(0, 102, 204, 0.1)", 1500);
            }
        }, 300);
        elMenu.value = 'default';
    }

    function renderRadioHalaman() {
        elRadioContainer.innerHTML = '';
        databaseBuku.forEach((item, index) => {
            const label = document.createElement('label');
            label.className = 'radio-item';
            const radio = document.createElement('input');
            radio.type = 'radio'; radio.name = 'anak-penanda'; radio.value = index;
            radio.checked = (index === indeksAktif);
            radio.onchange = function() { muatHalaman(parseInt(this.value)); };
            label.appendChild(radio);
            label.appendChild(document.createTextNode(`Halaman ${index + 1}`));
            elRadioContainer.appendChild(label);
        });
    }

    elTextField.addEventListener('input', function() {
        databaseBuku[indeksAktif].teks = elTextField.innerHTML;
    });

    function klikDuaKaliMajuLembar(event) {
        if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO' || event.target.tagName === 'IMG') return;
        if (indeksAktif < databaseBuku.length - 1) { indeksAktif++; } else { indeksAktif = 0; }
        muatHalaman(indeksAktif);
    }

    function cariTeksBuku() {
        const kataKunci = prompt("Masukkan kata kunci catatan yang ingin dicari:");
        if (!kataKunci || !kataKunci.trim()) return;
        const indeksDitemukan = databaseBuku.findIndex(item => item.teks.toLowerCase().includes(kataKunci.toLowerCase().trim()));
        if (indeksDitemukan !== -1) { muatHalaman(indeksDitemukan); } else { alert("Kata kunci tidak ditemukan."); }
    }

    function eksekusiPilihanMenu() {
        const nilaiPilihan = elMenu.value;
        if (nilaiPilihan === 'default') return;
        if (nilaiPilihan.startsWith("riwayat-")) { lompatKeRiwayatPenanda(); return; }

        if (nilaiPilihan === 'aksi-tambah') {
            databaseBuku.push({ type: "text-only", src: "", mediaList: [], teks: "" });
            muatHalaman(databaseBuku.length - 1);
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-bookmark') {
            buatPenandaDariBlokTeks();
            elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-cari') {
            cariTeksBuku(); elMenu.value = 'default';
        }
        else if (nilaiPilihan === 'aksi-wa') {
            const teksMurni = elTextField.innerText || elTextField.textContent;
            const teksKirim = encodeURIComponent(`Berikut update Catatan Buku Digital Lembar ${indeksAktif + 1}:\n\n"${teksMurni}"\n\nIkuti saluran KASY di WhatsApp: https://whatsapp.com`);
            const linkWA = document.createElement('a'); linkWA.href = `https://wa.me{teksKirim}`; linkWA.target = '_blank';
            document.body.appendChild(linkWA); linkWA.click(); document.body.removeChild(linkWA);
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-img') {
            document.getElementById('file-image').click(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-vid') {
            document.getElementById('file-video').click(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-mp3') {
            document.getElementById('file-audio').click(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-rekan') {
            toggleRekamSuara(); elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-hapus') {
            if (databaseBuku.length <= 1) { alert("Gagal!"); elMenu.value = 'default'; return; }
            if (confirm("Hapus lembar halaman ini?")) {
                databaseBuku.splice(indeksAktif, 1);
                if (indeksAktif >= databaseBuku.length) { indeksAktif = databaseBuku.length - 1; }
                muatHalaman(indeksAktif);
            }
            elMenu.value = 'default';
        }
    }

    function handleFileSelected(input, type) {
        if (input.files && input.files.length > 0) {
            let filesArray = Array.from(input.files);
            let counter = 0;

            if (!databaseBuku[indeksAktif].mediaList) {
                databaseBuku[indeksAktif].mediaList = [];
            }
            databaseBuku[indeksAktif].type = 'image';

            filesArray.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    databaseBuku[indeksAktif].mediaList.push({
                        src: e.target.result,
                        lebar: 120 
                    });
                    counter++;
                    if (counter === filesArray.length) {
                        muatHalaman(indeksAktif);
                    }
                };
                reader.readAsDataURL(file);
            });
        }
    }

    function toggleRekamSuara() {
        if (!sedangMerekam) {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream); audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                        const audioURL = URL.createObjectURL(audioBlob);
                        databaseBuku[indeksAktif] = { type: 'audio', src: audioURL, teks: elTextField.innerHTML };
                        muatHalaman(indeksAktif);
                    };
                    mediaRecorder.start(); sedangMerekam = true; elRecordIndicator.style.display = 'block';
                }).catch(err => alert("Gagal merekam!"));
            }
        } else {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop(); mediaRecorder.stream.getTracks().forEach(track => track.stop());
            }
            sedangMerekam = false; elRecordIndicator.style.display = 'none';
        }
    }

    muatHalaman(0);
</script>
</body>
</html>

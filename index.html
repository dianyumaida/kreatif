<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Buku & Gambar</title>
    <!-- Tailwind CSS untuk Desain Modern -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">📚 Sistem Manajemen Buku</h1>
            <p class="text-gray-600 mt-2">Sinkronisasi otomatis dengan folder File/Gambar/Buku/</p>
        </header>

        <!-- Form Tambah/Edit Buku -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 id="form-title" class="text-xl font-semibold mb-4 text-gray-700">Tambah / Scan Buku Baru</h2>
            <form id="buku-form" class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Nama File Gambar</label>
                    <input type="text" id="nama-file" placeholder="Contoh: A.png atau D.png" required
                        class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Judul Buku</label>
                    <input type="text" id="judul-buku" placeholder="Masukkan judul buku" required
                        class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Pengarang</label>
                    <input type="text" id="pengarang-buku" placeholder="Nama pengarang" required
                        class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <input type="hidden" id="edit-id">
                    <button type="submit" id="btn-submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200">
                        Simpan Buku
                    </button>
                </div>
            </form>
        </div>

        <!-- Daftar Buku (Grid Card) -->
        <h2 class="text-2xl font-bold text-gray-800 mb-4">Daftar Koleksi Buku</h2>
        <div id="daftar-buku-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- Data Buku akan muncul di sini otomatis lewat JavaScript -->
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        // Data Awal Mockup berdasarkan gambar yang Anda miliki (A, B, C)
        const dataAwal = [
            { id: "A", kode: "BK-A", judul: "Buku Seri A", pengarang: "Penulis A", gambar: "File/Gambar/Buku/A.png" },
            { id: "B", kode: "BK-B", judul: "Buku Seri B", pengarang: "Penulis B", gambar: "File/Gambar/Buku/B.png" },
            { id: "C", kode: "BK-C", judul: "Buku Seri C", pengarang: "Penulis C", gambar: "File/Gambar/Buku/C.png" }
        ];

        // Ambil data dari LocalStorage, jika kosong pakai dataAwal
        let databaseBuku = JSON.parse(localStorage.getItem('databaseBuku')) || dataAwal;

        const container = document.getElementById('daftar-buku-container');
        const form = document.getElementById('buku-form');
        const inputNamaFile = document.getElementById('nama-file');
        const inputJudul = document.getElementById('judul-buku');
        const inputPengarang = document.getElementById('pengarang-buku');
        const inputEditId = document.getElementById('edit-id');
        const btnSubmit = document.getElementById('btn-submit');
        const formTitle = document.getElementById('form-title');

        // Fungsi Menampilkan Buku ke Layar
        function tampilkanBuku() {
            container.innerHTML = "";
            
            if (databaseBuku.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-gray-500 py-8">Tidak ada data buku. Silahkan tambah baru.</p>`;
                return;
            }

            databaseBuku.forEach(buku => {
                const card = document.createElement('div');
                card.className = "bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm hover:shadow-md transition duration-200 flex flex-col";
                
                card.innerHTML = `
                    <div class="h-48 bg-gray-200 flex items-center justify-center overflow-hidden border-b">
                        <!-- Memanggil gambar sesuai struktur folder Anda -->
                        <img src="${buku.gambar}" alt="${buku.judul}" onerror="this.src='https://placehold.co'" class="object-cover w-full h-full">
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <span class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded mb-2">${buku.kode}</span>
                            <h3 class="text-lg font-bold text-gray-800 line-clamp-1">${buku.judul}</h3>
                            <p class="text-sm text-gray-600 mt-1">👤 ${buku.pengarang}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mt-4">
                            <button onclick="pemicuEdit('${buku.id}')" class="bg-amber-500 hover:bg-amber-600 text-white text-sm font-medium py-1.5 rounded-lg transition">📝 Edit</button>
                            <button onclick="hapusBuku('${buku.id}')" class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium py-1.5 rounded-lg transition">🗑️ Hapus</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Simpan perubahan ke LocalStorage browser
            localStorage.setItem('databaseBuku', JSON.stringify(databaseBuku));
        }

        // Fungsi Tambah & Edit Buku (Auto Increment Kode)
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const namaFileRaw = inputNamaFile.value.trim();
            // Bersihkan nama file dari ekstensi jika user mengetik .png/.jpg
            const idBuku = namaFileRaw.replace(/\.[^/.]+$/, "").toUpperCase(); 
            const judul = inputJudul.value.trim();
            const pengarang = inputPengarang.value.trim();
            const editId = inputEditId.value;

            if (editId) {
                // Mode Edit Data
                const index = databaseBuku.findIndex(b => b.id === editId);
                if (index !== -1) {
                    databaseBuku[index].judul = judul;
                    databaseBuku[index].pengarang = pengarang;
                }
                // Reset Form ke mode Tambah
                inputEditId.value = "";
                inputNamaFile.disabled = false;
                formTitle.innerText = "Tambah / Scan Buku Baru";
                btnSubmit.innerText = "Simpan Buku";
            } else {
                // Mode Tambah Otomatis Baru (Auto Tambah berdasarkan input nama file gambar)
                const cekDuplikat = databaseBuku.some(b => b.id === idBuku);
                if (cekDuplikat) {
                    alert(`Kode Buku untuk file ${idBuku} sudah ada di daftar!`);
                    return;
                }

                const bukuBaru = {
                    id: idBuku,
                    kode: `BK-${idBuku}`, // Format Auto-Increment berdasarkan Nama Gambar (Misal: BK-D)
                    judul: judul,
                    pengarang: pengarang,
                    gambar: `File/Gambar/Buku/${namaFileRaw.includes('.') ? namaFileRaw : namaFileRaw + '.png'}`
                };
                databaseBuku.push(bukuBaru);
            }

            form.reset();
            tampilkanBuku();
        });

        // Pemicu Tombol Edit (Memasukkan data ke form atas)
        window.pemicuEdit = function(id) {
            const buku = databaseBuku.find(b => b.id === id);
            if (buku) {
                // Ambil nama file asli dari string path gambar
                const namaFileAsli = buku.gambar.split('/').pop();
                
                inputNamaFile.value = namaFileAsli;
                inputNamaFile.disabled = true; // Kunci kode utama/gambar agar tidak merusak relasi
                inputJudul.value = buku.judul;
                inputPengarang.value = buku.pengarang;
                inputEditId.value = id;

                formTitle.innerText = `Edit Informasi: ${buku.kode}`;
                btnSubmit.innerText = "Perbarui Data";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        // Fungsi Hapus Buku
        window.applyHapusBuku = function(id) {
            if (confirm("Apakah Anda yakin ingin menghapus buku ini dari daftar?")) {
                databaseBuku = databaseBuku.filter(b => b.id !== id);
                tampilkanBuku();
            }
        };
        // Mapping global alias agar bisa dipanggil inline onclick
        window.hapusBuku = window.applyHapusBuku;

        // Jalankan fungsi tampilkan saat web pertama dibuka
        tampilkanBuku();
    </script>
</body>
</html>

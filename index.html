<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Buku Digital</title>
    <style>
        body {
            background-color: #1a252f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        /* Kontainer Utama Buku */
        .book-container {
            width: 100%;
            max-width: 420px;
            height: 580px; /* Dikunci tingginya agar kotak teks bisa meluas penuh ke bawah */
            background: white;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Area Menu Navigasi Atas */
        .nav-header {
            background-color: #2c3e50;
            padding: 12px;
            border-bottom: 2px solid #34495e;
        }

        .dropdown-select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #7f8c8d;
            background-color: #1a252f;
            color: white;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            text-align: center;
        }

        /* Status Rekaman */
        .record-status {
            font-weight: bold;
            color: #e74c3c;
            position: absolute;
            top: 10px;
            display: none;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 4px;
            z-index: 10;
        }

        /* Info Indikator Halaman Paling Bawah */
        .page-footer {
            text-align: center;
            padding: 12px;
            background: #f1f2f6;
            border-top: 1px solid #ddd;
            font-size: 14px;
            font-weight: bold;
            color: #7f8c8d;
        }

        /* Area Gambar Utama */
        .content-area {
            width: 100%;
            height: 320px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
            cursor: pointer;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        video, audio {
            width: 90%;
            max-height: 90%;
            z-index: 5;
        }

        /* Sembunyikan Input Bawaan */
        input[type="file"] {
            display: none;
        }

        /* Area Tempat Mengetik Catatan (Dibuat Flex-Grow) */
        .text-work-space {
            padding: 0;
            background-color: #fdfcf7;
            border-top: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            width: 100%;
            flex-grow: 1; /* Menarik area teks agar memenuhi sisa ruang */
        }

        .book-textarea {
            width: 100%;
            height: 100%; /* Dibuat 100% agar otomatis meninggi penuh */
            padding: 15px;
            border: none;
            margin: 0;
            resize: none;
            font-size: 15px;
            line-height: 1.6;
            box-sizing: border-box;
            background-color: #ffffff;
            color: #333;
            outline: none;
            flex-grow: 1;
        }
    </style>
</head>
<body>

    <div class="book-container">
        <!-- MENU DROPDOWN KELOLA UTAMA -->
        <div class="nav-header">
            <select class="dropdown-select" id="menu-navigasi" onchange="eksekusiPilihanMenu()">
                <option value="default">-- MENU KELOLA BUKU --</option>
                <option value="aksi-wa">📲 Auto Kirim ke Saluran WhatsApp</option>
                <option value="aksi-upload-img">🖼️ Upload Gambar Baru</option>
                <option value="aksi-upload-vid">🎥 Upload Video Baru</option>
                <option value="aksi-upload-mp3">🎵 Upload Lagu MP3</option>
                <option value="aksi-rekan">🎙️ Mulai / Stop Rekam Suara</option>
                <option value="aksi-hapus">❌ Hapus Lembar Ini</option>
            </select>
        </div>

        <!-- Input File Picker Perangkat -->
        <input type="file" id="file-image" accept="image/*" onchange="handleFileSelected(this, 'image')">
        <input type="file" id="file-video" accept="video/*" onchange="handleFileSelected(this, 'video')">
        <input type="file" id="file-audio" accept="audio/*" onchange="handleFileSelected(this, 'audio')">

        <!-- AREA GAMBAR -->
        <div class="content-area" id="book-content" ondblclick="klikDuaKaliMajuLembar(event)">
            <div class="record-status" id="record-indicator">🔴 Sedang Merekam...</div>
            <div id="media-placeholder" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; pointer-events: none;"></div>
        </div>

        <!-- AREA KETIK TEKS (Dapat didouble-click juga jika area gambar sedang hilang) -->
        <div class="text-work-space" ondblclick="klikDuaKaliMajuLembar(event)">
            <textarea id="text-input-field" class="book-textarea" placeholder="Ketik kalimat atau isi catatan lembar baru di sini..."></textarea>
        </div>

        <!-- INDIKATOR STRUKTUR HALAMAN BAWAH -->
        <div class="page-footer" id="page-indicator">Lembar 1 dari 3</div>
    </div>

<script>
    localStorage.clear();

    // Contoh data: Lembar kedua ("text-only") dikosongkan src-nya untuk tes lembar teks penuh
    let databaseBuku = [
        { type: "image", src: "./File/Gambar/Buku/A.png", teks: "Ini halaman pertama dengan gambar." },
        { type: "text-only", src: "./File/Gambar/Buku/B.png", teks: "Ini halaman teks penuh! Karena tidak ada gambar, area teks meluas secara otomatis menutupi satu lembar penuh halaman buku." },
        { type: "image", src: "./File/Gambar/Buku/C.png", teks: "Ini halaman ketiga dengan gambar kembali." }
    ];

    let indeksAktif = 0;
    let mediaRecorder;
    let audioChunks = [];
    let sedangMerekam = false;

    const elContent = document.getElementById('book-content');
    const elPlaceholder = document.getElementById('media-placeholder');
    const elMenu = document.getElementById('menu-navigasi');
    const elIndikator = document.getElementById('page-indicator');
    const elTextField = document.getElementById('text-input-field');
    const elRecordIndicator = document.getElementById('record-indicator');

    // LOGIKA DINAMIS: Menyembunyikan gambar jika tipe halaman adalah 'text-only' atau src kosong
    function muatHalaman(indeks) {
        indeksAktif = indeks;
        const data = databaseBuku[indeksAktif];
        elPlaceholder.innerHTML = '';
        elContent.style.backgroundImage = 'none';

        // Jika halaman tidak punya media / berupa teks saja
        if (data.type === 'text-only' || !data.src) {
            elContent.style.display = 'none'; // Sembunyikan kotak gambar
        } else {
            elContent.style.display = 'flex'; // Munculkan kembali kotak gambar jika ada media
            
            if (data.type === 'image') {
                elContent.style.backgroundImage = `url('${data.src}')`;
            } else if (data.type === 'video') {
                elPlaceholder.innerHTML = `<video src="${data.src}" controls></video>`;
            } else if (data.type === 'audio') {
                elPlaceholder.innerHTML = `<audio src="${data.src}" controls></audio>`;
            }
        }

        elTextField.value = data.teks || "";
        elIndikator.innerText = `Lembar ${indeksAktif + 1} dari ${databaseBuku.length}`;
    }

    elTextField.addEventListener('input', function() {
        databaseBuku[indeksAktif].teks = elTextField.value;
    });

    function klikDuaKaliMajuLembar(event) {
        if (event.target.tagName === 'VIDEO' || event.target.tagName === 'AUDIO') return;

        if (indeksAktif < databaseBuku.length - 1) {
            indeksAktif++;
        } else {
            indeksAktif = 0;
        }
        muatHalaman(indeksAktif);
    }

    function eksekusiPilihanMenu() {
        const nilaiPilihan = elMenu.value;
        if (nilaiPilihan === 'default') return;

        if (nilaiPilihan === 'aksi-wa') {
            const teksKirim = encodeURIComponent(`Catatan Lembar ${indeksAktif + 1}:\n${elTextField.value}`);
            window.open(`https://whatsapp.com{teksKirim}`, '_blank');
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-img') {
            document.getElementById('file-image').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-vid') {
            document.getElementById('file-video').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-upload-mp3') {
            document.getElementById('file-audio').click();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-rekan') {
            toggleRekamSuara();
            elMenu.value = 'default';
        } 
        else if (nilaiPilihan === 'aksi-hapus') {
            if (databaseBuku.length <= 1) {
                alert("Gagal! Minimal harus menyisakan 1 halaman.");
                elMenu.value = 'default';
                return;
            }
            if (confirm("Hapus lembar halaman ini?")) {
                databaseBuku.splice(indeksAktif, 1);
                if (indeksAktif >= databaseBuku.length) {
                    indeksAktif = databaseBuku.length - 1;
                }
                muatHalaman(indeksAktif);
            }
                // SAMBUNGAN KODE UTK HTML PENUTUP
    function toggleRekamSuara() {
        sedangMerekam = !sedangMerekam;
        if (sedangMerekam) {
            elRecordIndicator.style.display = 'block';
        } else {
            elRecordIndicator.style.display = 'none';
        }
    }

    // Memuat data halaman pertama saat web pertama kali dibuka
    muatHalaman(0);
</script>

</body>
</html>

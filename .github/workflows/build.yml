name: Build APK and Deploy Web

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        channel: 'stable'

    # 🤖 Langkah Pintar: Membuat otomatis folder sistem Android & Web yang hilang
    - name: Recreate Platform Folders
      run: |
        cp lib/main.dart main.dart.bak
        flutter create --overwrite .
        cp main.dart.bak lib/main.dart

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: digitub-app-apk
        path: build/app/outputs/flutter-apk/app-release.apk

    - name: Build Web Version
      run: flutter build web --release --base-href /${{ github.event.repository.name }}/

    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build/web
        branch: gh-pages
